<script id="hpi-method" type="application/json">"<h1>Methodology \u2014 Historical Portfolio Intelligence<\/h1>\n<p>This document describes exactly how the dashboard reads its source \u2014 the Google Sheet \u2014 builds its data model and calculates every figure. It is embedded in the dashboard (Data &amp; audit \u2192 Methodology) and shipped as <code>METHODOLOGY.md<\/code>; both come from the same source file.<\/p>\n<h2>1. Purpose and independence<\/h2>\n<p>The dashboard makes month-by-month mutual fund portfolio history explorable: what a portfolio held in any month, how it changed, and how two portfolios overlap. It is a separate application. It does not read, modify or depend on the Fund Performance Dashboard, and it stores its settings under its own browser-storage key (<code>hpi-historical-portfolio-intelligence:v1:state<\/code>) so the two never interfere, even when both are opened from the same folder.<\/p>\n<h2>2. The source: the Google Sheet<\/h2>\n<p>All data comes from one Google Sheet, <a href=\"https://docs.google.com/spreadsheets/d/1dsTX9-ziZ6ldBt8ycLog289xPQqggJcmThtR361gljE/edit?usp=sharing\" target=\"_blank\" rel=\"noopener noreferrer\">White List Dashboard<\/a> (first tab), which holds the portfolio-history export. Nothing else is used as data and no data is stored in the dashboard file. The sheet is read every time the dashboard opens, through a Google Sheets query \u2014 the route Google allows both from a file opened from disk and from a web address. The layout is detected from the header rows rather than fixed column positions:<\/p>\n<ul>\n<li><strong>Row 1<\/strong> holds band titles above each metric block (merged cells). <strong>Row 2<\/strong> holds headers: text for identifier and attribute columns, months for month columns. Month headers are read from the label the sheet displays \u2014 \u201cSep-26\u201d is September 2026. (When \u201cMon-YY\u201d text is typed into Google Sheets, it stores a date in the current year with YY as the day, so \u201cJun-18\u201d is held as 18 June 2026; the displayed label is what identifies the month.)<\/li>\n<li>Month columns appear in runs of date headers; a run is split wherever row 1 carries a band title, giving one block per metric: <em>Market Value (Rs. in Crores)<\/em>, <em>Shares<\/em>, <em>Holding (%)<\/em>, <em>Price<\/em> and <em>Instrument YTM (%)<\/em>. Every block must carry the same month sequence; the import stops with an explanation if it does not.<\/li>\n<li>Identifier columns: <em>Scheme Name<\/em>, <em>Company Name<\/em>, <em>Sector<\/em>. Attribute columns: <em>Asset<\/em>, <em>Asset Type<\/em>, <em>Rating<\/em>, <em>Rating Agency<\/em>, <em>Rate Basket<\/em>, <em>ISIN<\/em>, <em>Issuer Name<\/em>, <em>Coupon Rate<\/em>, <em>Maturity Date<\/em>, <em>SEBI MCAP Type<\/em>.<\/li>\n<li>Every populated cell is carried into the dashboard unchanged, with its sheet row number. Holding (%) is stored to 8 decimal places (the maximum rounding difference is 0.000000005%). Text found in a numeric cell is reported as an import issue and ignored, never converted to zero.<\/li>\n<\/ul>\n<p>A blank month cell means the line was not in the portfolio that month.<\/p>\n<h2>3. Data model<\/h2>\n<p><strong>Record<\/strong> \u2014 one source row (a scheme and a line of its portfolio), with its attributes and its monthly values.<\/p>\n<p><strong>Portfolio<\/strong> \u2014 one distinct <em>Scheme Name<\/em>. Portfolios are discovered from the data; none are hard-coded. Names are shown exactly as in the source (the source reports whole-scheme holdings; plan suffixes such as \u201c-Reg(G)\u201d are part of the name only).<\/p>\n<p><strong>Canonical security<\/strong> \u2014 the identity used for history, matching and overlap:<\/p>\n<div class=\"table-wrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Analytical class<\/th>\n<th>Source Asset Types<\/th>\n<th>Identifier<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Equity shares<\/td>\n<td>Domestic Equities, Overseas Equities, ADRs &amp; GDRs<\/td>\n<td>ISIN, else normalised name<\/td>\n<\/tr>\n<tr>\n<td>Preference shares, Rights, Warrants<\/td>\n<td>same names<\/td>\n<td>ISIN, else normalised name<\/td>\n<\/tr>\n<tr>\n<td>REITs &amp; InvITs; Mutual fund units<\/td>\n<td>REITs &amp; InvITs; Domestic Mutual Funds Units<\/td>\n<td>ISIN, else normalised name<\/td>\n<\/tr>\n<tr>\n<td>Debt &amp; money market<\/td>\n<td>Certificate of Deposit, Commercial Paper, Treasury Bills, Government Securities, Corporate Debt<\/td>\n<td>ISIN, else normalised name<\/td>\n<\/tr>\n<tr>\n<td>Deposits<\/td>\n<td>Deposits; Deposits (Placed as Margin)<\/td>\n<td>deposit type + counterparty name<\/td>\n<\/tr>\n<tr>\n<td>Derivatives<\/td>\n<td>Derivatives-Futures / -Options<\/td>\n<td>derivative type + ISIN or name<\/td>\n<\/tr>\n<tr>\n<td>Cash &amp; net assets<\/td>\n<td>Cash &amp; Cash Equivalents and Net Assets<\/td>\n<td>line name<\/td>\n<\/tr>\n<tr>\n<td>Other<\/td>\n<td>Others<\/td>\n<td>ISIN, else name<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>An ISIN is used only if it passes the ISO 6166 check digit. The normalised name is lower-cased with collapsed spaces and trailing full stops removed. Deposits ignore the ISIN field because the source fills it with the counterparty bank\u2019s equity ISIN. An asset type not in this table is classified by keyword and listed on the audit page as unmapped. The class only decides scopes such as \u201cstocks only\u201d; the source <em>Asset<\/em> and <em>Asset Type<\/em> values are always displayed unchanged.<\/p>\n<p><strong>Position<\/strong> \u2014 one canonical security in one portfolio in one month. Its allocation, market value and quantity are the sums over the source rows that describe it that month. Its price and YTM are taken from the source (if two rows report different prices the price is left blank). Its descriptive attributes (sector, market cap, asset, asset type, rating) come from the row with the largest absolute market value that month, so each month keeps its own classification.<\/p>\n<p><strong>Why several rows can describe one security.<\/strong> The export starts a new row whenever a descriptive attribute changes \u2014 for example each time a bond\u2019s rating changes, or when the rating agency changes. Such rows are <em>sequential fragments<\/em> of one holding and are stitched into a single history. Rows of the same instrument reported in the same month are summed. Rows that describe different instruments of one issuer (shares, futures, rights, deposits with that bank) stay separate securities; the stock page lists them as related lines. Nothing is discarded, and every case is listed on the audit page.<\/p>\n<p><strong>Identity continuations.<\/strong> When an equity line without an ISIN appears for exactly the months another equity line of the same portfolio is missing (a typical sign of a temporary renaming in the source), the case is flagged but not merged, because the source presents them as different rows.<\/p>\n<h2>4. Months and availability<\/h2>\n<ul>\n<li>Month headers are stored as the first day of the month and shown as \u201cAug 2026\u201d. Each column is that month\u2019s portfolio disclosure.<\/li>\n<li>A portfolio\u2019s <strong>available months<\/strong> are the months in which it has at least one line. Histories start at different months; missing months inside a history are detected and reported. Selectors only offer available months, so a view can never show a month the portfolio has no data for.<\/li>\n<li><strong>Previous available month<\/strong> is used for every month-on-month comparison. If the calendar month before is missing, the comparison says which month it used.<\/li>\n<li><strong>Range<\/strong> \u2014 both ends are always available months of the selected portfolio. Quick periods (3M, 6M, 1Y, 2Y, 3Y, 5Y) run from that many months before the as-of month up to the as-of month, and are disabled when the portfolio\u2019s history does not go back that far. <em>All<\/em> is the portfolio\u2019s full history.<\/li>\n<li>When the portfolio changes, the as-of month and range are kept where the new portfolio has data and otherwise moved to the nearest available month, with a message. Stock, sector and category selections that do not exist in the new portfolio are cleared.<\/li>\n<\/ul>\n<h2>5. Calculations<\/h2>\n<p><strong>Allocation<\/strong> is the source <em>Holding (%)<\/em> \u2014 the line\u2019s share of the whole portfolio. The audit page verifies that, within every portfolio-month, Market Value \u00f7 Holding (%) implies one portfolio total, and that allocations sum to 100% (net current assets, which can be negative, included).<\/p>\n<p><strong>Market value<\/strong> is the source <em>Market Value (Rs. in Crores)<\/em>. <em>Total market value<\/em> is its sum over every line of the month.<\/p>\n<p><strong>Changes<\/strong> are shown in % and come in two kinds, which are always labelled so they can't be confused:\n- <em>Allocation change<\/em>: the later allocation minus the earlier one, so a holding going from 2% to 4% of the fund is +2.00%;\n- <em>Relative change<\/em>: the same move as a share of the earlier value, so 2% \u2192 4% is +100%. It is shown only when both values exist, and quantity changes (<em>Qty change %<\/em>) are always relative.<\/p>\n<p><strong>Equity holdings<\/strong> is the number of equity-share positions. <strong>Rank<\/strong> orders equity-share positions by allocation (1 = largest; ties by name). Other instruments have no rank.<\/p>\n<p><strong>Concentration<\/strong>: largest and second-largest equity holding; top 5 and top 10 (sum of the five / ten largest equity allocations, % of fund); <em>effective number of stocks<\/em> = 1 \u00f7 \u03a3 w\u00b2, with equity weights re-based to 100%.<\/p>\n<p><strong>Sector and market-cap composition<\/strong> use the source <em>Sector<\/em> and <em>SEBI MCAP Type<\/em> values. Two controls apply:\n- <em>Scope<\/em>: stocks only (equity shares) or all positions (debt, deposits and cash then count under the sector the source gives their issuer, e.g. a bank\u2019s certificate of deposit under \u201cBank\u201d);\n- <em>Weights<\/em>: % of fund (source allocation) or re-based so the scope sums to 100%.\nBlank source values are shown as \u201c(blank in source)\u201d. The source carries one market-cap label per security rather than one per month, so every month uses that label; point-in-time classification is not available in the file.<\/p>\n<p><strong>Market-cap change decomposition<\/strong> (range start \u2192 end): for each category, <em>entered<\/em> = allocation at the end of holdings not in the category at the start; <em>left<\/em> = minus the allocation at the start of holdings no longer in it; <em>continuing<\/em> = the change in allocation of holdings in it at both ends. They add up exactly to the category\u2019s change. These are allocation contributions, which include price moves; they are not return contributions.<\/p>\n<p><strong>Cash<\/strong> is the source Asset Type \u201cCash &amp; Cash Equivalents and Net Assets\u201d (TREPS, reverse repo, net current assets and similar lines). Each line is also shown separately. Certificates of deposit, commercial paper, treasury bills, government securities, deposits and fund units keep their own categories and are never folded into cash. The source <em>Asset<\/em> field (Equity / Debt / Others) is used for the invested-versus-other view.<\/p>\n<h2>6. Portfolio movements (observed, not confirmed)<\/h2>\n<p>The source holds month-end holdings only. <strong>No transaction data exists<\/strong>, so the dashboard never states that a purchase or sale took place. It classifies the <em>observed change<\/em> between two month-ends:<\/p>\n<div class=\"table-wrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Status<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>New<\/td>\n<td>Held in the later month; not held in the earlier month and never before it<\/td>\n<\/tr>\n<tr>\n<td>Re-entered<\/td>\n<td>Held in the later month; not held in the earlier month but held at some point before it<\/td>\n<\/tr>\n<tr>\n<td>Increased / Reduced<\/td>\n<td>Held in both months; the measure went up / down<\/td>\n<\/tr>\n<tr>\n<td>Unchanged<\/td>\n<td>Held in both months; the measure did not change<\/td>\n<\/tr>\n<tr>\n<td>Exited<\/td>\n<td>Held in the earlier month; not held in the later month<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Measure<\/em> depends on the chosen basis:\n- <strong>Quantity<\/strong> (default): the reported shares or units. Quantities in the source are already adjusted for splits and bonuses, so these events do not show up as increases. A relative change smaller than one part in a billion counts as unchanged. Lines without a quantity (e.g. cash) fall back to allocation and are marked with an asterisk.\n- <strong>Allocation<\/strong>: Holding (%). Allocation differences below 0.0005% count as unchanged. Allocation can move because of price alone.<\/p>\n<p>Month-on-month views compare each month with the previous available month. Period views compare the first and last month of the range: <em>added<\/em> (held at the end only), <em>removed<\/em> (held at the start only), <em>increased / reduced / unchanged<\/em> (held at both ends), <em>held throughout<\/em> (held in every month of the range) and <em>in and out<\/em> (held only within the range).<\/p>\n<p><strong>Estimated value of a quantity change<\/strong> = quantity change \u00d7 the later month-end price (or market value \u00f7 quantity when no price is reported), in \u20b9 crore. It is an estimate: trade prices are not in the source.<\/p>\n<p><strong>Movement statistics<\/strong> per month: counts by status; <em>gross allocation movement<\/em> = \u03a3 |allocation change|; <em>net<\/em> = \u03a3 allocation change; <em>estimated traded value<\/em> = \u03a3 |estimated value of quantity change|; <em>material changes<\/em> = holdings whose |allocation change| is at least the chosen threshold. These are descriptive statistics of month-end snapshots, not a turnover ratio.<\/p>\n<p>Known effects that can look like trading: a corporate action the source did not adjust (e.g. a demerger \u2014 flagged when quantity at least doubles while price falls by 40% or more, or the reverse), and the identity continuations described in section 3.<\/p>\n<h2>7. Fund overlap<\/h2>\n<p>Overlap uses the same calculation as the Fund Performance Dashboard\u2019s Funds Overlap section, so the two dashboards give the same figures for the same holdings.<\/p>\n<ul>\n<li><strong>Universe<\/strong>: equity shares (default \u2014 the stock holdings the Fund Performance Dashboard compares) or all identified securities (equity shares, preference shares, rights, warrants, REITs &amp; InvITs, fund units and debt). Cash, net current assets, deposits and derivatives are never compared.<\/li>\n<li><strong>Matching<\/strong>: by ISIN when available, otherwise by normalised name; similar-looking names never match on their own. Lines with the same key are summed and treated as one holding \u2014 including, in the all-securities view, a rights entitlement that the source lists under its company\u2019s ISIN. (Elsewhere in this dashboard, rights stay a separate instrument.)<\/li>\n<li><strong>Shared holdings<\/strong> = holdings held by both funds in the month.<\/li>\n<li><strong>Shared weight<\/strong> = \u03a3 over shared holdings of min(weight in A, weight in B), using each fund\u2019s source allocation (% of its whole portfolio).<\/li>\n<li><strong>Overlap score<\/strong> = shared weight \u00f7 min(A\u2019s allocation, B\u2019s allocation), where each allocation is the sum of the fund\u2019s weights in the compared holdings. The score is symmetric (A vs B = B vs A) and runs from 0% to 100%. The denominator is shown as <strong>smaller allocation<\/strong>. If either fund has no allocation to the compared holdings, the score is 0%.<\/li>\n<li>The history uses only months in which both funds have data, with the same definitions every month. If the as-of month is not common to both funds, the nearest earlier common month is used and the page says so.<\/li>\n<\/ul>\n<p>Cross-portfolio comparisons show each fund\u2019s own figures side by side; records of the two funds are never combined.<\/p>\n<h2>8. Period comparison<\/h2>\n<p>Month A and month B can be any two available months of the portfolio; the comparison always runs forward in time. The waterfall reconciles the total equity allocation exactly: allocation in A + allocation of new / re-entered holdings + increases + reductions \u2212 allocation of exited holdings = allocation in B (all on the allocation basis). Holdings tables show both months\u2019 values, the allocation change, the relative change, quantities and ranks.<\/p>\n<h2>9. Missing data<\/h2>\n<p>Four cases are kept distinct everywhere:\n- <strong>No data<\/strong> \u2014 the portfolio has no data for that month (e.g. before its first month);\n- <strong>Not held<\/strong> \u2014 the portfolio has data but the security is not in it;\n- <strong>0.00%<\/strong> (highlighted) \u2014 the source records a value of exactly zero;\n- <strong>n/a<\/strong> \u2014 the measure does not apply (e.g. rank for a cash line).<\/p>\n<p>Line charts leave gaps for months without a value; nothing is plotted as zero unless the source says zero. Composition charts stack categories, so a category with no holdings in a month contributes nothing to that month\u2019s stack; tooltips omit it.<\/p>\n<h2>10. Validation, reconciliation and lineage<\/h2>\n<p>At start-up the dashboard runs its checks and lists them on the audit page with pass / review / fail status and detail tables. They cover: detected layout and month continuity; import issues; record and cell counts; Market Value and Holding (%) presence; allocation totals; consistency of Holding (%) with Market Value; Market Value against Shares \u00d7 Price for equities; negative and zero values; ISIN presence and check digits; classification conflicts; the asset-type mapping; blank labels; duplicates and their treatment; multi-row positions; identity continuations; corporate-action signatures; price consistency across portfolios; instruments reported after maturity; availability; and a full reconciliation of every source row-month into exactly one position, with the source and model allocation totals compared for every portfolio-month.<\/p>\n<p>The lineage explorer (and the link icon in tables) shows the exact source cells behind any position \u2014 sheet, Excel row and column for Market Value, Shares, Holding (%), Price and YTM \u2014 and lists every position behind any sector, market-cap, asset or class total.<\/p>\n<h2>11. Exports<\/h2>\n<p>Every table has an <em>Export CSV<\/em> button that writes the rows of the current view (all pages, current search and sort) with full-precision values and a UTF-8 marker so Excel opens it correctly. Charts and matrices have their own CSV exports. File names include the portfolio, the view and the months.<\/p>\n<h2>12. Refreshing the data<\/h2>\n<p>There is nothing to upload: the dashboard reads the Google Sheet each time it opens and starts on its latest month, so new months, funds and corrections appear as soon as they are in the sheet. This browser keeps the last successful sync of the sheet: while the sheet loads it can be opened at once (<em>Open the last sync now<\/em>), the sheet is then re-read in the background, and if the content fingerprint has changed <em>Reload with the latest data<\/em> is offered. <em>Data &amp; audit \u2192 Data source<\/em> shows the link, when the sheet was last synced, the fingerprint and a <em>Sync now<\/em> button. If the sheet cannot be read and this browser has never synced it, no figures are shown. If it cannot be re-read but an earlier sync exists, that sync is shown with a notice saying so. The sheet must stay shared as \u201cAnyone with the link can view\u201d and keep the layout described in section 2.<\/p>\n<h2>13. Known limitations<\/h2>\n<ul>\n<li>Holdings are month-end snapshots: trades within a month, trade prices, flows and expenses are not in the source.<\/li>\n<li>Market-cap labels are a single value per security, not historical.<\/li>\n<li>Sector labels are the source\u2019s own taxonomy.<\/li>\n<li>Quantities are adjusted for splits and bonuses in the source, but not every corporate action (see the audit page).<\/li>\n<li>Price is the source\u2019s month-end price; market value, not price \u00d7 quantity, is always used for values.<\/li>\n<\/ul>"</script>
<script id="hpi-docs" type="application/json">{"about": "<p>A standalone dashboard for exploring mutual fund portfolios month by month \u2014 what any portfolio held in any month, how it changed, and how two portfolios overlap. Every figure comes from one Google Sheet \u2014 <a href=\"https://docs.google.com/spreadsheets/d/1dsTX9-ziZ6ldBt8ycLog289xPQqggJcmThtR361gljE/edit?usp=sharing\" target=\"_blank\" rel=\"noopener noreferrer\">White List Dashboard<\/a> \u2014 and from nothing else. The link, the last sync and a fingerprint of the data are shown under Data &amp; audit \u2192 Data source.<\/p>\n<h2>One file, data from the Google Sheet<\/h2>\n<p>This HTML file is the whole application: the chart library, the fonts, the methodology, this guide and the test report are inside it. The data is not: it is read from the Google Sheet each time the file opens, so updating the sheet updates the dashboard.<\/p>\n<h2>Opening it<\/h2>\n<p>Double-click the file. It needs an internet connection: every time it opens, it reads the Google Sheet (about 10\u201325 seconds), so it always starts on the sheet\u2019s latest data and latest month. While it loads, <em>Open the last sync now<\/em> opens the copy kept from the previous visit at once, and the sheet is then checked in the background; if it has changed, a notice offers to reload with the latest data. It was tested in Chrome (Chromium, the engine Edge also uses); it is built only on features current Firefox and Safari support, but those two were not tested. It is designed for desktop and laptop screens and remains usable on tablets and phones.<\/p>\n<p>To share it, send the file; whoever opens it reads the same Google Sheet. The sheet must stay shared as \u201cAnyone with the link can view\u201d. To host it (for example on GitHub Pages), upload it on its own; rename it <code>index.html<\/code> if it should be the site\u2019s home page.<\/p>\n<h2>What\u2019s inside<\/h2>\n<p><strong>Unified Executive<\/strong> is the landing page: the selected portfolio as it stood in the chosen month, laid out like a fund factsheet. It shows the key facts with their change since the previous month, the top 10 holdings, the sector and market-cap split, what moved since the previous month, and a link into every detailed analysis.<\/p>\n<p>The layout, styling and section menu follow the Fund Performance Dashboard. The menu starts hidden. On a desktop screen it slides in when the pointer reaches the left edge of the window, pushes the page aside while open, and tucks away again when the pointer leaves it. On smaller screens it opens from the menu button as an overlay that closes on any click outside it. Tab, pressed while nothing on the page is selected, also opens or closes it, and Escape closes it. Choosing a section opens it and closes the menu, and the current section is highlighted. At the foot of the menu, <strong>Data source<\/strong> opens the Google Sheet details, under a line showing the sync status.<\/p>\n<p>On Stock analysis, <strong>Chart view \u2192 Custom<\/strong> plots any mix of this fund's allocation, the relative change in allocation, rank, quantity, market value, price, and the same security's allocation in other funds. Allocations share the left axis, and every other measure gets its own axis, titled in its line's colour.<\/p>\n<p>The top bar sets the context that every page uses: <strong>portfolio<\/strong>, <strong>as-of month<\/strong> (\u25c0 \u25b6 step between months that have data) and <strong>range<\/strong> (start and end month, or a quick period ending at the as-of month). The as-of month and the range always agree: a quick period moves with the as-of month, a custom range is kept while it contains the as-of month, and choosing a range end before the as-of month moves the as-of month to the range end. Month pickers inside a page (the stock month view, Month B of a period comparison) follow the as-of month too. Each time the dashboard opens it starts on the latest month in the sheet. The strip under the controls is the time rail: click a month to set the as-of month, drag to set a range, or focus it and use the arrow keys. Press <code>/<\/code> to search for any fund, stock, ISIN or sector.<\/p>\n<div class=\"table-wrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Section<\/th>\n<th>Answers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Overview<\/td>\n<td>What the data covers; every portfolio\u2019s history; a quick read on the selected portfolio<\/td>\n<\/tr>\n<tr>\n<td>Historical portfolio<\/td>\n<td>What the portfolio looked like in any month; how it evolved; top holdings and rank history; heatmaps<\/td>\n<\/tr>\n<tr>\n<td>Stock analysis<\/td>\n<td>One security\u2019s full history: allocation, rank, quantity, entries, exits, re-entries; month view; stock vs stock; other portfolios holding it<\/td>\n<\/tr>\n<tr>\n<td>Sector analysis<\/td>\n<td>Sector weights in any month and over time; drill into the stocks behind a sector<\/td>\n<\/tr>\n<tr>\n<td>Market cap<\/td>\n<td>Large / mid / small exposure by month and over time; what drove the change<\/td>\n<\/tr>\n<tr>\n<td>Cash<\/td>\n<td>The source cash category and each cash line, kept separate from other non-equity holdings<\/td>\n<\/tr>\n<tr>\n<td>Portfolio movements<\/td>\n<td>Added, increased, reduced, exited and re-entered holdings \u2014 monthly, over a period, as statistics, as an event list and as holding consistency<\/td>\n<\/tr>\n<tr>\n<td>Period comparison<\/td>\n<td>Any two months side by side, with a waterfall that reconciles exactly<\/td>\n<\/tr>\n<tr>\n<td>Fund overlap<\/td>\n<td>Common and unique holdings of two funds in any month, overlap over time, and a side-by-side comparison<\/td>\n<\/tr>\n<tr>\n<td>Data &amp; audit<\/td>\n<td>Validation checks, data availability, duplicate and identity handling, source-cell lineage, methodology<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Every table can be sorted and exported to CSV, and the larger ones can be searched; charts and matrices have their own exports. Select a row to drill into that holding, sector or month. The link icon in a table shows the exact sheet cells behind a figure.<\/p>\n<h2>Conventions worth knowing<\/h2>\n<ul>\n<li><strong>Movements are observed, not confirmed.<\/strong> The source has month-end holdings only. \u201cIncreased\u201d means the reported quantity (or allocation, if you switch the basis) went up between two month-ends. No trade is ever implied.<\/li>\n<li><strong>Allocation change vs relative change.<\/strong> Both are shown in %. An allocation change is the later allocation minus the earlier one, so 2% \u2192 4% of the fund is +2.00%; a relative change is the same move as a share of the earlier value (+100%) and is always labelled \u201crelative\u201d.<\/li>\n<li><strong>No data / Not held / 0.00% / n/a<\/strong> are always distinct. \u201cNo data\u201d means the portfolio has no data for that month; \u201cNot held\u201d means the security was not in the portfolio; a highlighted 0.00% is a zero recorded in the source.<\/li>\n<li><strong>Market-cap labels<\/strong> are a single value per security in the source (not one per month), so historical market-cap composition uses those labels.<\/li>\n<li><strong>Quantities<\/strong> in the source are adjusted for splits and bonuses; the audit page lists the one change that looks like an unadjusted corporate action.<\/li>\n<\/ul>\n<h2>Updating the data<\/h2>\n<p>Update the Google Sheet. The dashboard reads it every time it opens; <strong>Data &amp; audit \u2192 Data source \u2192 Sync now<\/strong> re-reads it while the dashboard is open. Keep the sheet\u2019s layout: band titles in row 1, column names and months in row 2, one block of month columns per metric, holdings from row 3. If the layout changes, the dashboard says what is wrong and shows no figures rather than guessing.<\/p>\n<h2>Independence from the Fund Performance Dashboard<\/h2>\n<p>This is a separate application. It does not read, change or depend on the Fund Performance Dashboard. It follows the same visual family (Calibri/Carlito, blue accent, light section rail) and stores its settings under its own browser key, so both can be opened from the same folder without interfering.<\/p>\n<h2>Known limitations<\/h2>\n<ul>\n<li>Trades within a month, trade prices, flows and expenses are not in the source, so they are not shown.<\/li>\n<li>Market-cap labels are not point-in-time (see above); sector labels are the source\u2019s own taxonomy.<\/li>\n<li>The dashboard never edits data by hand: all data comes only from the Google Sheet.<\/li>\n<\/ul>", "tests": "<h1>Test report \u2014 Unified Historical Mutual Fund Portfolio Intelligence<\/h1>\n<p>Build tested: <code>hpi-a0079d567b<\/code>, which is the code inside this file. This report records how that build was checked, using the export it was first built from, <code>1789982649401_Sheet1.xlsx<\/code>. If you later load newer data through Data &amp; audit \u2192 Update data, this report doesn't cover that data. Instead, every validation check runs again each time the file opens, and the results are under Data &amp; audit \u2192 Validation checks.<\/p>\n<p>All browser tests ran in headless Chromium against the file opened straight from disk. Every numeric check compares the dashboard with an independent reference, written separately in Python and pandas and worked out directly from the Excel file rather than from the dashboard's own data.<\/p>\n<h2>What this build contains<\/h2>\n<p>This build merges your unified version into the latest single-file dashboard. Your twenty code changes were applied exactly where you made them, and 291 of the 295 lines you added are present word for word; the other four were the lines that injected the Unified page's styles at load time, which now live in the main stylesheet. On top of that, every change figure now carries a % sign, the Unified Executive page was redesigned, the custom chart's axes were reworked, and the Tab shortcut for the section menu no longer traps keyboard users.<\/p>\n<h2>Results<\/h2>\n<div class=\"table-wrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>What was compared<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Unified Executive page<\/td>\n<td>For all 1,300 portfolio-months: market value, equity holdings, all positions, cash, top-10 concentration and largest holding, each with its change since the previous month; every top-10 row and their total; every sector row including \u201cOther sectors\u201d; every market-cap row including stocks with no label in the source; the movement counts<\/td>\n<td>0 mismatches<\/td>\n<\/tr>\n<tr>\n<td>Changes shown in %<\/td>\n<td>Visible text, hidden explanations, button labels and tooltips on all 39 views, the axis labels and tooltip output of 46 charts, and the header rows of 10 CSV exports<\/td>\n<td>Every change is shown with a % sign; no other unit remains<\/td>\n<\/tr>\n<tr>\n<td>Model \u2014 positions<\/td>\n<td>All 143,327 portfolio \u00d7 month \u00d7 security positions: allocation, market value, quantity and source rows<\/td>\n<td>0 missing, 0 extra, 0 mismatches<\/td>\n<\/tr>\n<tr>\n<td>Model \u2014 aggregates<\/td>\n<td>1,300 portfolio-months of holdings counts, concentration, cash, sector, market-cap and asset totals (49,922 values); 1,281 month-on-month movement comparisons (7,686 counts); 8,039 fund-pair overlap months (32,156 values)<\/td>\n<td>0 mismatches<\/td>\n<\/tr>\n<tr>\n<td>End-to-end suite<\/td>\n<td>Displayed figures for all 1,300 portfolio-months, the ten user journeys (now opening the section menu the way a user would), cross-page consistency, filters, exports, keyboard control, error isolation, performance, independence and small screens<\/td>\n<td>55 / 55<\/td>\n<\/tr>\n<tr>\n<td>Custom chart<\/td>\n<td>Four measures plus another fund selected together<\/td>\n<td>Every visible axis carries a line and a title; both funds' allocations share the left axis; one set of gridlines<\/td>\n<\/tr>\n<tr>\n<td>Keyboard<\/td>\n<td>At 1440 px and 390 px: Tab from the page opens the menu and moves focus into it; Tab inside the menu moves to the next section; Escape closes it and returns focus to the menu button; from the top of the page, Tab reaches the page content<\/td>\n<td>10 / 10<\/td>\n<\/tr>\n<tr>\n<td>Unified page links<\/td>\n<td>A top-10 security, an Explore tile and the data link<\/td>\n<td>Each opens the right page with the same portfolio and month<\/td>\n<\/tr>\n<tr>\n<td>Edge cases<\/td>\n<td>Every tab of every section for a 1-month, a 6-month and a 500-stock portfolio (114 views)<\/td>\n<td>No errors, no error cards, no NaN or undefined values<\/td>\n<\/tr>\n<tr>\n<td>Performance<\/td>\n<td>Start-up; every view on the 500-stock, 84-month portfolio<\/td>\n<td>Start-up under 1 s; every view under 1.5 s<\/td>\n<\/tr>\n<tr>\n<td>Responsive<\/td>\n<td>1440, 1280, 1024 and 390 px<\/td>\n<td>No sideways scrolling and no clipped figures; at 1440 px the top-bar controls fit on one line<\/td>\n<\/tr>\n<tr>\n<td>Code<\/td>\n<td>Syntax check of the shipped scripts<\/td>\n<td>Pass<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Update data: reading a newer export in the browser<\/h2>\n<div class=\"table-wrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The original export (written by Microsoft Excel)<\/td>\n<td>Identical to the Python extractor: all 4,619 rows, 104 months, 3,026 names and every cell value; read in about 2 s<\/td>\n<\/tr>\n<tr>\n<td>A synthetic next-month export written by openpyxl, and the same file re-saved by LibreOffice<\/td>\n<td>Identical, including the same notes about a text value in a number cell, an extra column and an orphan row<\/td>\n<\/tr>\n<tr>\n<td>The downloaded updated copy<\/td>\n<td>Saved as <code>Historical_MF_Portfolio_Intelligence_&lt;latest month&gt;.html<\/code>; opens with a model identical to this file's<\/td>\n<\/tr>\n<tr>\n<td>Updating an updated copy, three times over<\/td>\n<td>The dashboard part of the file stayed identical to the byte every time (796,058 bytes), so nothing builds up from month to month; the third copy's data matched the first's exactly<\/td>\n<\/tr>\n<tr>\n<td>Switching portfolio or tab while a file is read, and choosing a second file mid-read<\/td>\n<td>The progress stays on screen, the result appears, and the second file wins<\/td>\n<\/tr>\n<tr>\n<td>Files that must be refused: a CSV, a renamed text file, an interrupted download, an unrelated workbook, an export without Holding (%)<\/td>\n<td>5 / 5 refused with a specific reason, with the current data left untouched<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Bugs found this round (all fixed and re-tested)<\/h2>\n<ul>\n<li>The Unified page used layout styles that don't exist in this dashboard, so its sections rendered unstyled and stacked in one long column. It was rebuilt on the dashboard's own card system.<\/li>\n<li>Holdings changes read \u201c+4.00\u201d instead of \u201c+4\u201d, the source-row count showed a dash because it read a field that doesn't exist, and the sector list showed the top 8 with nothing for the rest, so it didn't add up.<\/li>\n<li>The Unified page added its styles to the page header when it loaded. Update data writes the header into every new copy, so each monthly update would have carried one more duplicate of those styles. They now live in the stylesheet, and the dashboard records its header exactly as shipped before any script runs.<\/li>\n<li>The custom chart showed an empty allocation axis, drew a relative change and fund allocations against the same axis, and had no axis titles.<\/li>\n<li>Pressing Tab at the top of the page toggled the menu instead of moving focus, so a keyboard user could never reach any control. Tab on the page still opens and closes the menu; inside it, Tab now moves between sections and Escape closes it.<\/li>\n<li>One of this round's new tests at first looked up stocks with no market-cap label under the wrong key and reported 745 mismatches. The dashboard was right; the test was corrected and the rows now match value for value.<\/li>\n<\/ul>\n<p>Earlier rounds found and fixed: row clicks that were ignored in every table, a main column that collapsed on narrow screens, table searches that carried over between portfolios, invalid ISINs shown as \u201cNo ISIN\u201d, import progress lost when the page redrew, and several smaller wording and axis issues.<\/p>\n<h2>Not verified<\/h2>\n<ul>\n<li><strong>Browsers other than Chromium.<\/strong> Chrome and Edge share the same engine; Firefox and Safari weren't tested. Update data needs Chrome or Edge 80+, Firefox 113+ or Safari 16.4+.<\/li>\n<li><strong>Much larger exports.<\/strong> The current export unzips to about 65 MB in memory; exports a few times larger should work on a desktop but weren't tested.<\/li>\n<li><strong>Assistive technology.<\/strong> Keyboard behaviour was tested; no screen-reader session was run.<\/li>\n<li><strong>Printing<\/strong> was not checked on paper.<\/li>\n<\/ul>\n<h2>Change of 14 October 2026 \u2014 fund overlap<\/h2>\n<p>The Fund overlap page now calculates overlap exactly as the Fund Performance Dashboard does. The headline is the <strong>Overlap score<\/strong> = shared weight \u00f7 the smaller fund\u2019s allocation to the compared holdings. It replaces the earlier \u201cRe-based overlap\u201d, which re-scaled each fund to 100% before taking minimums and differed from the Fund Performance Dashboard by 0.5 points on average and up to 34 points. Holdings are now keyed as that dashboard keys them (ISIN, otherwise normalised name). In the equity-share view this changes no shared-holdings count or shared weight. In the all-securities view it now combines a rights entitlement with its company\u2019s shares when the source gives both the same ISIN.<\/p>\n<p>Re-checked in headless Chromium against the embedded data. The Fund Performance Dashboard\u2019s own overlap functions, copied unchanged from that dashboard, were run on every fund pair in every common month: 16,078 comparisons in the equity-share view (both directions of all 8,039 pair-months) and 8,039 in the all-securities view. Shared holdings, shared weight, smaller allocation and overlap score: 0 mismatches, and A vs B always equals B vs A. Every Fund overlap tab rendered with no script errors. The table above describes the original build and does not cover this change.<\/p>\n\n<h2>Change of 14 October 2026 \u2014 data now comes only from the Google Sheet<\/h2>\n<p>The data that was stored inside this file has been removed. The dashboard now reads the <em>White List Dashboard<\/em> Google Sheet every time it opens, and that sheet is its only data source. Data &amp; audit \u2192 Update data (loading an .xlsx) has been replaced by Data &amp; audit \u2192 Data source, which shows the link, the last sync and a <em>Sync now<\/em> button.<\/p>\n<ul>\n<li><strong>Reading the live sheet<\/strong> (in Chrome, 14 Oct 2026): 4,637 rows, 19 portfolios, 100 months (Jun 2018 \u2013 Sep 2026), all five metric blocks and all 13 identifier and attribute columns found, 0 import issues, about 8 seconds. Google allows this route (a Google Sheets query) from a file opened from disk; its Excel and CSV exports are refused from a local file, so they are not used.<\/li>\n<li><strong>Month headers<\/strong>: the sheet stores the typed \u201cMon-YY\u201d headers as dates in 2026 (\u201cJun-18\u201d is held as 18 June 2026), so months are read from the displayed label. Without this, the months would collide and the import would stop.<\/li>\n<li><strong>Against the original export<\/strong>: for the 99 months both contain, the number of holdings matches in every month, and the monthly totals of Holding (%) and Market Value agree to within 0.004 and \u20b90.006 cr. The sheet carries Holding (%) to 4 decimal places (the export had 8), and it adds Sep 2026 and does not contain Jan\u2013May 2018.<\/li>\n<li><strong>Same rules as before<\/strong>: a Google Sheets response rebuilt from the original export was read through the new route, and the extracted data was identical to what the original extractor produced (same rows, values, strings and layout).<\/li>\n<li><strong>Behaviour<\/strong>: first open (waits for the sheet), reopen (opens from the last sync, then confirms it is up to date), a change in the sheet (a notice offers to reload, and the reload shows the change), sheet unreachable with an earlier sync (that sync is shown with a warning), and sheet unreachable with no earlier sync (no figures are shown, and an error explains why). All five behaved as described.<\/li>\n<li><strong>Sheet-shaped data<\/strong> (4-decimal values, 99 months, the sheet\u2019s column layout): 0 failed validation checks and 9 to review. The added review item is Market Value \u00f7 Holding (%) consistency, which reflects the 4-decimal Holding (%). All 31 page and tab views rendered with no script errors, and Fund overlap matched the Fund Performance Dashboard\u2019s own functions in 31,856 of 31,856 comparisons.<\/li>\n<\/ul>\n\n<h2>Change of 14 October 2026 \u2014 months and start-up<\/h2>\n<ul>\n<li><strong>Month selection<\/strong>: changing the as-of month left the range where it was, so charts and tables that use the range kept showing other months; the range now moves with the as-of month (or is kept while it contains it). Choosing a range end before the start swapped the two, so a different month appeared from the one chosen; the range lists now offer only consistent months. The stock month view and Month B of a period comparison stayed on their own month after the top-bar month changed; both now follow it.<\/li>\n<li><strong>Latest month<\/strong>: the dashboard reopened on the last month viewed (saved in the browser and in the address), so after the sheet gained a month it could still open on the older one. A fresh open now always starts on the sheet\u2019s latest month; an address with months is honoured only while the sheet\u2019s latest month is unchanged. Start-up now reads the sheet before opening (the previous sync can be opened at once while it loads), so the newest data is shown without a reload.<\/li>\n<li><strong>Saved chart choices<\/strong>: the extra funds chosen for Stock analysis \u2192 Custom were saved as list positions, which point to different funds once the data changes; they are now saved by fund name.<\/li>\n<li><strong>Verified<\/strong> on data shaped like the live sheet (Jun 2018 \u2013 Sep 2026), in the Asia/Kolkata time zone: 19 month checks covering the as-of list, \u25c0 \u25b6, range lists, quick periods, time-rail clicks and drags, refresh, fresh open, an out-of-date address, the sheet gaining a month, and opening the last sync while loading \u2014 all passed with no script errors.<\/li>\n<\/ul>\n\n<h2>Change of 14 October 2026 \u2014 Fund Performance Dashboard style and side menu<\/h2>\n<p>The dashboard now uses the Fund Performance Dashboard\u2019s look and format: its background, title bar with pill buttons, section and block cards, blue title bars, table headers, chips, badges, inputs and loading card. Sizes are taken from what that dashboard shows on screen. Its side menu was rebuilt on the same model: hidden by default, revealed from the left edge, pushing the page aside on desktop, an overlay with a backdrop on smaller screens, Tab and Escape keys, and a highlighted current section. Data source and the sync status sit at the foot. Seventeen menu checks passed on desktop (1440 px) and a narrow screen (900 px), including keyboard use. One stacking fault found during testing was fixed: on narrow screens the backdrop sat above the menu.<\/p>\n"}</script>
