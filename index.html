    body.innerHTML = `
      <div class="toolbar"><label class="ctl-label" for="sc-sel">Sector</label><select id="sc-sel">${keysAll.map((k) => `<option value="${esc(k)}" ${k === key ? 'selected' : ''}>${esc(M.dimLabel('sector', k))}</option>`).join('')}</select>${S.sector == null ? '<span class="muted">Showing the largest sector; choose any sector the portfolio has held.</span>' : ''}</div>
      <section class="profile"><div class="profile-top"><div class="profile-name">${esc(label)}</div><div class="profile-meta"><span>${esc(M.pName(S.pid))}</span><span>${unitNote(scope, rebase)}</span><span>${K.scopeLabel(scope)}</span></div></div>
      ${UI.kpis([
        { label: `Allocation, ${M.months[mi].label}`, value: w == null ? '<span class="nodata">No holdings</span>' : U.pct(w), sub: g ? U.count(g.n, 'holding') : '', test: 'sc-w' },
        { label: pv ? `Previous (${pv.label})` : 'Previous month', value: prev < 0 ? UI.noData('No earlier month') : wp == null ? '<span class="nodata">No holdings</span>' : U.pct(wp), sub: gp ? U.count(gp.n, 'holding') : '', test: 'sc-wp' },
        { label: 'Allocation change', value: prev < 0 ? '—' : UI.ppCell((w || 0) - (wp || 0)), sub: w != null && wp != null ? U.chg(U.relChange(wp, w)) + ' relative change' : '', test: 'sc-dw' },
        { label: 'Highest in range', value: hi ? U.pct(hi.v) : '—', sub: hi ? M.months[hi.m].label : '', test: 'sc-hi' },
        { label: 'Lowest in range', value: lo ? U.pct(lo.v) : '—', sub: lo ? M.months[lo.m].label + ' (months with holdings)' : '', test: 'sc-lo' },
      ])}</section>
      <div class="grid">
        ${UI.card({ span: 6, title: 'Sector allocation over time', sub: `${esc(M.months[S.from].label)} – ${esc(M.months[S.to].label)}; gaps mean no holdings in the sector`, body: UI.chart('sc-line', '', 'Sector allocation over time') })}
        ${UI.card({ span: 6, title: 'Stocks within the sector over time', sub: 'Eight largest constituents in the range', body: UI.chart('sc-cons', '', 'Sector constituents over time') })}
        ${UI.card({ span: 12, title: `Stocks in ${esc(label)}, ${esc(M.months[mi].label)}`, sub: `Share of sector = the stock’s allocation ÷ the sector’s allocation. ${pv ? `Rows exited since ${esc(pv.label)} are included.` : ''} Select a stock for its full history.`, flush: true, body: '<div id="sc-cons-t"></div>' })}
      </div>`;
    body.querySelector('#sc-sel').addEventListener('change', (e) => HPI.setState({ sector: e.target.value }));
    const labels = K.labels(M, mis), titles = K.titles(M, mis);
    C.line(document.getElementById('sc-line'), { labels, titles, unit: 'pct', markerIndex: K.marker(mis, S.mi), datasets: [{ label, data: series, color: C.A, fill: true, points: mis.length <= 60 }], onClick: (i) => HPI.setState({ mi: mis[i] }) });
    C.stack(document.getElementById('sc-cons'), { labels, titles, unit: 'pct', markerIndex: K.marker(mis, S.mi), datasets: cds });
    UI.table(document.getElementById('sc-cons-t'), {
      id: 'sc-cons-t',
      caption: 'Sector constituents',
      rows: cons,
      unit: 'stock',
      sort: { key: 'w', dir: 'desc' },
      exportName: K.exp(M, S.pid, 'sector', U.shortName(label, 24), K.key(M, mi)),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        K.secCol(M),
        K.isinCol(M),
        K.pctCol('w', 'Allocation', (r) => (r.ps ? r.ps.w : null)),
        { key: 'share', label: 'Share of sector', num: true, value: (r) => (r.ps && secTotal ? (r.ps.w / secTotal) * 100 : null), html: (r) => (r.ps && secTotal ? U.pct((r.ps.w / secTotal) * 100) : '—') },
        { key: 'rank', label: 'Portfolio rank', num: true, value: (r) => (r.ps ? ranks.get(r.sec) || null : null), html: (r) => (r.ps && ranks.get(r.sec) ? '#' + ranks.get(r.sec) : '—') },
        { key: 'mcap', label: 'Market cap', value: (r) => (r.ps || r.pp).mcap || '', html: (r) => esc((r.ps || r.pp).mcap || '(blank)') },
        { key: 'wp', label: 'Previous', num: true, value: (r) => (r.pp ? r.pp.w : null), html: (r) => (prev < 0 ? UI.noData('No earlier month') : r.pp ? UI.pctCell(r.pp.w) : UI.notHeld()) },
        { key: 'dw', label: 'Allocation change', num: true, value: (r) => (prev < 0 ? null : (r.ps ? r.ps.w : 0) - (r.pp ? r.pp.w : 0)), html: (r) => (prev < 0 ? '—' : UI.ppCell((r.ps ? r.ps.w : 0) - (r.pp ? r.pp.w : 0))) },
        { key: 'st', label: 'Movement', value: (r) => (r.st ? K.statusOrder[r.st.status] : 99), html: (r) => (r.st ? UI.moveBadge(r.st, S.movBasis) : '—'), csv: (r) => (r.st ? r.st.status : '') },
      ],
    });
  }
})();

/* ---- 14_mcap.js ---- */
/* =============================================================================
   14_mcap.js — Market-cap analysis

(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, K = HPI.kit, C = HPI.charts, SH = HPI.shell;
  const esc = U.esc;
  const MC_COLORS = { 'Large Cap': '#2456d6', 'Mid Cap': '#38a8e6', 'Small Cap': '#e8884c', Others: '#8e9aa6', __blank__: '#c9d2dc' };
  const colorOf = (k, i) => MC_COLORS[k] || C.color(i + 3);

  HPI.pages.mcap = {
    nav: 'Market cap',
    title: 'Market-cap analysis',
    icon: 'mcap',
    purpose: 'Large, mid and small-cap exposure in any month and across the range, what changed, and which securities sit in each category.',
    render(root, S, M) {
      const tab = S.tabs.mcap;
      const scope = S.mcapScope === 'all' ? 'all' : 'eq';
      const rebase = S.rebase === 'scope' ? 'scope' : 'fund';
      root.innerHTML = `${SH.header('mcap', S.mcapCat ? [SH.chip('Category', esc(M.dimLabel('mcap', S.mcapCat)), true)] : [])}
        <div class="toolbar">${K.scopeSeg('mcapScope', scope)}${K.basisSeg(rebase)}</div>

        ${UI.tabs('mcap', [{ id: 'month', label: 'Month' }, { id: 'history', label: 'History' }, { id: 'change', label: 'What changed' }], tab)}
        <div id="mc-body" role="tabpanel" aria-labelledby="tab-mcap-${tab}"></div>`;
      const body = root.querySelector('#mc-body');
      ({ month, history, change }[tab] || month)(body, S, M, scope, rebase);
    },
  };
  const unitNote = (scope, rebase) => (rebase === 'scope' ? `re-based to 100% of ${scope === 'eq' ? 'stock holdings' : 'the fund'}` : '% of fund');

  function drill(host, S, M, scope, key, mi, prev) {
    const g = M.groupMap(S.pid, mi, 'mcap', scope).get(key);
    const gp = prev >= 0 ? M.groupMap(S.pid, prev, 'mcap', scope).get(key) : null;
    const rows = [];

    const ranks = M.ranks(S.pid, mi);
    for (const r of rows) r.st = prev >= 0 ? M.statusOf(S.pid, r.sec, prev, mi, S.movBasis) : null;
    UI.table(host, {
      id: 'mc-drill',
      caption: 'Securities in the category',
      rows,
      unit: 'security',
      sort: { key: 'w', dir: 'desc' },
      search: (r) => M.secName(r.sec) + ' ' + ((r.ps || r.pp).sector || ''),
      exportName: K.exp(M, S.pid, 'mcap', M.dimLabel('mcap', key), K.key(M, mi)),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        K.secCol(M),
        K.isinCol(M),
        K.pctCol('w', 'Allocation', (r) => (r.ps ? r.ps.w : null)),
        { key: 'wp', label: 'Previous', num: true, value: (r) => (r.pp ? r.pp.w : null), html: (r) => (prev < 0 ? UI.noData('No earlier month') : r.pp ? UI.pctCell(r.pp.w) : UI.notHeld()) },
        { key: 'dw', label: 'Allocation change', num: true, value: (r) => (prev < 0 ? null : (r.ps ? r.ps.w : 0) - (r.pp ? r.pp.w : 0)), html: (r) => (prev < 0 ? '—' : UI.ppCell((r.ps ? r.ps.w : 0) - (r.pp ? r.pp.w : 0))) },
        { key: 'rank', label: 'Rank', num: true, value: (r) => (r.ps ? ranks.get(r.sec) || null : null), html: (r) => (r.ps && ranks.get(r.sec) ? '#' + ranks.get(r.sec) : '—') },
        { key: 'sector', label: 'Sector', value: (r) => (r.ps || r.pp).sector || '', html: (r) => esc((r.ps || r.pp).sector || '—') },
        { key: 'st', label: 'Movement', value: (r) => (r.st ? K.statusOrder[r.st.status] : 99), html: (r) => (r.st ? UI.moveBadge(r.st, S.movBasis) : '—'), csv: (r) => (r.st ? r.st.status : '') },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function month(body, S, M, scope, rebase) {
    const mi = S.mi;
    const pv = SH.prevLabel(S.pid, mi);
    const prev = pv ? pv.prev : -1;
    const wOf = (m, k) => K.weightOf(M, S.pid, m, 'mcap', scope, k, rebase);
    const keys = M.dimKeys(S.pid, prev >= 0 ? [prev, mi] : [mi], 'mcap', scope);
    const gm = M.groupMap(S.pid, mi, 'mcap', scope), gp = prev >= 0 ? M.groupMap(S.pid, prev, 'mcap', scope) : null;
    const rows = keys.map((k) => ({ key: k, label: M.dimLabel('mcap', k), w: gm.has(k) ? wOf(mi, k) : null, wp: gp && gp.has(k) ? wOf(prev, k) : null, n: gm.has(k) ? gm.get(k).n : 0, np: gp && gp.has(k) ? gp.get(k).n : null }));
    const sel = S.mcapCat && keys.includes(S.mcapCat) ? S.mcapCat : keys[0];
    body.innerHTML = `<div class="grid">
      ${UI.card({ span: 7, title: `Market-cap composition, ${esc(M.months[mi].label)}`, sub: `${unitNote(scope, rebase)}; ${pv ? `compared with ${esc(pv.label)}` : 'first month of data'}. Select a category to list its securities.`, flush: true, body: '<div id="mc-t"></div>' })}
      ${UI.card({ span: 5, title: 'Current vs previous', sub: unitNote(scope, rebase), body: UI.chart('mc-bar', '', 'Market-cap composition current versus previous month') })}
      ${UI.card({ span: 12, title: `${esc(M.dimLabel('mcap', sel))}: securities in ${esc(M.months[mi].label)}`, sub: `${pv ? `Securities that left the category since ${esc(pv.label)} are included as “Not held”.` : ''}`, flush: true, body: '<div id="mc-drill"></div>' })}
    </div>`;
    UI.table(document.getElementById('mc-t'), {
      id: 'mc-t',
      caption: 'Market-cap composition',
      rows,
      unit: 'category',
      sort: { key: 'w', dir: 'desc' },
      pageSizes: [25],
      exportName: K.exp(M, S.pid, 'mcap', scope, rebase, K.key(M, mi)),
      rowClass: (r) => (r.key === sel ? 'sel' : ''),
      onRowClick: (r) => HPI.setState({ mcapCat: r.key }),
      columns: [
        { key: 'label', label: 'Category', value: (r) => r.label, html: (r) => `<span class="badge" style="background:${colorOf(r.key, 0)}22;color:${r.key === '__blank__' ? '#5d6b74' : colorOf(r.key, 0)}">${UI.icon('dot')}${esc(r.label)}</span>` },
        { key: 'w', label: 'Allocation', num: true, value: (r) => r.w, html: (r) => (r.w == null ? '<span class="nodata">No holdings</span>' : U.pct(r.w)), csv: (r) => r.w },
        { key: 'wp', label: 'Previous', num: true, value: (r) => r.wp, html: (r) => (prev < 0 ? UI.noData('No earlier month') : r.wp == null ? '<span class="nodata">No holdings</span>' : U.pct(r.wp)), csv: (r) => r.wp },
        { key: 'dw', label: 'Allocation change', num: true, value: (r) => (prev < 0 ? null : (r.w || 0) - (r.wp || 0)), html: (r) => (prev < 0 ? '—' : UI.ppCell((r.w || 0) - (r.wp || 0))) },
        { key: 'n', label: 'Holdings', num: true, value: (r) => r.n, html: (r) => U.int(r.n) },
        { key: 'np', label: 'Previous holdings', num: true, value: (r) => r.np, html: (r) => (r.np == null ? '—' : U.int(r.np)) },
      ],
    });
    C.bar(document.getElementById('mc-bar'), {
      labels: rows.map((r) => r.label),
      unit: 'pct',
      horizontal: true,
      datasets: [{ label: M.months[mi].label, data: rows.map((r) => r.w || 0), color: C.A }, ...(prev >= 0 ? [{ label: M.months[prev].label, data: rows.map((r) => r.wp || 0), color: '#b8c7e6' }] : [])],
      onClick: (i) => HPI.setState({ mcapCat: rows[i].key }),
    });
    drill(document.getElementById('mc-drill'), S, M, scope, sel, mi, prev);
  }

  /* ------------------------------------------------------------------ */
  function history(body, S, M, scope, rebase) {
    const mis = K.months(M, S);
    const comp = K.compose(M, S.pid, mis, 'mcap', scope, rebase);
    const labels = K.labels(M, mis), titles = K.titles(M, mis);
    const ds = comp.keys.map((k, i) => ({ key: k, label: M.dimLabel('mcap', k), data: comp.series.get(k), color: colorOf(k, i) }));
    const mode = S.mcapChart === 'lines' ? 'lines' : 'stack';
    body.innerHTML = `<div class="grid">
      ${UI.card({ span: 12, title: 'Market-cap composition over time', sub: `${esc(M.months[S.from].label)} – ${esc(M.months[S.to].label)}, ${unitNote(scope, rebase)}`, actions: UI.seg('mcapChart', 'Chart', [{ value: 'stack', label: 'Stacked' }, { value: 'lines', label: 'Lines' }], mode), body: UI.chart('mc-hist', 'tall', 'Market-cap composition over time') })}
      ${UI.card({ span: 12, title: 'By month', sub: 'Allocation and number of holdings per category', flush: true, body: '<div id="mc-ht"></div>' })}
    </div>`;
    if (mode === 'stack') C.stack(document.getElementById('mc-hist'), { labels, titles, unit: 'pct', markerIndex: K.marker(mis, S.mi), datasets: ds });
    else C.line(document.getElementById('mc-hist'), { labels, titles, unit: 'pct', markerIndex: K.marker(mis, S.mi), datasets: ds.map((d) => ({ ...d, data: d.data.map((v, j) => (comp.counts.get(d.key)[j] ? v : null)) })) });
    const rows = mis.slice().reverse().map((mi) => ({ mi, j: mis.indexOf(mi) }));
    const cols = [{ key: 'mi', label: 'Month', value: (r) => r.mi, html: (r) => esc(M.months[r.mi].label), csv: (r) => M.months[r.mi].key }];
    for (const k of comp.keys) {
      const lab = M.dimLabel('mcap', k);
      cols.push({ key: 'w_' + k, label: lab, num: true, value: (r) => (comp.counts.get(k)[r.j] ? comp.series.get(k)[r.j] : null), html: (r) => (comp.counts.get(k)[r.j] ? U.pct(comp.series.get(k)[r.j]) : '<span class="nodata">No holdings</span>'), csvLabel: lab + ' %' });
      cols.push({ key: 'n_' + k, label: '#', num: true, value: (r) => comp.counts.get(k)[r.j], html: (r) => `<span class="muted">${U.int(comp.counts.get(k)[r.j])}</span>`, csvLabel: lab + ' holdings', title: 'Number of holdings in ' + lab });
    }
    UI.table(document.getElementById('mc-ht'), { id: 'mc-ht', caption: 'Market-cap history', rows, unit: 'month', sort: { key: 'mi', dir: 'desc' }, pageSize: 50, exportName: K.exp(M, S.pid, 'mcap_history', scope, rebase, K.key(M, S.from), K.key(M, S.to)), columns: cols });
  }

  /* ------------------------------------------------------------------ */
  function change(body, S, M, scope, rebase) {
    const a = S.from, b = S.to;
    const wOf = (m, k) => K.weightOf(M, S.pid, m, 'mcap', scope, k, rebase);
    const tot = (m) => { let t = 0; for (const e of M.groupMap(S.pid, m, 'mcap', scope).values()) t += e.w; return t; };
    const f = (m, w) => (rebase === 'scope' ? (tot(m) ? (w / tot(m)) * 100 : 0) : w);
    const keys = M.dimKeys(S.pid, [a, b], 'mcap', scope);
    const contrib = [];
    const rows = keys.map((k) => {
      const ga = M.groupMap(S.pid, a, 'mcap', scope).get(k), gb = M.groupMap(S.pid, b, 'mcap', scope).get(k);
      const ia = new Map(ga ? ga.positions.map((p) => [p.sec, p]) : []), ib = new Map(gb ? gb.positions.map((p) => [p.sec, p]) : []);
      let add = 0, ex = 0, cont = 0, nAdd = 0, nEx = 0, nCont = 0;
      for (const [sid, p] of ib) {
        if (ia.has(sid)) { const d = f(b, p.w) - f(a, ia.get(sid).w); cont += d; nCont++; contrib.push({ key: k, sec: sid, kind: 'Continuing', d, wa: f(a, ia.get(sid).w), wb: f(b, p.w) }); }
        else { add += f(b, p.w); nAdd++; contrib.push({ key: k, sec: sid, kind: 'Entered', d: f(b, p.w), wa: null, wb: f(b, p.w) }); }
      }
      for (const [sid, p] of ia) if (!ib.has(sid)) { ex -= f(a, p.w); nEx++; contrib.push({ key: k, sec: sid, kind: 'Left', d: -f(a, p.w), wa: f(a, p.w), wb: null }); }
      return { key: k, label: M.dimLabel('mcap', k), wa: ga ? wOf(a, k) : null, wb: gb ? wOf(b, k) : null, add, ex, cont, nAdd, nEx, nCont };
    });
    const sel = S.mcapCat && keys.includes(S.mcapCat) ? S.mcapCat : keys[0];
    body.innerHTML = `<div class="grid">
      ${UI.card({
        span: 12,
        title: `Change in market-cap exposure, ${esc(M.months[a].label)} → ${esc(M.months[b].label)}`,
        sub: `${unitNote(scope, rebase)}. Each category’s change = holdings that entered it + change in holdings present at both ends − holdings that left it. Allocation changes include price moves; they are not return contributions.`,
        flush: true,
        body: '<div id="mc-ct"></div>',
      })}
      ${UI.card({ span: 5, title: 'Where each change came from', sub: 'Contribution of each component to the change, % of fund', body: UI.chart('mc-cbar', 'tall', 'Change decomposition by category') })}
      ${UI.card({ span: 7, title: `${esc(M.dimLabel('mcap', sel))}: largest contributors`, sub: 'Securities ranked by the size of their contribution; select a category above to switch', flush: true, body: '<div id="mc-contrib"></div>' })}
    </div>`;
    UI.table(document.getElementById('mc-ct'), {
      id: 'mc-ct',
      caption: 'Market-cap change decomposition',
      rows,
      unit: 'category',
      pageSizes: [25],
      sort: { key: 'wb', dir: 'desc' },
      exportName: K.exp(M, S.pid, 'mcap_change', scope, rebase, K.key(M, a), K.key(M, b)),
      rowClass: (r) => (r.key === sel ? 'sel' : ''),
      onRowClick: (r) => HPI.setState({ mcapCat: r.key }),
      columns: [
        { key: 'label', label: 'Category', value: (r) => r.label, html: (r) => `<strong>${esc(r.label)}</strong>` },
        { key: 'wa', label: M.months[a].label, num: true, value: (r) => r.wa, html: (r) => (r.wa == null ? '<span class="nodata">No holdings</span>' : U.pct(r.wa)) },
        { key: 'wb', label: M.months[b].label, num: true, value: (r) => r.wb, html: (r) => (r.wb == null ? '<span class="nodata">No holdings</span>' : U.pct(r.wb)) },
        { key: 'd', label: 'Allocation change', num: true, value: (r) => (r.wb || 0) - (r.wa || 0), html: (r) => UI.ppCell((r.wb || 0) - (r.wa || 0)) },
        { key: 'add', label: 'Entered', num: true, value: (r) => r.add, html: (r) => `${UI.ppCell(r.add)} <span class="muted">(${r.nAdd})</span>`, title: 'Allocation of holdings not in the category at the start' },
        { key: 'cont', label: 'Continuing', num: true, value: (r) => r.cont, html: (r) => `${UI.ppCell(r.cont)} <span class="muted">(${r.nCont})</span>`, title: 'Change in allocation of holdings present at both ends' },
        { key: 'ex', label: 'Left', num: true, value: (r) => r.ex, html: (r) => `${UI.ppCell(r.ex)} <span class="muted">(${r.nEx})</span>`, title: 'Allocation at the start of holdings no longer in the category' },
      ],
    });
    C.bar(document.getElementById('mc-cbar'), {
      labels: rows.map((r) => r.label),
      unit: 'pp',
      datasets: [{ label: 'Entered', data: rows.map((r) => r.add), color: '#0f7f86', unit: 'pp' }, { label: 'Continuing', data: rows.map((r) => r.cont), color: '#2456d6', unit: 'pp' }, { label: 'Left', data: rows.map((r) => r.ex), color: '#c0392b', unit: 'pp' }],
    });
    UI.table(document.getElementById('mc-contrib'), {
      id: 'mc-contrib',
      caption: 'Largest contributors',
      rows: contrib.filter((c) => c.key === sel),
      unit: 'security',
      sort: { key: 'ad', dir: 'desc' },
      search: (r) => M.secName(r.sec),
      exportName: K.exp(M, S.pid, 'mcap_contributors', M.dimLabel('mcap', sel), K.key(M, a), K.key(M, b)),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        K.secCol(M),
        { key: 'kind', label: 'Component', value: (r) => r.kind, html: (r) => (r.kind === 'Entered' ? UI.badge('NEW', 'Not in the category at the start') : r.kind === 'Left' ? UI.badge('EXITED', 'In the category at the start, not at the end') : `<span class="badge b-unchanged">${UI.icon('dot')}Continuing</span>`) },
        { key: 'wa', label: M.months[a].short, num: true, value: (r) => r.wa, html: (r) => (r.wa == null ? UI.notHeld() : UI.pctCell(r.wa)) },
        { key: 'wb', label: M.months[b].short, num: true, value: (r) => r.wb, html: (r) => (r.wb == null ? UI.notHeld() : UI.pctCell(r.wb)) },
        { key: 'ad', label: 'Contribution', num: true, value: (r) => Math.abs(r.d), html: (r) => UI.ppCell(r.d), csv: (r) => r.d, title: 'Sorted by absolute size' },
      ],
    });
  }
})();

/* ---- 15_cash.js ---- */
/* =============================================================================
   15_cash.js — Cash analysis
   Source categories are preserved: the headline is the source Asset Type
   "Cash & Cash Equivalents and Net Assets"; its individual lines and every
   other non-equity Asset Type are shown separately, never merged.
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, K = HPI.kit, C = HPI.charts, SH = HPI.shell;
  const esc = U.esc;

  function cashLines(M, pid, mi) {
    const all = M.positions(pid, mi) || [];
    const lines = all.filter((p) => p.cls === 'CASH');
    return { lines, total: U.sum(lines, (p) => p.w) };
  }

  HPI.pages.cash = {
    nav: 'Cash',
    title: 'Cash analysis',
    icon: 'cash',
    purpose: 'The cash level in any month and how it moved over time, with every source cash line and other non-equity category kept separate.',
    render(root, S, M) {
      const pid = S.pid, mi = S.mi;
      const pv = SH.prevLabel(pid, mi);
      const prev = pv ? pv.prev : -1;
      const mis = K.months(M, S);
      const labels = K.labels(M, mis), titles = K.titles(M, mis), marker = K.marker(mis, mi);
      const cur = cashLines(M, pid, mi), prv = prev >= 0 ? cashLines(M, pid, prev) : null;
      const assetNow = M.groupMap(pid, mi, 'asset', 'all'), assetPrev = prev >= 0 ? M.groupMap(pid, prev, 'asset', 'all') : null;
      const aw = (gm, k) => (gm && gm.get(k) ? gm.get(k).w : null);
      const vs = pv ? ` vs ${pv.label}` : '';
      const largest = cur.lines.slice().sort((a, b) => b.w - a.w)[0];
      // line & type keys over the range (dynamic, from the data)
      const lineKeys = new Map();
      const typeKeys = new Map();
      for (const m of mis) for (const ps of M.positions(pid, m) || []) {
        if (ps.cls === 'CASH') lineKeys.set(ps.sec, (lineKeys.get(ps.sec) || 0) + Math.abs(ps.w));
        else if (ps.asset !== 'Equity' && ps.cls !== 'EQ') typeKeys.set(ps.assetType || '(blank)', (typeKeys.get(ps.assetType || '(blank)') || 0) + Math.abs(ps.w));
      }
      const lines = Array.from(lineKeys.entries()).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
      const types = Array.from(typeKeys.entries()).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
      const totalSeries = mis.map((m) => cashLines(M, pid, m).total);
      const lineSeries = (sid) => mis.map((m) => { const ps = M.pos(pid, m, sid); return ps ? ps.w : null; });
      const typeSeries = (t) => mis.map((m) => { let s = 0, n = 0; for (const ps of M.positions(pid, m) || []) if (ps.cls !== 'CASH' && ps.cls !== 'EQ' && ps.asset !== 'Equity' && (ps.assetType || '(blank)') === t) { s += ps.w; n++; } return n ? s : null; });
      const mode = ['split', 'types', 'total'].includes(S.cashLines) ? S.cashLines : 'split';
      let hi = null, lo = null;
      mis.forEach((m, i) => { const v = totalSeries[i]; if (!hi || v > hi.v) hi = { v, m }; if (!lo || v < lo.v) lo = { v, m }; });

      const cashTypes = Array.from(new Set(M.records.filter((r) => r.cls === 'CASH').map((r) => r.assetType || '(blank)')));
      root.innerHTML = `${SH.header('cash')}
        ${UI.notice('info', `<strong>Cash &amp; net assets</strong> is the source Asset Type “${cashTypes.map(esc).join('”, “')}”. In this portfolio’s range it contains: ${lines.map((sid) => esc(M.secName(sid))).join(', ') || 'no lines'}. Net current assets can be negative. Other non-equity holdings (certificates of deposit, commercial paper, treasury bills, deposits and so on) keep their own source categories and are never folded into cash.`)}
        <section class="profile"><div class="profile-top"><div class="profile-name">Cash in ${esc(M.months[mi].label)}</div><div class="profile-meta"><span>${esc(M.pName(pid))}</span>${pv ? `<span>Changes compared with ${esc(pv.label)}${pv.gap ? ' (previous available month)' : ''}</span>` : '<span>First month of data</span>'}</div></div>
        ${UI.kpis([
          { label: 'Cash & net assets', value: U.pct(cur.total), sub: prv ? U.pp(cur.total - prv.total) + vs : 'First month of data', test: 'cash-total' },
          { label: 'Previous', value: prv ? U.pct(prv.total) : UI.noData('No earlier month'), sub: pv ? pv.label : '', test: 'cash-prev' },
          { label: 'Largest cash line', value: largest ? U.pct(largest.w) : '—', sub: largest ? esc(U.shortName(M.secName(largest.sec), 30)) : 'No cash lines', test: 'cash-largest' },
          { label: 'Equity (source Asset)', value: U.pct(aw(assetNow, 'Equity') || 0), sub: assetPrev ? U.pp((aw(assetNow, 'Equity') || 0) - (aw(assetPrev, 'Equity') || 0)) + vs : '', test: 'cash-eq' },
          { label: 'Debt (source Asset)', value: aw(assetNow, 'Debt') == null ? '<span class="nodata">None</span>' : U.pct(aw(assetNow, 'Debt')), sub: assetPrev ? U.pp((aw(assetNow, 'Debt') || 0) - (aw(assetPrev, 'Debt') || 0)) + vs : '', test: 'cash-debt' },
          { label: 'Range high / low', value: hi ? U.pct(hi.v) : '—', small: true, sub: hi ? `high ${M.months[hi.m].short}, low ${U.pct(lo.v)} ${M.months[lo.m].short}` : '', test: 'cash-hilo' },
        ])}</section>
        <div class="grid">
          ${UI.card({
            span: 12,
            title: 'Cash over time',
            sub: `${esc(M.months[S.from].label)} – ${esc(M.months[S.to].label)}, % of fund. Every month is plotted; hover for exact values.`,
            actions: UI.seg('cashLines', 'Show', [{ value: 'split', label: 'Cash lines' }, { value: 'types', label: 'Other non-equity types' }, { value: 'total', label: 'Total only' }], mode),
            body: UI.chart('ca-line', 'tall', 'Cash over time'),
          })}
          ${UI.card({ span: 6, title: 'Invested vs other assets', sub: 'Source “Asset” field (Equity / Debt / Others), % of fund', body: UI.chart('ca-asset', '', 'Asset composition over time') })}
          ${UI.card({ span: 6, title: `Non-equity lines in ${esc(M.months[mi].label)}`, sub: `Every line that is not an equity share${pv ? `, with change since ${esc(pv.label)}` : ''}`, flush: true, body: '<div id="ca-lines"></div>' })}
          ${UI.card({ span: 12, title: 'Cash and non-equity categories by month', sub: 'Each source cash line and each non-equity Asset Type in its own column', flush: true, body: '<div id="ca-hist"></div>' })}
        </div>`;

      const ds = [{ label: 'Cash & net assets (total)', data: totalSeries, color: '#16242c', width: 2.5, points: mis.length <= 60 }];
      if (mode === 'split') lines.forEach((sid, i) => ds.push({ label: M.secName(sid), data: lineSeries(sid), color: C.color(i), width: 1.5, dash: [4, 3] }));
      if (mode === 'types') types.forEach((t, i) => ds.push({ label: t, data: typeSeries(t), color: C.color(i + 4), width: 1.5 }));
      C.line(document.getElementById('ca-line'), { labels, titles, unit: 'pct', markerIndex: marker, datasets: ds, onClick: (i) => HPI.setState({ mi: mis[i] }) });
      const ac = K.compose(M, pid, mis, 'asset', 'all', 'fund');
      C.stack(document.getElementById('ca-asset'), { labels, titles, unit: 'pct', markerIndex: marker, datasets: ac.keys.map((k, i) => ({ key: k, label: M.dimLabel('asset', k), data: ac.series.get(k), color: k === 'Equity' ? C.A : k === 'Debt' ? '#e8884c' : k === 'Others' ? '#8e9aa6' : C.color(i + 5) })) });

      const nonEq = (M.positions(pid, mi) || []).filter((p) => p.cls !== 'EQ').map((ps) => ({ sec: ps.sec, ps, pp: prev >= 0 ? M.pos(pid, prev, ps.sec) : undefined }));
      if (prev >= 0) for (const ps of M.positions(pid, prev)) if (ps.cls !== 'EQ' && !M.pos(pid, mi, ps.sec)) nonEq.push({ sec: ps.sec, ps: undefined, pp: ps });
      UI.table(document.getElementById('ca-lines'), {
        id: 'ca-lines',
        caption: 'Non-equity lines',
        rows: nonEq,
        unit: 'line',
        sort: { key: 'w', dir: 'desc' },
        exportName: K.exp(M, pid, 'non_equity_lines', K.key(M, mi)),
        columns: [
          K.secCol(M),

      }
      for (const t of types) {
        const ser = typeSeries(t);
        cols.push({ key: 't' + t, label: U.shortName(t, 24), num: true, value: (r) => ser[r.j], html: (r) => (ser[r.j] == null ? '<span class="nodata">—</span>' : U.pct(ser[r.j])), csvLabel: t + ' %', title: t });
      }
      cols.push({ key: 'eq', label: 'Equity (Asset)', num: true, value: (r) => (M.groupMap(pid, r.m, 'asset', 'all').get('Equity') || { w: 0 }).w, html: (r) => U.pct((M.groupMap(pid, r.m, 'asset', 'all').get('Equity') || { w: 0 }).w) });
      UI.table(document.getElementById('ca-hist'), { id: 'ca-hist', caption: 'Cash by month', rows, unit: 'month', sort: { key: 'm', dir: 'desc' }, pageSize: 50, exportName: K.exp(M, pid, 'cash_history', K.key(M, S.from), K.key(M, S.to)), rowClass: (r) => (r.m === mi ? 'sel' : ''), onRowClick: (r) => HPI.setState({ mi: r.m }), columns: cols });
    },
  };
})();

/* =============================================================================
   16_movements.js — Buying & selling: observed portfolio movements

(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, K = HPI.kit, C = HPI.charts, SH = HPI.shell;
  const esc = U.esc;
  const ST = ['NEW', 'RE-ENTERED', 'INCREASED', 'REDUCED', 'EXITED', 'UNCHANGED'];
  const ST_COLOR = { NEW: '#0f7f86', 'RE-ENTERED': '#6b46c1', INCREASED: '#15803d', REDUCED: '#d97706', EXITED: '#c0392b', UNCHANGED: '#b8c2cc' };

  HPI.pages.movements = {
    nav: 'Portfolio movements',
    title: 'Buying & selling — portfolio movements',
    icon: 'moves',
    purpose: 'Which holdings were added, increased, reduced or exited — month by month, over any period, and for the whole history.',
    render(root, S, M) {
      const tab = S.tabs.movements;
      const scope = S.movScope === 'all' ? 'all' : 'eq';
      root.innerHTML = `${SH.header('movements')}
        ${UI.notice('warn', `<strong>Observed changes, not confirmed transactions.</strong> The source contains month-end holdings only (quantity and allocation). A change in quantity between two month-ends is shown as <em>increased</em> or <em>reduced</em>; trades within a month, and the prices paid, are not visible. With the allocation basis, a move can come purely from price changes. Quantities in the source are already adjusted for splits and bonuses.`)}
        <div class="toolbar">${K.moveSeg(S.movBasis)}${K.scopeSeg('movScope', scope)}</div>
        ${UI.tabs('movements', [{ id: 'monthly', label: 'Monthly' }, { id: 'period', label: 'Selected period' }, { id: 'stats', label: 'Movement statistics' }, { id: 'events', label: 'Entries & exits' }, { id: 'consistency', label: 'Holding consistency' }], tab)}
        <div id="mv-body" role="tabpanel" aria-labelledby="tab-movements-${tab}"></div>`;
      const body = root.querySelector('#mv-body');
      ({ monthly, period, stats, events, consistency }[tab] || monthly)(body, S, M, scope);
    },
  };

  const basisText = (S) => (S.movBasis === 'qty' ? 'reported quantity (allocation used where no quantity is reported, marked *)' : 'allocation (Holding %)');

  /* ------------------------------------------------------------------ */
  function monthly(body, S, M, scope) {
    const pid = S.pid, mi = S.mi;
    const mv = M.movement(pid, mi, S.movBasis, scope);
    if (!mv.rows) {
      body.innerHTML = UI.card({ title: `Movements in ${esc(M.months[mi].label)}`, body: UI.empty('No earlier month to compare with.', `${M.months[mi].label} is the first month of data for ${M.pName(pid)}. Choose a later month.`) });
      return;
    }
    const cnt = M.countStatus(mv.rows);
    const filt = ST.includes(S.movFilter) ? S.movFilter : 'all';
    const rows = filt === 'all' ? mv.rows : mv.rows.filter((r) => r.status === filt);
    const gap = mi - mv.prev > 1;
    body.innerHTML = UI.card({
      title: `${esc(M.months[mv.prev].label)} → ${esc(M.months[mi].label)}`,
      sub: `${K.scopeLabel(scope)}; classified by ${basisText(S)}.${gap ? ' The months in between have no data, so the comparison uses the previous available month.' : ''}`,
      flush: true,
      body: `<div style="padding:0 16px 10px">${UI.chips('movFilter', [{ value: 'all', label: 'All', n: mv.rows.length }, ...ST.map((s) => ({ value: s, label: UI.statusText(s), n: cnt[s] }))], filt, 'Filter by movement')}</div><div id="mv-t"></div>`,
    });
    UI.table(document.getElementById('mv-t'), {
      id: 'mv-t',
      caption: 'Monthly movements',
      rows,
      unit: 'holding',
      sort: { key: 'dW', dir: 'desc' },
      search: (r) => r.name + ' ' + M.isinText(r.sec) + ' ' + (r.sector || ''),
      exportName: K.exp(M, pid, 'movements', K.key(M, mv.prev), K.key(M, mi), S.movBasis),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        K.secCol(M),
        K.isinCol(M),
        { key: 'status', label: 'Movement', value: (r) => K.statusOrder[r.status], html: (r) => UI.moveBadge(r, S.movBasis), csv: (r) => r.status },
        { key: 'wA', label: 'Previous allocation', num: true, value: (r) => r.wA, html: (r) => (r.a ? UI.pctCell(r.wA) : UI.notHeld()), csv: (r) => r.wA },
        { key: 'wB', label: 'Current allocation', num: true, value: (r) => r.wB, html: (r) => (r.b ? UI.pctCell(r.wB) : UI.notHeld()), csv: (r) => r.wB },
        { key: 'dW', label: 'Allocation change', num: true, value: (r) => r.dW, html: (r) => UI.ppCell(r.dW), title: 'Change in allocation: the later allocation minus the earlier one' },
        { key: 'qA', label: 'Previous quantity', num: true, value: (r) => r.qA, html: (r) => (r.a ? U.qty(r.qA) : '—') },
        { key: 'qB', label: 'Current quantity', num: true, value: (r) => r.qB, html: (r) => (r.b ? U.qty(r.qB) : '—') },
        { key: 'dQ', label: 'Quantity change', num: true, value: (r) => r.dQ, html: (r) => (r.dQ == null ? '—' : `<span class="${r.dQ > 0 ? 'pos' : r.dQ < 0 ? 'neg' : ''}">${U.qtyDelta(r.dQ)}</span>`) },
        { key: 'relQ', label: 'Qty change %', num: true, value: (r) => r.relQ, html: (r) => (r.relQ == null ? '<span class="faint">—</span>' : UI.chgCell(r.relQ)) },
        { key: 'est', label: 'Est. value of qty change', num: true, value: (r) => r.estValue, html: (r) => (r.estValue == null ? '<span class="faint">—</span>' : `<span class="${r.estValue > 0 ? 'pos' : r.estValue < 0 ? 'neg' : ''}">${U.crDelta(r.estValue)}</span>`), title: 'Quantity change × month-end price (₹ cr). An estimate: actual trade prices are not in the source.' },
        { key: 'sector', label: 'Sector', value: (r) => r.sector || '', html: (r) => esc(r.sector || '—') },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function periodRows(M, pid, a, b, basis, scope) {
    const fn = M.scopeFn(scope);
    const mis = M.availIn(pid, a, b);
    const ids = new Set();
    for (const m of mis) for (const ps of M.positions(pid, m)) if (fn(ps)) ids.add(ps.sec);
    const rows = [];
    for (const sid of ids) {
      const s = M.series(pid, sid);
      const inA = s.state[a] === 2, inB = s.state[b] === 2;
      const held = mis.filter((m) => s.state[m] === 2);
      let group;
      if (!inA && inB) group = 'ADDED';
      else if (inA && !inB) group = 'REMOVED';
      else if (!inA && !inB) group = 'TRANSIENT';
      else group = M.statusOf(pid, sid, a, b, basis).status;
      const pa = M.pos(pid, a, sid), pb = M.pos(pid, b, sid);
      rows.push({
        sec: sid, name: M.secName(sid), group, throughout: held.length === mis.length,
        wA: pa ? pa.w : null, wB: pb ? pb.w : null, qA: pa ? pa.qty : null, qB: pb ? pb.qty : null,
        held: held.length, first: held[0], last: held[held.length - 1], sector: (pb || pa || M.pos(pid, held[0], sid)).sector,
      });
    }
    return { rows, mis };
  }
  const GROUP = {
    ADDED: { badge: 'NEW', text: 'Added' },
    REMOVED: { badge: 'EXITED', text: 'Removed' },
    INCREASED: { badge: 'INCREASED', text: 'Increased' },
    REDUCED: { badge: 'REDUCED', text: 'Reduced' },
    UNCHANGED: { badge: 'UNCHANGED', text: 'Unchanged' },
    TRANSIENT: { badge: 'RE-ENTERED', text: 'In and out within the period' },
    UNKNOWN: { badge: 'UNKNOWN', text: 'Unknown' },
  };
  function period(body, S, M, scope) {
    const pid = S.pid, a = S.from, b = S.to;
    if (a === b) { body.innerHTML = UI.card({ title: 'Selected period', body: UI.empty('The range covers a single month.', 'Choose a start month earlier than the end month (or use a quick period).') }); return; }
    const { rows, mis } = periodRows(M, pid, a, b, S.movBasis, scope);
    const c = {};
    for (const r of rows) c[r.group] = (c[r.group] || 0) + 1;
    const nThrough = rows.filter((r) => r.throughout).length;
    const filt = S.periodFilter || 'all';
    const shown = filt === 'all' ? rows : filt === 'THROUGHOUT' ? rows.filter((r) => r.throughout) : rows.filter((r) => r.group === filt);
    body.innerHTML = UI.card({
      title: `${esc(M.months[a].label)} → ${esc(M.months[b].label)}`,
      sub: `${mis.length} months, ${K.scopeLabel(scope)}. Added / removed compare the first and last month of the range; increased / reduced use ${basisText(S)}; “held throughout” means present in every month of the range.`,
      flush: true,
      body: `<div style="padding:0 16px 10px">${UI.chips('periodFilter', [{ value: 'all', label: 'All', n: rows.length }, { value: 'ADDED', label: 'Added', n: c.ADDED || 0 }, { value: 'REMOVED', label: 'Removed', n: c.REMOVED || 0 }, { value: 'INCREASED', label: 'Increased', n: c.INCREASED || 0 }, { value: 'REDUCED', label: 'Reduced', n: c.REDUCED || 0 }, { value: 'UNCHANGED', label: 'Unchanged', n: c.UNCHANGED || 0 }, { value: 'THROUGHOUT', label: 'Held throughout', n: nThrough }, { value: 'TRANSIENT', label: 'In and out', n: c.TRANSIENT || 0 }], filt, 'Filter by change over the period')}</div><div id="mv-p"></div>`,
    });
    UI.table(document.getElementById('mv-p'), {
      id: 'mv-p',
      caption: 'Movements over the period',
      rows: shown,
      unit: 'holding',
      sort: { key: 'dW', dir: 'desc' },
      search: (r) => r.name + ' ' + (r.sector || ''),
      exportName: K.exp(M, pid, 'period_movements', K.key(M, a), K.key(M, b), S.movBasis),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        K.secCol(M),
        K.isinCol(M),
        { key: 'group', label: 'Over the period', value: (r) => r.group, html: (r) => UI.badge(GROUP[r.group].badge, null, GROUP[r.group].text), csv: (r) => GROUP[r.group].text },
        { key: 'thr', label: 'Held throughout', value: (r) => (r.throughout ? 1 : 0), html: (r) => (r.throughout ? 'Yes' : '<span class="muted">No</span>'), csv: (r) => (r.throughout ? 'Yes' : 'No') },
        { key: 'wA', label: M.months[a].short, num: true, value: (r) => r.wA, html: (r) => (r.wA == null ? UI.notHeld() : UI.pctCell(r.wA)), csv: (r) => r.wA },
        { key: 'wB', label: M.months[b].short, num: true, value: (r) => r.wB, html: (r) => (r.wB == null ? UI.notHeld() : UI.pctCell(r.wB)), csv: (r) => r.wB },
        { key: 'dW', label: 'Allocation change', num: true, value: (r) => (r.wB || 0) - (r.wA || 0), html: (r) => UI.ppCell((r.wB || 0) - (r.wA || 0)) },
        { key: 'relQ', label: 'Qty change %', num: true, value: (r) => (r.qA != null && r.qB != null ? U.relChange(r.qA, r.qB) : null), html: (r) => (r.qA != null && r.qB != null ? UI.chgCell(U.relChange(r.qA, r.qB)) : '<span class="faint">—</span>') },
        { key: 'held', label: 'Months held', num: true, value: (r) => r.held, html: (r) => `${r.held} <span class="muted">of ${mis.length}</span>` },
        { key: 'first', label: 'First in range', value: (r) => r.first, html: (r) => esc(M.months[r.first].short), csv: (r) => M.months[r.first].key },
        { key: 'last', label: 'Last in range', value: (r) => r.last, html: (r) => esc(M.months[r.last].short), csv: (r) => M.months[r.last].key },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function stats(body, S, M, scope) {
    const pid = S.pid;
    const thr = +S.matThreshold || 0.25;
    const mis = K.months(M, S).filter((m) => M.prevAvail(pid, m) >= 0);
    if (!mis.length) { body.innerHTML = UI.card({ title: 'Movement statistics', body: UI.empty('No month in the range has an earlier month to compare with.', '') }); return; }
    const data = mis.map((m) => {
      const mv = M.movement(pid, m, S.movBasis, scope);
      const c = M.countStatus(mv.rows);
      let gross = 0, net = 0, traded = 0, netVal = 0, mat = 0, nVal = 0;
      for (const r of mv.rows) {
        if (U.isNum(r.dW)) { gross += Math.abs(r.dW); net += r.dW; if (Math.abs(r.dW) >= thr) mat++; }
        if (r.estValue != null) { traded += Math.abs(r.estValue); netVal += r.estValue; nVal++; }
      }
      return { m, prev: mv.prev, c, gross, net, traded, netVal, mat, n: mv.rows.length };
    });
    const labels = K.labels(M, mis), titles = mis.map((m, i) => `${M.months[data[i].prev].label} → ${M.months[m].label}`);
    body.innerHTML = `${UI.notice('info', 'These statistics summarise observed month-end changes. They are not a formal portfolio turnover ratio: intra-month trading, trade prices and flows are not in the source. <em>Gross allocation movement</em> = Σ |change in allocation| across holdings; <em>net</em> = Σ change (for stocks only this equals the change in total equity weight). <em>Estimated traded value</em> = Σ |quantity change × month-end price|.')}
      <div class="grid">
        ${UI.card({ span: 12, title: 'Number of holdings changing, by month', sub: `${K.scopeLabel(scope)}; unchanged holdings are omitted from the bars`, body: UI.chart('ms-count', 'tall', 'Holdings changing by month') })}
        ${UI.card({ span: 6, title: 'Allocation movement', sub: 'Gross Σ|Δ| and net ΣΔ of allocation, % of fund', body: UI.chart('ms-alloc', '', 'Allocation movement by month') })}
        ${UI.card({ span: 6, title: 'Estimated traded value', sub: 'Σ |quantity change × month-end price|, ₹ cr (holdings with quantity)', body: UI.chart('ms-val', '', 'Estimated traded value by month') })}
        ${UI.card({ span: 12, title: 'By month', sub: `Material change = |allocation change| ≥ ${U.fmt(thr, 2)}%`, actions: UI.seg('matThreshold', 'Material change', [{ value: '0.1', label: '0.10%' }, { value: '0.25', label: '0.25%' }, { value: '0.5', label: '0.50%' }, { value: '1', label: '1.00%' }], String(S.matThreshold || '0.25')), flush: true, body: '<div id="ms-t"></div>' })}
      </div>`;
    C.stack(document.getElementById('ms-count'), { labels, titles, unit: 'count', area: false, datasets: ['NEW', 'RE-ENTERED', 'INCREASED', 'REDUCED', 'EXITED'].map((s) => ({ key: s, label: UI.statusText(s), data: data.map((d) => d.c[s]), color: ST_COLOR[s] })) });
    C.line(document.getElementById('ms-alloc'), { labels, titles, unit: 'pp', zero: true, datasets: [{ label: 'Gross', data: data.map((d) => d.gross), color: C.A, unit: 'pp' }, { label: 'Net', data: data.map((d) => d.net), color: C.B, unit: 'pp' }] });
    C.bar(document.getElementById('ms-val'), { labels, titles, unit: 'cr', thick: 14, datasets: [{ label: 'Estimated traded value', data: data.map((d) => d.traded), color: '#6b7c93', unit: 'cr' }] });
    UI.table(document.getElementById('ms-t'), {
      id: 'ms-t',
      caption: 'Movement statistics by month',
      rows: data.slice().reverse(),
      unit: 'month',
      pageSize: 50,
      sort: { key: 'm', dir: 'desc' },
      exportName: K.exp(M, pid, 'movement_statistics', K.key(M, S.from), K.key(M, S.to), S.movBasis, scope),
      onRowClick: (r) => HPI.setState({ mi: r.m, tabs: Object.assign({}, S.tabs, { movements: 'monthly' }) }),
      columns: [
        { key: 'm', label: 'Month', value: (r) => r.m, html: (r) => `${esc(M.months[r.m].label)}${r.m - r.prev > 1 ? ` <span class="muted">(vs ${esc(M.months[r.prev].short)})</span>` : ''}`, csv: (r) => M.months[r.m].key },
        ...ST.map((s) => ({ key: s, label: UI.statusText(s), num: true, value: (r) => r.c[s], html: (r) => U.int(r.c[s]) })),
        { key: 'mat', label: 'Material changes', num: true, value: (r) => r.mat, html: (r) => U.int(r.mat) },
        { key: 'gross', label: 'Gross movement', num: true, value: (r) => r.gross, html: (r) => U.fmt(r.gross, 2) + '%' },
        { key: 'net', label: 'Net movement', num: true, value: (r) => r.net, html: (r) => UI.ppCell(r.net) },
        { key: 'traded', label: 'Est. traded value', num: true, value: (r) => r.traded, html: (r) => U.cr(r.traded) },
        { key: 'netVal', label: 'Est. net value', num: true, value: (r) => r.netVal, html: (r) => U.crDelta(r.netVal) },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function events(body, S, M, scope) {
    const pid = S.pid;
    const rows = [];
    for (const m of K.months(M, S)) {
      const mv = M.movement(pid, m, S.movBasis, scope);
      if (!mv.rows) continue;
      for (const r of mv.rows) if (r.status === 'NEW' || r.status === 'RE-ENTERED' || r.status === 'EXITED') {
        const s = M.series(pid, r.sec);
        rows.push({ m, prev: mv.prev, sec: r.sec, name: r.name, status: r.status, wA: r.wA, wB: r.wB, first: s.first, last: s.last, sector: r.sector });
      }
    }
    const filt = ['NEW', 'RE-ENTERED', 'EXITED'].includes(S.eventFilter) ? S.eventFilter : 'all';
    const c = { NEW: 0, 'RE-ENTERED': 0, EXITED: 0 };
    for (const r of rows) c[r.status]++;
    const shown = filt === 'all' ? rows : rows.filter((r) => r.status === filt);
    body.innerHTML = UI.card({
      title: `Securities entering and leaving, ${esc(M.months[S.from].label)} – ${esc(M.months[S.to].label)}`,
      sub: `${K.scopeLabel(scope)}. Each event compares a month with the previous available month. The portfolio’s first month of data is not counted as entries.`,
      flush: true,
      body: `<div style="padding:0 16px 10px">${UI.chips('eventFilter', [{ value: 'all', label: 'All', n: rows.length }, { value: 'NEW', label: 'New', n: c.NEW }, { value: 'RE-ENTERED', label: 'Re-entered', n: c['RE-ENTERED'] }, { value: 'EXITED', label: 'Exited', n: c.EXITED }], filt, 'Filter events')}</div><div id="ev-t"></div>`,
    });
    UI.table(document.getElementById('ev-t'), {
      id: 'ev-t',
      caption: 'Entry and exit events',
      rows: shown,
      unit: 'event',
      sort: { key: 'm', dir: 'desc' },
      search: (r) => r.name + ' ' + (r.sector || ''),
      exportName: K.exp(M, pid, 'entries_exits', K.key(M, S.from), K.key(M, S.to)),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        { key: 'm', label: 'Month', value: (r) => r.m, html: (r) => esc(M.months[r.m].label), csv: (r) => M.months[r.m].key },
        K.secCol(M),
        K.isinCol(M),
        { key: 'status', label: 'Event', value: (r) => K.statusOrder[r.status], html: (r) => UI.badge(r.status), csv: (r) => r.status },
        { key: 'wA', label: 'Previous allocation', num: true, value: (r) => r.wA, html: (r) => (r.wA == null ? UI.notHeld() : UI.pctCell(r.wA)), csv: (r) => r.wA },
        { key: 'wB', label: 'Current allocation', num: true, value: (r) => r.wB, html: (r) => (r.wB == null ? UI.notHeld() : UI.pctCell(r.wB)), csv: (r) => r.wB },
        { key: 'first', label: 'First observed', value: (r) => r.first, html: (r) => esc(M.months[r.first].label), csv: (r) => M.months[r.first].key },
        { key: 'last', label: 'Last observed', value: (r) => r.last, html: (r) => esc(M.months[r.last].label), csv: (r) => M.months[r.last].key },
        { key: 'sector', label: 'Sector', value: (r) => r.sector || '', html: (r) => esc(r.sector || '—') },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function consistency(body, S, M, scope) {
    const pid = S.pid;
    const mis = K.months(M, S);
    const avail = M.avail(pid);
    const fn = M.scopeFn(scope);
    const ids = new Set();
    for (const m of mis) for (const ps of M.positions(pid, m)) if (fn(ps)) ids.add(ps.sec);
    const rows = Array.from(ids).map((sid) => {
      const s = M.series(pid, sid);
      const runs = M.runs(pid, sid);
      const since = avail.filter((m) => m >= s.first).length;
      const inRange = mis.filter((m) => s.state[m] === 2).length;
      const longest = runs.reduce((a, r) => Math.max(a, r.n), 0);
      return { sec: sid, name: M.secName(sid), s, runs: runs.length, since, inRange, longest, cover: (s.count / since) * 100, now: s.state[avail[avail.length - 1]] === 2 };
    });
    body.innerHTML = UI.card({
      title: 'Holding consistency',
      sub: `Every security held at any point in ${esc(M.months[S.from].label)} – ${esc(M.months[S.to].label)} (${K.scopeLabel(scope)}), with its whole observed history in this portfolio. Coverage = months held ÷ months with data since it was first observed. The strip shows the portfolio’s full history.`,
      flush: true,
      body: '<div id="cs-t"></div>',
    });
    UI.table(document.getElementById('cs-t'), {
      id: 'cs-t',
      caption: 'Holding consistency',
      rows,
      unit: 'security',
      sort: { key: 'count', dir: 'desc' },
      search: (r) => r.name,
      exportName: K.exp(M, pid, 'holding_consistency', K.key(M, S.from), K.key(M, S.to)),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        K.secCol(M),
        K.isinCol(M),
        { key: 'first', label: 'First observed', value: (r) => r.s.first, html: (r) => esc(M.months[r.s.first].short), csv: (r) => M.months[r.s.first].key },
        { key: 'last', label: 'Last observed', value: (r) => r.s.last, html: (r) => `${esc(M.months[r.s.last].short)}${r.now ? ' <span class="muted">(held)</span>' : ''}`, csv: (r) => M.months[r.s.last].key },
        { key: 'count', label: 'Months held', num: true, value: (r) => r.s.count, html: (r) => U.int(r.s.count) },
        { key: 'cover', label: 'Coverage', num: true, value: (r) => r.cover, html: (r) => U.fmt(r.cover, 1) + '%' },
        { key: 'runs', label: 'Holding periods', num: true, value: (r) => r.runs, html: (r) => U.int(r.runs) },
        { key: 're', label: 'Re-entries', num: true, value: (r) => r.runs - 1, html: (r) => U.int(r.runs - 1) },
        { key: 'longest', label: 'Longest period', num: true, value: (r) => r.longest, html: (r) => U.int(r.longest) + ' mo' },
        { key: 'inRange', label: 'Held in range', num: true, value: (r) => r.inRange, html: (r) => `${r.inRange} <span class="muted">of ${mis.length}</span>` },
        { key: 'strip', label: 'History', sortable: false, csv: false, html: (r) => UI.miniPresence(r.s, avail) },
      ],
    });
  }
})();

/* ---- 17_overlap.js ---- */
/* =============================================================================
   17_overlap.js — Fund overlap & cross-portfolio comparison
   Overlap method — the same calculation as the Fund Performance Dashboard
   (calculateFundOverlap), applied identically in every month:
     universe       : equity shares (default) or all identified securities
     matching       : canonical identifier (ISIN; name only where no ISIN),
                      duplicate rows summed per holding
     shared weight  = Σ over common holdings of min(wA, wB), source Holding (%)
     overlap score  = shared weight ÷ min(allocation A, allocation B)
                      (symmetric: A vs B = B vs A)
     smaller allocation = that denominator; shared holdings = common count.
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, K = HPI.kit, C = HPI.charts, SH = HPI.shell;
  const esc = U.esc;

  const METHOD = (uni) => `
    <p>Overlap is calculated exactly as in the Fund Performance Dashboard’s <em>Funds Overlap</em> section.</p>
    <p><strong>Which holdings are compared.</strong> ${uni === 'broad' ? 'All identified securities: equity shares, preference shares, rights, warrants, REITs &amp; InvITs, mutual fund units and debt instruments. Cash, net current assets, deposits and derivatives are excluded because they are not the same security in two funds.' : 'Equity shares only (domestic equities, overseas equities, ADRs &amp; GDRs) — the stock holdings the Fund Performance Dashboard compares. Cash, debt, deposits and derivatives are excluded.'}</p>
    <p><strong>How holdings are matched.</strong> By ISIN when available, otherwise by normalised name. If a fund reports the same holding on several lines (for example, a rights entitlement the source lists under its company’s ISIN), their weights are added together first and the lines count as one holding.</p>
    <p><strong>Shared holdings</strong> = holdings held by both funds in the month.</p>
    <p><strong>Shared weight</strong> = the sum of <em>min(weight in Fund A, weight in Fund B)</em> for each matched holding, using the source Holding (%).</p>
    <p><strong>Overlap score</strong> = shared weight ÷ the smaller fund’s allocation to the compared holdings (<strong>smaller allocation</strong>). Because it uses the smaller of the two, A vs B and B vs A show the same value, and the score runs from 0% to 100%.</p>
    <p>The same definitions are applied to every month; the history chart uses only months in which both funds have data.</p>`;

  HPI.pages.overlap = {
    nav: 'Fund overlap',
    title: 'Fund overlap & comparison',
    icon: 'overlap',
    purpose: 'Which holdings two portfolios share in any month, which securities create the overlap, how it changed over time, and how the two portfolios compare.',
    render(root, S, M) {
      const A = S.pid, B = S.pidB;
      if (B == null) {
        root.innerHTML = SH.header('overlap') + UI.empty('No other portfolio has a month in common with this one.', 'Overlap needs two portfolios with data in the same month.');
        return;
      }
      const common = M.commonAvail(A, B);
      let mi = S.mi, note = '';
      if (!common.includes(mi)) {
        const before = common.filter((m) => m <= S.mi);
        mi = before.length ? before[before.length - 1] : common[0];
        note = `${M.pName(B)} has no data for ${M.months[S.mi].label}; overlap is shown for ${M.months[mi].label}, the nearest month both funds have.`;
      }
      let range = common.filter((m) => m >= S.from && m <= S.to);
      let rnote = '';
      if (!range.length) { range = common; rnote = 'The selected range has no month in common, so the full common history is used.'; }
      const uni = S.ovUniverse === 'broad' ? 'broad' : 'eq';
      const tab = S.tabs.overlap;
      const opts = M.portfolioOrder.filter((p) => p !== A).map((p) => {
        const n = M.commonAvail(A, p).length;
        return `<option value="${p}" ${p === B ? 'selected' : ''} ${n ? '' : 'disabled'}>${esc(M.pName(p))}${n ? '' : ' — no common months'}</option>`;
      }).join('');
      root.innerHTML = `${SH.header('overlap', [SH.chip('Fund B', esc(M.pName(B)), true), SH.chip('Overlap month', esc(M.months[mi].label))])}
        <div class="toolbar">
          <span class="ctl"><span class="ctl-label">Fund A</span><strong>${esc(M.pName(A))}</strong></span>
          <button type="button" class="icon-btn" id="ov-swap" aria-label="Swap fund A and fund B" title="Swap A and B">${UI.icon('swap')}</button>
          <span class="ctl"><label class="ctl-label" for="ov-b">Fund B</label><select id="ov-b" style="width:320px">${opts}</select></span>
          ${UI.seg('ovUniverse', 'Holdings compared', [{ value: 'eq', label: 'Equity shares' }, { value: 'broad', label: 'All identified securities' }], uni)}
        </div>
        ${note ? UI.notice('info', esc(note)) : ''}${rnote ? UI.notice('info', esc(rnote)) : ''}
        <details class="card" style="margin-bottom:14px"><summary style="padding:10px 16px;cursor:pointer;font-weight:700">How overlap is calculated</summary><div class="doc" style="padding:0 16px 12px">${METHOD(uni)}</div></details>
        ${UI.tabs('overlap', [{ id: 'month', label: 'Month' }, { id: 'history', label: 'Overlap history' }, { id: 'compare', label: 'Compare the two portfolios' }], tab)}
        <div id="ov-body" role="tabpanel" aria-labelledby="tab-overlap-${tab}"></div>`;
      root.querySelector('#ov-b').addEventListener('change', (e) => HPI.setState({ pidB: +e.target.value }));
      root.querySelector('#ov-swap').addEventListener('click', () => HPI.setState({ pid: B, pidB: A }));
      const body = root.querySelector('#ov-body');
      ({ month, history, compare }[tab] || month)(body, S, M, A, B, mi, range, uni);
    },
  };

  const aName = (M, A) => U.shortName(K.pShort(M.pName(A)), 26);

  /* ------------------------------------------------------------------ */
  function month(body, S, M, A, B, mi, range, uni) {
    const o = M.overlap(A, B, mi, uni);
    const filt = ['COMMON', 'ONLY_A', 'ONLY_B'].includes(S.ovFilter) ? S.ovFilter : 'all';
    const rows = filt === 'all' ? o.rows : o.rows.filter((r) => r.status === filt);
    const la = aName(M, A), lb = aName(M, B);
    body.innerHTML = `
      <section class="profile"><div class="profile-top"><div class="profile-name">${esc(M.months[mi].label)}</div><div class="profile-meta"><span>A: ${esc(M.pName(A))}</span><span>B: ${esc(M.pName(B))}</span><span>${uni === 'broad' ? 'All identified securities' : 'Equity shares'}</span></div></div>
      ${UI.kpis([
        { label: 'Overlap score', value: U.pct(o.score), sub: 'Shared weight ÷ smaller allocation', test: 'ov-score', info: METHOD(uni) },
        { label: 'Shared weight', value: U.pct(o.shared), sub: 'Σ min(weight A, weight B)', test: 'ov-shared', info: METHOD(uni) },
        { label: 'Smaller allocation', value: U.pct(o.base), sub: 'Denominator of the score', test: 'ov-base' },
        { label: 'Shared holdings', value: U.int(o.common), sub: `A holds ${o.nA}, B holds ${o.nB}`, test: 'ov-common' },
        { label: 'Allocation A / B', value: `${U.pct(o.sumA)} / ${U.pct(o.sumB)}`, sub: uni === 'broad' ? 'compared holdings, % of fund' : 'stock allocation, % of fund', small: true, test: 'ov-alloc' },
        { label: 'Only in A / only in B', value: `${o.onlyA} / ${o.onlyB}`, sub: `shared: ${o.pctA == null ? '—' : U.fmt(o.pctA, 1) + '%'} of A · ${o.pctB == null ? '—' : U.fmt(o.pctB, 1) + '%'} of B`, subTitle: 'Shared holdings as a share of each fund’s number of holdings', small: true, test: 'ov-only' },
      ])}</section>
      ${UI.card({
        title: 'Securities behind the overlap',
        sub: `Weights are each fund’s source Holding (%). Difference = A − B. Shared weight = min(A, B); these add up to the shared weight above. Select a row for both funds’ history of that security.`,
        flush: true,
        body: `<div style="padding:0 16px 10px">${UI.chips('ovFilter', [{ value: 'all', label: 'All', n: o.rows.length }, { value: 'COMMON', label: 'Shared', n: o.common }, { value: 'ONLY_A', label: 'Only in A', n: o.onlyA }, { value: 'ONLY_B', label: 'Only in B', n: o.onlyB }], filt, 'Filter by status')}</div><div id="ov-t"></div>`,
      })}`;
    UI.table(document.getElementById('ov-t'), {
      id: 'ov-t',
      caption: 'Overlap securities',
      rows,
      unit: 'security',
      sort: { key: 'min', dir: 'desc' },
      search: (r) => r.name + ' ' + M.isinText(r.sec) + ' ' + (r.sector || ''),
      exportName: U.fileSafe(`Overlap_${K.pShort(M.pName(A))}_vs_${K.pShort(M.pName(B))}_${M.months[mi].key}_${uni}`),
      onRowClick: (r) => drill(S, M, A, B, r.sec, range, uni, r.secB),
      columns: [
        K.secCol(M),
        K.isinCol(M),
        { key: 'wA', label: `A: ${la}`, num: true, value: (r) => r.wA, html: (r) => (r.wA == null ? UI.notHeld() : UI.pctCell(r.wA)), csv: (r) => r.wA, csvLabel: 'Fund A weight %' },
        { key: 'wB', label: `B: ${lb}`, num: true, value: (r) => r.wB, html: (r) => (r.wB == null ? UI.notHeld() : UI.pctCell(r.wB)), csv: (r) => r.wB, csvLabel: 'Fund B weight %' },
        { key: 'diff', label: 'Difference', num: true, value: (r) => r.diff, html: (r) => UI.ppCell(r.diff), title: 'Fund A allocation minus Fund B allocation (not held counts as no weight)' },
        { key: 'min', label: 'Shared weight', num: true, title: 'min(weight A, weight B)', value: (r) => r.min, html: (r) => (r.min == null ? '<span class="faint">—</span>' : U.pct(r.min)), csv: (r) => r.min },
        { key: 'status', label: 'Status', value: (r) => r.status, html: (r) => UI.badge(r.status), csv: (r) => r.status },
        { key: 'sector', label: 'Sector', value: (r) => r.sector || '', html: (r) => esc(r.sector || '—') },
        { key: 'mcap', label: 'Market cap', value: (r) => r.mcap || '', html: (r) => esc(r.mcap || '(blank)') },
      ],
    });
  }

  /** drilldown: one security in both funds over the common months of the range */
  function drill(S, M, A, B, sid, range, uni, sidB) {
    const sa = M.series(A, sid), sb = M.series(B, sidB != null ? sidB : sid);
    const sec = M.sec(sid);
    const rows = range.slice().reverse().map((m) => {
      const a = sa.state[m] === 2 ? sa.w[m] : null, b = sb.state[m] === 2 ? sb.w[m] : null;
      return { m, a, b, st: a != null && b != null ? 'COMMON' : a != null ? 'ONLY_A' : b != null ? 'ONLY_B' : null };
    });
    const both = rows.filter((r) => r.st === 'COMMON').length;
    const cid = U.uid('ovd');
    const d = UI.dialog(`${sec.name} in both funds`, `
      <dl class="stat-list" style="grid-template-columns:max-content 1fr max-content 1fr;margin-bottom:12px">
        <dt>ISIN</dt><dd>${esc(sec.isin || (sec.isinBad ? sec.isinBad + ' (invalid — matched by name)' : 'none — matched by name'))}</dd><dt>Class</dt><dd>${esc(sec.clsLabel)}</dd>
        <dt>Sector</dt><dd>${esc(Array.from(sec.sectors).join(', ') || '—')}</dd><dt>Market cap</dt><dd>${esc(Array.from(sec.mcaps).join(', ') || '(blank)')}</dd>
        <dt>Common in</dt><dd>${both} of ${range.length} months</dd><dt>Months</dt><dd>${esc(M.months[range[0]].label)} – ${esc(M.months[range[range.length - 1]].label)}</dd>

      ${rows.map((r) => `<tr><td>${esc(M.months[r.m].label)}</td><td class="num">${r.a == null ? UI.notHeld() : UI.pctCell(r.a)}</td><td class="num">${r.b == null ? UI.notHeld() : UI.pctCell(r.b)}</td><td class="num">${r.a == null && r.b == null ? '—' : UI.ppCell((r.a || 0) - (r.b || 0))}</td><td>${r.st ? UI.badge(r.st) : '<span class="muted">Held by neither</span>'}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="muted" style="margin-top:10px">${UI.secLink(M, sid, 'Open the full history in fund A')}</p>`, { sub: `${esc(M.pName(A))} vs ${esc(M.pName(B))}` });

    C.line(document.getElementById('ovh-c'), {

        { label: 'Shared holdings', data: data.map((d) => d.o.common), color: C.B, axis: 'y2', unit: 'count', stepped: true },

    UI.table(document.getElementById('ovh-t'), {
      id: 'ovh-t',
      caption: 'Overlap by month',
      rows: data.slice().reverse(),
      unit: 'month',
      pageSize: 50,
      sort: { key: 'm', dir: 'desc' },
      exportName: U.fileSafe(`Overlap_history_${K.pShort(M.pName(A))}_vs_${K.pShort(M.pName(B))}_${uni}`),
      rowClass: (r) => (r.m === mi ? 'sel' : ''),
      onRowClick: (r) => HPI.setState({ mi: r.m, tabs: Object.assign({}, S.tabs, { overlap: 'month' }) }),
      columns: [
        { key: 'm', label: 'Month', value: (r) => r.m, html: (r) => esc(M.months[r.m].label), csv: (r) => M.months[r.m].key },
        { key: 'score', label: 'Overlap score', num: true, value: (r) => r.o.score, html: (r) => U.pct(r.o.score) },
        { key: 'shared', label: 'Shared weight', num: true, value: (r) => r.o.shared, html: (r) => U.pct(r.o.shared) },
        { key: 'base', label: 'Smaller allocation', num: true, value: (r) => r.o.base, html: (r) => U.pct(r.o.base) },
        { key: 'common', label: 'Shared holdings', num: true, value: (r) => r.o.common, html: (r) => U.int(r.o.common) },
        { key: 'sumA', label: 'A allocation', num: true, value: (r) => r.o.sumA, html: (r) => U.pct(r.o.sumA) },
        { key: 'sumB', label: 'B allocation', num: true, value: (r) => r.o.sumB, html: (r) => U.pct(r.o.sumB) },
        { key: 'nA', label: 'A holdings', num: true, value: (r) => r.o.nA, html: (r) => U.int(r.o.nA) },
        { key: 'nB', label: 'B holdings', num: true, value: (r) => r.o.nB, html: (r) => U.int(r.o.nB) },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  const XP = {
    cashW: { label: 'Cash & net assets', unit: 'pct', get: (s) => s.cashW },
    nEq: { label: 'Equity holdings', unit: 'count', get: (s) => s.nEq },
    top10W: { label: 'Top 10 holdings', unit: 'pct', get: (s) => s.top10W },
    top1: { label: 'Largest holding', unit: 'pct', get: (s) => (s.top1 ? s.top1.w : null) },
    eqW: { label: 'Equity shares, total', unit: 'pct', get: (s) => s.eqW },
    aum: { label: 'Total market value', unit: 'cr', get: (s) => s.aum },
  };
  function compare(body, S, M, A, B, mi, range) {
    const sa = M.summary(A, mi), sb = M.summary(B, mi);

    const mcA = M.groupMap(A, mi, 'mcap', 'eq'), mcB = M.groupMap(B, mi, 'mcap', 'eq');
    const mk = Array.from(new Set([...mcA.keys(), ...mcB.keys()])).map((k) => ({ key: k, label: M.dimLabel('mcap', k), a: mcA.get(k) ? mcA.get(k).w : null, b: mcB.get(k) ? mcB.get(k).w : null })).sort((x, y) => (y.a || 0) + (y.b || 0) - (x.a || 0) - (x.b || 0));
    const topList = (pid) => (M.scoped(pid, mi, 'eq') || []).slice(0, 10).map((ps, i) => `<tr><td class="num">#${i + 1}</td><td><button type="button" class="linkish" style="color:var(--ink)" data-xp-open="${pid}|${ps.sec}">${esc(U.shortName(M.secName(ps.sec), 34))}</button></td><td class="num">${U.pct(ps.w)}</td><td class="num">${M.pos(pid === A ? B : A, mi, ps.sec) ? UI.badge('COMMON') : '<span class="muted">—</span>'}</td></tr>`).join('');
    body.innerHTML = `<div class="grid">
      ${UI.card({
        span: 5,
        title: `Side by side, ${esc(M.months[mi].label)}`,

      ${UI.card({ span: 7, title: 'Sector exposure', sub: 'Stocks only, % of each fund; twelve largest sectors across both', actions: K.csvBtn(U.fileSafe(`Sector_comparison_${K.pShort(M.pName(A))}_vs_${K.pShort(M.pName(B))}_${M.months[mi].key}`), ['Sector', 'Fund A %', 'Fund B %', 'A - B (%)'], sk.map((r) => [r.label, r.a, r.b, (r.a || 0) - (r.b || 0)])), body: UI.chart('xp-sec', 'tall', 'Sector exposure comparison') })}
      ${UI.card({ span: 5, title: 'Market-cap exposure', sub: 'Stocks only, % of fund; source labels', body: UI.chart('xp-mc', 'short', 'Market-cap exposure comparison') })}
      ${UI.card({ span: 7, title: 'Top 10 holdings', sub: '“Common” = also held by the other fund this month', body: `<div class="split"><div><h3 style="font-size:.95rem;margin:0 0 6px">${esc(la)}</h3><div class="table-wrap"><table class="dt"><caption class="visually-hidden">Top holdings of fund A</caption><thead><tr><th class="num" scope="col">Rank</th><th scope="col">Stock</th><th class="num" scope="col">Weight</th><th class="num" scope="col">In B</th></tr></thead><tbody>${topList(A)}</tbody></table></div></div><div><h3 style="font-size:.95rem;margin:0 0 6px">${esc(lb)}</h3><div class="table-wrap"><table class="dt"><caption class="visually-hidden">Top holdings of fund B</caption><thead><tr><th class="num" scope="col">Rank</th><th scope="col">Stock</th><th class="num" scope="col">Weight</th><th class="num" scope="col">In A</th></tr></thead><tbody>${topList(B)}</tbody></table></div></div></div>` })}
      ${UI.card({

        title: `${esc(XP[metric].label)} over time`,

        actions: UI.seg('xpMetric', 'Measure', Object.entries(XP).map(([k, v]) => ({ value: k, label: v.label })), metric),

    const top = sk.slice(0, 12);
    C.bar(document.getElementById('xp-sec'), { labels: top.map((r) => r.label), horizontal: true, unit: 'pct', labelMax: 22, datasets: [{ label: la, data: top.map((r) => r.a || 0), color: C.A }, { label: lb, data: top.map((r) => r.b || 0), color: C.B }] });
    C.bar(document.getElementById('xp-mc'), { labels: mk.map((r) => r.label), horizontal: true, unit: 'pct', datasets: [{ label: la, data: mk.map((r) => r.a || 0), color: C.A }, { label: lb, data: mk.map((r) => r.b || 0), color: C.B }] });
    const labels = K.labels(M, range), titles = K.titles(M, range);

  }
})();
