        if (typeof a.v === 'string' || typeof b.v === 'string') {
          const c = String(a.v).localeCompare(String(b.v), 'en', { sensitivity: 'base', numeric: true });
          return c !== 0 ? c * sign : a.i - b.i;
        }
        return a.v !== b.v ? (a.v - b.v) * sign : a.i - b.i;
      })
      .map((x) => x.r);
  };
  U.sum = (arr, f) => {
    let s = 0;
    for (const x of arr) {
      const v = f ? f(x) : x;
      if (U.isNum(v)) s += v;
    }
    return s;
  };

  /* ---------- CSV / download ---------- */
  const csvCell = (v) => {
    if (v == null || (typeof v === 'number' && !Number.isFinite(v))) return '';
    const s = String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  U.toCSV = (header, rows) => [header.map(csvCell).join(','), ...rows.map((r) => r.map(csvCell).join(','))].join('\r\n');
  U.download = (filename, text) => {
    // application/octet-stream forces a download even when opened from file://
    const blob = new Blob(['\ufeff' + text], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 1500);
  };
  U.fileSafe = (s) => String(s).replace(/[^A-Za-z0-9._-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '').slice(0, 80);

  /* ---------- small helpers ---------- */
  U.debounce = (fn, ms) => {
    let t = 0;
    return (...a) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...a), ms);
    };
  };
  U.uid = (() => {
    let n = 0;
    return (p = 'u') => p + ++n;
  })();
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.plural = (n, s, p) => (n === 1 ? s : p || (/[^aeiou]y$/.test(s) ? s.slice(0, -1) + 'ies' : s + 's'));
  U.shortName = (s, max = 28) => (s && s.length > max ? s.slice(0, max - 1) + '…' : s || '');
  U.downloadFile = (filename, text, mime) => {
    const url = URL.createObjectURL(new Blob([text], { type: (mime || 'application/octet-stream') + ';charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 2000);
  };
  U.tick = () => new Promise((r) => setTimeout(r, 0));
})();

/* ---- 02_model.js ---- */
/* =============================================================================
   02_model.js — normalised historical data model
   -----------------------------------------------------------------------------
   Source (raw extract)  →  records (one per source row)  →  positions
   (portfolio × month × canonical security)  →  aggregates (memoised).

   Security identity (canonical key) = analytical class + identifier:
     • class comes from the source Asset Type (mapping table below);
     • identifier = ISIN when it passes the ISO 6166 check digit, otherwise the
       normalised source name.  Deposits are keyed by counterparty name and
       deposit type (their ISIN field carries the bank's equity ISIN).
   Several source rows can map to one key in a month (the export creates a new
   row whenever a descriptive attribute such as the rating changes).  Their
   values are summed; descriptive attributes come from the row with the largest
   absolute market value.  Rows in different classes are never merged.
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util;

  const ASSET_TYPE_CLASS = {
    'Domestic Equities': 'EQ',
    'Overseas Equities': 'EQ',
    'ADRs & GDRs': 'EQ',
    'Preference Shares': 'PREF',
    Rights: 'RIGHTS',
    Warrants: 'WARRANT',
    'REITs & InvITs': 'REIT',
    'Domestic Mutual Funds Units': 'MFU',
    'Certificate of Deposit': 'DEBT',
    'Commercial Paper': 'DEBT',
    'Treasury Bills': 'DEBT',
    'Government Securities': 'DEBT',
    'Corporate Debt': 'DEBT',
    Deposits: 'DEP',
    'Deposits (Placed as Margin)': 'DEP',
    'Derivatives-Futures': 'DER',
    'Derivatives-Put Options': 'DER',
    'Derivatives-Call Options': 'DER',
    'Derivatives-Options (Others)': 'DER',
    'Cash & Cash Equivalents and Net Assets': 'CASH',
    Others: 'OTH',
  };
  const CLASS_INFO = {
    EQ: { label: 'Equity shares', short: 'Stock', order: 1 },
    PREF: { label: 'Preference shares', short: 'Pref.', order: 2 },
    RIGHTS: { label: 'Rights entitlements', short: 'Rights', order: 3 },
    WARRANT: { label: 'Warrants', short: 'Warrant', order: 4 },
    REIT: { label: 'REITs & InvITs', short: 'REIT/InvIT', order: 5 },
    MFU: { label: 'Mutual fund units', short: 'MF units', order: 6 },
    DEBT: { label: 'Debt & money market', short: 'Debt', order: 7 },
    DEP: { label: 'Deposits', short: 'Deposit', order: 8 },
    DER: { label: 'Derivatives', short: 'Derivative', order: 9 },
    CASH: { label: 'Cash & net assets', short: 'Cash', order: 10 },
    OTH: { label: "Other (source 'Others')", short: 'Other', order: 11 },
    UNMAPPED: { label: 'Unmapped asset type', short: 'Unmapped', order: 12 },
  };
  const BROAD_OVERLAP = new Set(['EQ', 'PREF', 'RIGHTS', 'WARRANT', 'REIT', 'MFU', 'DEBT']);

  function classify(assetType, asset) {
    if (assetType && ASSET_TYPE_CLASS[assetType]) return { cls: ASSET_TYPE_CLASS[assetType], mapped: true };
    const t = (assetType || asset || '').toLowerCase();
    let cls = 'UNMAPPED';
    if (/deriv|future|option/.test(t)) cls = 'DER';
    else if (/margin|deposit(?!ory)/.test(t) && !/certificate/.test(t)) cls = 'DEP';
    else if (/cash|net asset|repo|treps|cblo/.test(t)) cls = 'CASH';
    else if (/equit|share|adr|gdr/.test(t)) cls = 'EQ';
    else if (/bill|paper|certificate|bond|debenture|debt|gilt|g-sec|securities/.test(t)) cls = 'DEBT';
    return { cls, mapped: false };
  }

  function secKeyFor(cls, assetType, isin, isinValid, company) {
    const nm = 'name:' + U.normName(company);
    switch (cls) {
      case 'DEP':
        return 'DEP|' + (assetType || '') + '|' + nm;
      case 'CASH':
        return 'CASH|' + nm;
      case 'DER':
        return 'DER|' + (assetType || '') + '|' + (isinValid ? isin : nm);
      case 'UNMAPPED':
        return 'UNMAPPED|' + (assetType || '') + '|' + (isinValid ? isin : nm);
      default:
        return cls + '|' + (isinValid ? isin : nm);
    }
  }

  /* ===================================================================== */
  function buildModel(raw) {
    if (!raw || raw.format !== 'hpi-raw-1') throw new Error('Unrecognised data format.');
    const S = raw.strings;
    const str = (i) => (i >= 0 ? S[i] : null);
    const t0 = performance.now();

    /* ---- months: sort ascending; remember source column position ---- */
    const srcMonths = raw.months;
    const keys = srcMonths.slice().sort();
    const months = keys.map((key, i) => ({
      key,
      i,
      label: U.monthLabel(key),
      short: U.monthShort(key),
      long: U.monthLong(key),
      srcPos: srcMonths.indexOf(key),
    }));
    const nM = months.length;
    const mIndex = new Map(months.map((m) => [m.key, m.i]));
    const srcToModel = srcMonths.map((k) => mIndex.get(k));
    const calendarGaps = [];
    for (let i = 1; i < nM; i++) {
      const d = U.monthDiff(months[i - 1].key, months[i].key);
      for (let g = 1; g < d; g++) calendarGaps.push(U.monthAdd(months[i - 1].key, g));
    }

    /* ---- records, portfolios, securities ---- */
    const portfolios = [];
    const pIndex = new Map();
    const securities = [];
    const secIndex = new Map();
    const records = new Array(raw.rows.length);
    const unmappedTypes = new Map();

    for (let r = 0; r < raw.rows.length; r++) {
      const row = raw.rows[r];
      const cell = raw.cells[r];
      const scheme = str(row[1]);
      let pid = pIndex.get(scheme);
      if (pid === undefined) {
        pid = portfolios.length;
        pIndex.set(scheme, pid);
        portfolios.push({ id: pid, name: scheme, recIds: [], pos: new Array(nM).fill(null) });
      }
      const company = str(row[2]);
      const assetType = str(row[5]);
      const asset = str(row[4]);
      const isinRaw = str(row[9]);
      const isin = isinRaw ? isinRaw.trim().toUpperCase() : null;
      const isinValid = U.isinValid(isin);
      const { cls, mapped } = classify(assetType, asset);
      if (!mapped) unmappedTypes.set(assetType || asset || '(blank)', (unmappedTypes.get(assetType || asset || '(blank)') || 0) + 1);
      const key = secKeyFor(cls, assetType, isin, isinValid, company);
      let sid = secIndex.get(key);
      if (sid === undefined) {
        sid = securities.length;
        secIndex.set(key, sid);
        securities.push({
          id: sid,
          key,
          cls,
          isin: isinValid ? isin : null,
          isinBad: !isinValid && isin ? isin : null, // a source ISIN that fails the ISO 6166 check digit
          names: new Map(), // name -> last month index seen
          sectors: new Set(),
          mcaps: new Set(),
          assetTypes: new Set(),
          assets: new Set(),
          recIds: [],
          pids: new Set(),
          first: Infinity,
          last: -Infinity,
          name: company,
        });
      }
      const sec = securities[sid];
      if (!isinValid && isin && !sec.isinBad && !sec.isin) sec.isinBad = isin;

      // decode populated months (runs are in source order) and metric arrays
      const runs = cell[0];
      const srcIdx = [];
      for (let a = 0; a < runs.length; a += 2) for (let j = runs[a]; j < runs[a] + runs[a + 1]; j++) srcIdx.push(j);
      const n = srcIdx.length;
      const mis = new Int16Array(n);
      for (let k = 0; k < n; k++) mis[k] = srcToModel[srcIdx[k]];
      const arr = (x) => {
        const out = new Float64Array(n).fill(NaN);
        if (x && x !== 0) for (let k = 0; k < n; k++) if (x[k] != null) out[k] = x[k];
        return out;
      };
      const rec = {
        id: r,
        excelRow: row[0],
        pid,
        company,
        sector: str(row[3]),
        asset,
        assetType,
        rating: str(row[6]),
        agency: str(row[7]),
        rateBasket: str(row[8]),
        isinRaw,
        isin,
        isinValid,
        issuer: str(row[10]),
        coupon: row[11],
        maturity: row[12],
        mcap: str(row[13]),
        cls,
        clsMapped: mapped,
        secId: sid,
        mis,
        pos: null,
        mv: arr(cell[1]),
        sh: arr(cell[2]),
        hp: arr(cell[3]),
        px: arr(cell[4]),
        ytm: arr(cell[5]),
        hasMetric: { mv: cell[1] !== 0, sh: cell[2] !== 0, hp: cell[3] !== 0, px: cell[4] !== 0, ytm: cell[5] !== 0 },
      };
      const pos = new Int16Array(nM).fill(-1);
      for (let k = 0; k < n; k++) pos[mis[k]] = k;
      rec.pos = pos;
      records[r] = rec;
      portfolios[pid].recIds.push(r);

      sec.recIds.push(r);
      sec.pids.add(pid);
      if (rec.sector) sec.sectors.add(rec.sector);
      if (rec.mcap) sec.mcaps.add(rec.mcap);
      if (assetType) sec.assetTypes.add(assetType);
      if (asset) sec.assets.add(asset);
      let recLast = -1;
      for (let k = 0; k < n; k++) {
        const mi = mis[k];
        if (mi < sec.first) sec.first = mi;
        if (mi > sec.last) sec.last = mi;
        if (mi > recLast) recLast = mi;
      }
      const prev = sec.names.get(company);
      if (prev === undefined || recLast > prev) sec.names.set(company, recLast);
    }

    /* ---- display names: the name used in the most recent month ---- */
    for (const sec of securities) {
      let best = null;
      let bestM = -Infinity;
      for (const [nm, m] of sec.names) if (m > bestM || (m === bestM && nm < best)) { best = nm; bestM = m; }
      sec.name = best || sec.name;
      sec.clsLabel = CLASS_INFO[sec.cls].label;
    }

    /* ---- positions: portfolio × month × security ---- */
    for (const rec of records) {
      const P = portfolios[rec.pid];
      for (let k = 0; k < rec.mis.length; k++) {
        const mi = rec.mis[k];
        let mp = P.pos[mi];
        if (!mp) mp = P.pos[mi] = new Map();
        let ps = mp.get(rec.secId);
        if (!ps) {
          ps = {
            sec: rec.secId,
            pid: rec.pid,
            mi,
            w: 0,
            mv: 0,
            qty: null,
            px: null,
            ytm: null,
            src: [],
            rep: -1,
            repAbs: -1,
            wMissing: false,
            mvMissing: false,
            pxConflict: false,
          };
          mp.set(rec.secId, ps);
        }
        ps.src.push(rec.id);
        const hp = rec.hp[k], mv = rec.mv[k], sh = rec.sh[k], px = rec.px[k], y = rec.ytm[k];
        if (Number.isNaN(hp)) ps.wMissing = true; else ps.w += hp;
        if (Number.isNaN(mv)) ps.mvMissing = true; else ps.mv += mv;
        if (!Number.isNaN(sh)) ps.qty = (ps.qty == null ? 0 : ps.qty) + sh;
        if (!Number.isNaN(px)) {
          if (ps.px == null) ps.px = px;
          else if (ps.px !== px) ps.pxConflict = true;
        }
        if (!Number.isNaN(y)) ps.ytm = ps.ytm == null ? y : ps.ytm;
        const a = Number.isNaN(mv) ? 0 : Math.abs(mv);
        if (a > ps.repAbs) { ps.repAbs = a; ps.rep = rec.id; }
      }
    }
    let nPositions = 0;
    for (const P of portfolios) {
      P.avail = [];
      for (let mi = 0; mi < nM; mi++) {
        const mp = P.pos[mi];
        if (!mp || mp.size === 0) { P.pos[mi] = null; continue; }
        P.avail.push(mi);
        for (const ps of mp.values()) {
          nPositions++;
          if (ps.wMissing) ps.w = NaN;
          if (ps.mvMissing) ps.mv = NaN;
          if (ps.pxConflict) ps.px = null;
          const rep = records[ps.rep];
          ps.sector = rep.sector;
          ps.mcap = rep.mcap;
          ps.asset = rep.asset;
          ps.assetType = rep.assetType;
          ps.rating = rep.rating;
          ps.agency = rep.agency;
          ps.rateBasket = rep.rateBasket;
          ps.coupon = rep.coupon;
          ps.maturity = rep.maturity;
          ps.company = rep.company;
          ps.cls = securities[ps.sec].cls;
          ps.multi = ps.src.length > 1;
        }
      }
      P.availSet = new Set(P.avail);
      P.first = P.avail.length ? P.avail[0] : -1;
      P.last = P.avail.length ? P.avail[P.avail.length - 1] : -1;
      P.missing = [];
      for (let mi = P.first; mi >= 0 && mi <= P.last; mi++) if (!P.availSet.has(mi)) P.missing.push(mi);
    }
    // stable, readable portfolio order for the interface
    const portfolioOrder = portfolios.slice().sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })).map((p) => p.id);

    /* ================= query API (memoised) ================= */
    const cache = new Map();
    const memo = (key, fn) => {
      let v = cache.get(key);
      if (v === undefined) { v = fn(); cache.set(key, v); }
      return v;
    };

    const M = {
      source: raw.source,
      layout: raw.layout,
      extractionIssues: raw.issues || [],
      months,
      nM,
      mIndex,
      calendarGaps,
      records,
      portfolios,
      portfolioOrder,
      securities,
      secIndex,
      CLASS_INFO,
      ASSET_TYPE_CLASS,
      unmappedTypes,
      nPositions,
      buildMs: 0,
    };

    M.sec = (sid) => securities[sid];
    // the ISIN as the source gives it (valid or not) for search and export; and a display label that never hides an invalid one
    M.isinText = (sid) => { const s = securities[sid]; return s ? s.isin || s.isinBad || '' : ''; };
    M.isinShow = (sid, none = 'No ISIN') => { const s = securities[sid]; if (!s) return none; return s.isin || (s.isinBad ? s.isinBad + ' (invalid ISIN)' : none); };
    M.secName = (sid) => (securities[sid] ? securities[sid].name : '—');
    M.pName = (pid) => (portfolios[pid] ? portfolios[pid].name : '—');
    M.isAvail = (pid, mi) => !!(portfolios[pid] && portfolios[pid].availSet.has(mi));
    M.avail = (pid) => (portfolios[pid] ? portfolios[pid].avail : []);
    M.prevAvail = (pid, mi) => {
      const a = M.avail(pid);
      let lo = -1;
      for (const m of a) { if (m < mi) lo = m; else break; }
      return lo;
    };
    M.nextAvail = (pid, mi) => {
      for (const m of M.avail(pid)) if (m > mi) return m;
      return -1;
    };
    M.nearestAvail = (pid, mi) => {
      const a = M.avail(pid);
      if (!a.length) return -1;
      if (M.isAvail(pid, mi)) return mi;
      let best = -1;
      for (const m of a) if (m <= mi) best = m;
      return best >= 0 ? best : a[0];
    };
    M.availIn = (pid, from, to) => M.avail(pid).filter((m) => m >= from && m <= to);
    M.commonAvail = (pa, pb) => M.avail(pa).filter((m) => M.isAvail(pb, m));

    M.pos = (pid, mi, sid) => {
      const mp = portfolios[pid] && portfolios[pid].pos[mi];
      return mp ? mp.get(sid) : undefined;
    };
    /** all positions in a month, sorted by allocation (desc) then name */
    M.positions = (pid, mi) =>
      memo('pos|' + pid + '|' + mi, () => {
        const mp = portfolios[pid] && portfolios[pid].pos[mi];
        if (!mp) return null;
        const arr = Array.from(mp.values());
        arr.sort((a, b) => {
          const aw = Number.isNaN(a.w) ? -Infinity : a.w, bw = Number.isNaN(b.w) ? -Infinity : b.w;
          if (bw !== aw) return bw - aw;
          return securities[a.sec].name.localeCompare(securities[b.sec].name);
        });
        return arr;
      });
    const SCOPES = {
      eq: (ps) => ps.cls === 'EQ',
      all: () => true,
    };
    M.scopeFn = (scope) => SCOPES[scope] || SCOPES.all;
    M.scoped = (pid, mi, scope) =>
      memo('sc|' + pid + '|' + mi + '|' + scope, () => {
        const all = M.positions(pid, mi);
        return all ? all.filter(M.scopeFn(scope)) : null;
      });
    /** rank among equity-share positions (1 = largest allocation) */
    M.ranks = (pid, mi) =>
      memo('rk|' + pid + '|' + mi, () => {
        const eq = M.scoped(pid, mi, 'eq');
        const map = new Map();
        if (eq) eq.forEach((ps, i) => map.set(ps.sec, i + 1));
        return map;
      });
    M.rank = (pid, mi, sid) => {
      if (!M.isAvail(pid, mi)) return null;
      const r = M.ranks(pid, mi).get(sid);
      return r == null ? null : r;
    };

    /** headline figures for one portfolio-month */
    M.summary = (pid, mi) =>
      memo('sum|' + pid + '|' + mi, () => {
        const all = M.positions(pid, mi);
        if (!all) return null;
        const eq = M.scoped(pid, mi, 'eq');
        const s = {
          pid,
          mi,
          aum: U.sum(all, (p) => p.mv),
          totalW: U.sum(all, (p) => p.w),
          nAll: all.length,
          nEq: eq.length,
          eqW: U.sum(eq, (p) => p.w),
          top1: eq[0] || null,
          top2: eq[1] || null,
          top5W: U.sum(eq.slice(0, 5), (p) => p.w),
          top10W: U.sum(eq.slice(0, 10), (p) => p.w),
          top5N: Math.min(5, eq.length),
          top10N: Math.min(10, eq.length),
          cashW: U.sum(all.filter((p) => p.cls === 'CASH'), (p) => p.w),
          nonEqAssetW: U.sum(all.filter((p) => p.asset !== 'Equity'), (p) => p.w),
          hhiEq: U.sum(eq, (p) => (U.isNum(p.w) ? (p.w / 100) * (p.w / 100) : 0)),
        };
        const sec = M.groupBy(pid, mi, 'sector', 'eq');
        s.topSector = sec.length ? sec[0] : null;
        const byAsset = M.groupBy(pid, mi, 'asset', 'all');
        s.byAsset = byAsset;
        return s;
      });

    const DIM = {
      sector: (ps) => ps.sector,
      mcap: (ps) => ps.mcap,
      asset: (ps) => ps.asset,
      assetType: (ps) => ps.assetType,
      cls: (ps) => ps.cls,
      line: (ps) => securities[ps.sec].name,
    };
    const BLANK = '__blank__';
    M.BLANK = BLANK;
    M.dimLabel = (dim, key) => {
      if (key === BLANK) return '(blank in source)';
      if (dim === 'cls') return CLASS_INFO[key] ? CLASS_INFO[key].label : key;
      return key;
    };
    /** group a month's positions by a dimension → [{key,label,w,mv,n,positions}] sorted by w desc */
    M.groupBy = (pid, mi, dim, scope) =>
      memo('gb|' + pid + '|' + mi + '|' + dim + '|' + scope, () => {
        const list = M.scoped(pid, mi, scope);
        if (!list) return [];
        const g = new Map();
        for (const ps of list) {
          const raw = DIM[dim](ps);
          const k = raw == null || raw === '' ? BLANK : raw;
          let e = g.get(k);
          if (!e) { e = { key: k, label: M.dimLabel(dim, k), w: 0, mv: 0, n: 0, positions: [], wMissing: false }; g.set(k, e); }
          if (U.isNum(ps.w)) e.w += ps.w; else e.wMissing = true;
          if (U.isNum(ps.mv)) e.mv += ps.mv;
          e.n++;
          e.positions.push(ps);
        }
        const out = Array.from(g.values());
        out.sort((a, b) => b.w - a.w || a.label.localeCompare(b.label));
        return out;
      });
    M.groupMap = (pid, mi, dim, scope) =>
      memo('gm|' + pid + '|' + mi + '|' + dim + '|' + scope, () => new Map(M.groupBy(pid, mi, dim, scope).map((e) => [e.key, e])));
    /** all category keys seen for a dimension over a set of months, ordered by average weight */
    M.dimKeys = (pid, mis, dim, scope) => {
      const tot = new Map();
      for (const mi of mis) for (const e of M.groupBy(pid, mi, dim, scope)) tot.set(e.key, (tot.get(e.key) || 0) + e.w);
      return Array.from(tot.entries()).sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]))).map((x) => x[0]);
    };
    M.dimValues = (dim, scope) =>
      memo('dv|' + dim + '|' + scope, () => {
        const set = new Set();
        const fn = M.scopeFn(scope);
        for (const P of portfolios) for (const mi of P.avail) for (const ps of P.pos[mi].values()) if (fn(ps)) {
          const v = DIM[dim](ps);
          set.add(v == null || v === '' ? BLANK : v);
        }
        return Array.from(set).sort((a, b) => M.dimLabel(dim, a).localeCompare(M.dimLabel(dim, b)));
      });

    /** full monthly series of one security in one portfolio */
    M.series = (pid, sid) =>
      memo('ser|' + pid + '|' + sid, () => {
        const w = new Float64Array(nM).fill(NaN), qty = new Float64Array(nM).fill(NaN), mv = new Float64Array(nM).fill(NaN), px = new Float64Array(nM).fill(NaN);
        const state = new Uint8Array(nM); // 0 = portfolio has no data, 1 = not held, 2 = held
        let first = -1, last = -1, count = 0;
        for (let mi = 0; mi < nM; mi++) {
          if (!M.isAvail(pid, mi)) { state[mi] = 0; continue; }
          const ps = M.pos(pid, mi, sid);
          if (!ps) { state[mi] = 1; continue; }
          state[mi] = 2;
          w[mi] = ps.w; mv[mi] = ps.mv;
          if (ps.qty != null) qty[mi] = ps.qty;
          if (ps.px != null) px[mi] = ps.px;
          if (first < 0) first = mi;
          last = mi;
          count++;
        }
        return { w, qty, mv, px, state, first, last, count };
      });
    /** which securities a portfolio has ever held (optionally restricted to a class) */
    M.heldSecurities = (pid) =>
      memo('held|' + pid, () => {
        const set = new Set();
        for (const mi of M.avail(pid)) for (const sid of portfolios[pid].pos[mi].keys()) set.add(sid);
        return Array.from(set);
      });
    M.heldBefore = (pid, sid, mi) => {
      const s = M.series(pid, sid);
      return s.first >= 0 && s.first < mi;
    };

    /** holding periods (continuous runs over available months) */
    M.runs = (pid, sid) =>
      memo('runs|' + pid + '|' + sid, () => {
        const s = M.series(pid, sid);
        const runs = [];
        let cur = null;
        for (const mi of M.avail(pid)) {
          if (s.state[mi] === 2) {
            if (!cur) cur = { start: mi, end: mi, n: 0 };
            cur.end = mi;
            cur.n++;
          } else if (cur) { runs.push(cur); cur = null; }
        }
        if (cur) runs.push(cur);
        return runs;
      });

    /* ---------- movement classification ---------- */
    const QTY_TOL = 1e-9; // relative
    M.ALLOC_TOL = 0.0005; // percentage points
    function classifyChange(a, b, basis) {
      // a,b are positions (both present)
      if (basis === 'qty' && a.qty != null && b.qty != null) {
        const d = b.qty - a.qty;
        const scale = Math.max(Math.abs(a.qty), Math.abs(b.qty), 1e-12);
        if (Math.abs(d) / scale < QTY_TOL) return { status: 'UNCHANGED', by: 'qty' };
        return { status: d > 0 ? 'INCREASED' : 'REDUCED', by: 'qty' };
      }
      const dw = b.w - a.w;
      if (!U.isNum(dw)) return { status: 'UNKNOWN', by: 'alloc' };
      if (Math.abs(dw) < M.ALLOC_TOL) return { status: 'UNCHANGED', by: 'alloc' };
      return { status: dw > 0 ? 'INCREASED' : 'REDUCED', by: 'alloc' };
    }
    function valueAt(ps) {
      if (!ps) return null;
      if (ps.px != null) return ps.px;
      if (ps.qty && U.isNum(ps.mv) && ps.qty !== 0) return (ps.mv * 1e7) / ps.qty;
      return null;
    }
    /**
     * Compare two months of one portfolio.  Returns one row per security present
     * in either month.  Status is an OBSERVED change between month-end
     * snapshots — never a confirmed transaction.
     */
    M.compare = (pid, miA, miB, basis = 'qty', scope = 'all') =>
      memo('cmp|' + pid + '|' + miA + '|' + miB + '|' + basis + '|' + scope, () => {
        const fn = M.scopeFn(scope);
        const A = portfolios[pid].pos[miA], B = portfolios[pid].pos[miB];
        if (!A || !B) return null;
        const ids = new Set();
        for (const [sid, ps] of A) if (fn(ps)) ids.add(sid);
        for (const [sid, ps] of B) if (fn(ps)) ids.add(sid);
        const rows = [];
        for (const sid of ids) {
          const a = A.get(sid), b = B.get(sid);
          let status, by = null;
          if (a && !b) status = 'EXITED';
          else if (!a && b) status = M.heldBefore(pid, sid, miA) ? 'RE-ENTERED' : 'NEW';
          else ({ status, by } = classifyChange(a, b, basis));
          const wA = a ? a.w : null, wB = b ? b.w : null;
          const qA = a ? a.qty : null, qB = b ? b.qty : null;
          let dq = null;
          if (a && b && qA != null && qB != null) dq = qB - qA;
          else if (!a && b && qB != null) dq = qB;
          else if (a && !b && qA != null) dq = -qA;
          const pxRef = b ? valueAt(b) : valueAt(a);
          const estValue = dq != null && pxRef != null ? (dq * pxRef) / 1e7 : null;
          rows.push({
            sec: sid,
            name: securities[sid].name,
            cls: securities[sid].cls,
            status,
            by,
            a,
            b,
            wA,
            wB,
            // a security absent from a complete month-end portfolio has no allocation,
            // so for NEW/RE-ENTERED the change equals the new weight and for EXITED
            // it equals minus the old weight (the UI still labels the side "Not held")
            dW: (wB == null ? 0 : wB) - (wA == null ? 0 : wA),
            relW: a && b ? U.relChange(wA, wB) : null,
            qA,
            qB,
            dQ: dq,
            relQ: a && b && qA != null && qB != null ? U.relChange(qA, qB) : null,
            mvA: a ? a.mv : null,
            mvB: b ? b.mv : null,
            estValue,
            sector: (b || a).sector,
            mcap: (b || a).mcap,
            assetType: (b || a).assetType,
          });
        }
        rows.sort((x, y) => Math.abs(y.dW || 0) - Math.abs(x.dW || 0) || x.name.localeCompare(y.name));
        return rows;
      });
    /** status of ONE security between two months (same rules as compare()) */
    M.statusOf = (pid, sid, miA, miB, basis = 'qty') => {
      if (!M.isAvail(pid, miA) || !M.isAvail(pid, miB)) return null;
      const a = M.pos(pid, miA, sid), b = M.pos(pid, miB, sid);
      if (!a && !b) return null;
      if (a && !b) return { status: 'EXITED', by: null };
      if (!a && b) return { status: M.heldBefore(pid, sid, miA) ? 'RE-ENTERED' : 'NEW', by: null };
      return classifyChange(a, b, basis);
    };
    /** month-on-month movement for the month mi vs the previous AVAILABLE month */
    M.movement = (pid, mi, basis, scope) => {
      const prev = M.prevAvail(pid, mi);
      if (prev < 0 || !M.isAvail(pid, mi)) return { prev, rows: null };
      return { prev, rows: M.compare(pid, prev, mi, basis, scope) };
    };
    M.countStatus = (rows) => {
      const c = { NEW: 0, 'RE-ENTERED': 0, INCREASED: 0, REDUCED: 0, UNCHANGED: 0, EXITED: 0, UNKNOWN: 0 };
      if (rows) for (const r of rows) c[r.status] = (c[r.status] || 0) + 1;
      return c;
    };

    /* ---------- fund overlap ----------
       Same calculation as the Fund Performance Dashboard (getFundOverlapKey /
       buildFundOverlapHoldings / calculateFundOverlap):
         key per holding    = "isin:" + ISIN when the source ISIN has the ISIN shape, else
                              "name:" + name (lower-case, spaces . - _ , & / removed);
         weight per key     = Σ (Number(Holding %) || 0) over the fund's positions with that key;
         fund allocation    = Σ weights of the fund's keys in the universe;
         shared weight      = Σ over common keys of min(weight in A, weight in B);
         overlap score      = shared weight ÷ min(allocation A, allocation B) — symmetric, 0–100%;
         overlap from A / B = shared weight ÷ allocation A (or B).
       If either fund has no allocation in the universe, the comparison is empty (all 0). */
    M.overlapUniverse = (u) => (u === 'broad' ? (ps) => BROAD_OVERLAP.has(ps.cls) : (ps) => ps.cls === 'EQ');
    const ovKeyCache = new Map();
    const ovKey = (sid) => {
      let k = ovKeyCache.get(sid);
      if (k === undefined) {
        const s = securities[sid];
        const isin = String(s.isin || s.isinBad || '').toUpperCase().replace(/\s+/g, '');
        if (/^[A-Z]{2}[A-Z0-9]{10}$/.test(isin)) k = 'isin:' + isin;
        else {
          const nm = String(s.name || '').toLowerCase().replace(/[\s.\-_,&/]+/g, '').trim();
          k = nm ? 'name:' + nm : 'sec:' + sid;
        }
        ovKeyCache.set(sid, k);
      }
      return k;
    };
    const ovHoldings = (pos, fn) => {
      const h = new Map();
      let total = 0;
      for (const [sid, ps] of pos) {
        if (!fn(ps)) continue;
        const w = Number(ps.w) || 0;
        const key = ovKey(sid);
        let it = h.get(key);
        if (!it) { it = { w: 0, raw: null, rep: sid, repPs: ps, repAbs: -1, sids: [] }; h.set(key, it); }
        it.w += w;
        if (U.isNum(ps.w)) it.raw = (it.raw || 0) + ps.w;
        it.sids.push(sid);
        const abs = Math.abs(w) + (ps.cls === 'EQ' ? 1e6 : 0); // equity line names the holding when lines are combined
        if (abs > it.repAbs) { it.repAbs = abs; it.rep = sid; it.repPs = ps; }
        total += w;
      }
      return { h, total };
    };
    M.overlapKey = ovKey;
    M.overlap = (pa, pb, mi, universe = 'eq') =>
      memo('ov|' + pa + '|' + pb + '|' + mi + '|' + universe, () => {
        const A = portfolios[pa].pos[mi], B = portfolios[pb].pos[mi];
        if (!A || !B) return null;
        const fn = M.overlapUniverse(universe);
        const HA = ovHoldings(A, fn), HB = ovHoldings(B, fn);
        const sumA = HA.total, sumB = HB.total;
        const nA = HA.h.size, nB = HB.h.size;
        const scorable = sumA !== 0 && sumB !== 0;
        const rows = [];
        let common = 0, shared = 0;
        const keys = new Set([...HA.h.keys(), ...HB.h.keys()]);
        for (const key of keys) {
          const a = HA.h.get(key), b = HB.h.get(key);
          let mn = null;
          if (a && b) {
            common++;
            mn = Math.min(a.w, b.w);
            shared += mn;
          }
          const ref = b || a;
          const wA = a ? a.raw : null, wB = b ? b.raw : null;
          rows.push({
            sec: (a || b).rep,
            secB: b ? b.rep : null,
            key,
            lines: Math.max(a ? a.sids.length : 0, b ? b.sids.length : 0),
            name: securities[(a || b).rep].name,
            wA,
            wB,
            diff: (wA || 0) - (wB || 0),
            min: mn,
            status: a && b ? 'COMMON' : a ? 'ONLY_A' : 'ONLY_B',
            sector: ref.repPs.sector,
            mcap: ref.repPs.mcap,
          });
        }
        if (!scorable) shared = 0;
        rows.sort((x, y) => (y.min || 0) - (x.min || 0) || String(x.name).localeCompare(String(y.name)));
        const base = Math.min(sumA, sumB);
        return {
          rows,
          nA,
          nB,
          common,
          onlyA: nA - common,
          onlyB: nB - common,
          pctA: nA ? (common / nA) * 100 : null,
          pctB: nB ? (common / nB) * 100 : null,
          shared,
          minW: shared,
          base,
          score: scorable && base ? (shared / base) * 100 : 0,
          fromA: scorable ? (shared / sumA) * 100 : 0,
          fromB: scorable ? (shared / sumB) * 100 : 0,
          sumA,
          sumB,
        };
      });

    /* ---------- lineage: source cells behind a position ---------- */
    const blockByKey = {};
    for (const b of raw.layout.blocks) if (b.key) blockByKey[b.key] = b;
    M.cellAddress = (metric, mi, excelRow) => {
      const b = blockByKey[metric];
      if (!b) return null;
      return U.colLetter(b.col0 + months[mi].srcPos) + excelRow;
    };
    M.lineage = (pid, mi, sid) => {
      const ps = M.pos(pid, mi, sid);
      if (!ps) return null;
      return ps.src.map((rid) => {
        const rec = records[rid];
        const k = rec.pos[mi];
        const cell = (metric, arr) => ({ metric, addr: M.cellAddress(metric, mi, rec.excelRow), value: k >= 0 && !Number.isNaN(arr[k]) ? arr[k] : null, present: blockByKey[metric] != null });
        return {
          rec,
          cells: [cell('MV', rec.mv), cell('SH', rec.sh), cell('HP', rec.hp), cell('PX', rec.px), cell('YTM', rec.ytm)],
        };
      });
    };

    /* ---------- search index ---------- */
    M.searchIndex = () =>
      memo('search', () => {
        const items = [];
        for (const pid of portfolioOrder) items.push({ type: 'portfolio', id: pid, label: portfolios[pid].name, text: portfolios[pid].name.toLowerCase() });
        for (const sec of securities) {
          const names = Array.from(sec.names.keys());
          items.push({ type: 'security', id: sec.id, label: sec.name, sub: (sec.isin || sec.isinBad || '') + ' · ' + CLASS_INFO[sec.cls].label, text: (names.join(' | ') + ' ' + (sec.isin || sec.isinBad || '')).toLowerCase() });
        }
        for (const s of M.dimValues('sector', 'all')) if (s !== BLANK) items.push({ type: 'sector', id: s, label: s, text: s.toLowerCase() });
        return items;
      });

    M.clearCache = () => cache.clear();
    M.buildMs = performance.now() - t0;
    return M;
  }

  HPI.buildModel = buildModel;
  HPI.CLASS_INFO = CLASS_INFO;
})();

/* ---- 03_validate.js ---- */
/* =============================================================================
   03_validate.js — validation engine, duplicate analysis and reconciliation
   Runs once after the model is built.  Every check reports a status:
     pass  – nothing unexpected
     warn  – anomalies present in the source; handled and explained
     fail  – the model does not reconcile to the source (must be investigated)
     info  – descriptive inventory
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util;

  function validate(M) {
    const t0 = performance.now();
    const { records, portfolios, securities, months, nM } = M;
    const checks = [];
    const add = (c) => checks.push(c);
    const mLab = (mi) => months[mi].label;
    const pN = (pid) => portfolios[pid].name;

    /* ---------- 1. structure ---------- */
    const blocks = M.layout.blocks;
    add({
      id: 'structure',
      group: 'Source structure',
      title: 'Metric blocks and month headers detected',
      status: blocks.every((b) => b.key) ? 'pass' : 'warn',
      summary: `${blocks.length} metric blocks (${blocks.map((b) => b.title).join(', ')}), each with the same ${nM} month columns from ${months[0].label} to ${months[nM - 1].label}.`,
      table: {
        columns: ['Metric', 'Band title in source', 'First column', 'Last column', 'Months'],
        rows: blocks.map((b) => [b.key || '(ignored)', b.title, U.colLetter(b.col0), U.colLetter(b.col0 + b.ncol - 1), b.ncol]),
      },
    });
    add({
      id: 'calendar',
      group: 'Source structure',
      title: 'Calendar continuity of month headers',
      status: M.calendarGaps.length ? 'warn' : 'pass',
      summary: M.calendarGaps.length
        ? `${M.calendarGaps.length} calendar month(s) have no column in the source: ${M.calendarGaps.map(U.monthLabel).join(', ')}. These months are never offered for selection.`
        : 'Every calendar month between the first and last header month has a column. The dashboard still uses only months that hold data for the selected portfolio.',
    });
    add({
      id: 'extraction',
      group: 'Source structure',
      title: 'Import issues',
      status: M.extractionIssues.length ? 'warn' : 'pass',
      summary: M.extractionIssues.length ? `${M.extractionIssues.length} issue(s) recorded while reading the Google Sheet.` : 'No malformed numbers, orphan values, missing required columns or unrecognised blocks were found while reading the file.',
      table: M.extractionIssues.length ? { columns: ['Type', 'Detail'], rows: M.extractionIssues.map((x) => [x.type, x.detail]) } : null,
    });

    /* ---------- 2. counts ---------- */
    let recMonths = 0;
    const metricCells = { MV: 0, SH: 0, HP: 0, PX: 0, YTM: 0 };
    let hpWithoutMv = 0, mvWithoutHp = 0, otherWithoutMv = 0;
    for (const r of records) {
      const n = r.mis.length;
      recMonths += n;
      for (let k = 0; k < n; k++) {
        const mv = !Number.isNaN(r.mv[k]), hp = !Number.isNaN(r.hp[k]);
        if (mv) metricCells.MV++;
        if (hp) metricCells.HP++;
        if (!Number.isNaN(r.sh[k])) metricCells.SH++;
        if (!Number.isNaN(r.px[k])) metricCells.PX++;
        if (!Number.isNaN(r.ytm[k])) metricCells.YTM++;
        if (hp && !mv) hpWithoutMv++;
        if (mv && !hp) mvWithoutHp++;
        if (!mv && (!Number.isNaN(r.sh[k]) || !Number.isNaN(r.px[k]) || !Number.isNaN(r.ytm[k]))) otherWithoutMv++;
      }
    }
    add({
      id: 'counts',
      group: 'Record counts',
      title: 'Records, portfolios, securities and observations',
      status: 'info',
      summary: `${U.int(records.length)} source rows across ${portfolios.length} portfolios, normalised into ${U.int(securities.length)} canonical securities and ${U.int(M.nPositions)} portfolio-month positions (${U.int(recMonths)} populated row-months).`,
      table: {
        columns: ['Measure', 'Count'],
        rows: [
          ['Source rows (records)', records.length],
          ['Portfolios', portfolios.length],
          ['Months in source header', nM],
          ['Canonical securities', securities.length],
          ['Populated row-months', recMonths],
          ['Portfolio-month positions', M.nPositions],
          ['Market Value cells', metricCells.MV],
          ['Holding (%) cells', metricCells.HP],
          ['Shares cells', metricCells.SH],
          ['Price cells', metricCells.PX],
          ['Instrument YTM cells', metricCells.YTM],
        ],
      },
    });
    add({
      id: 'presence',
      group: 'Record counts',
      title: 'Market Value and Holding (%) are reported together',
      status: hpWithoutMv || mvWithoutHp || otherWithoutMv ? 'warn' : 'pass',
      summary:
        hpWithoutMv || mvWithoutHp || otherWithoutMv
          ? `${hpWithoutMv} cell(s) have Holding (%) without Market Value, ${mvWithoutHp} have Market Value without Holding (%), ${otherWithoutMv} have other metrics without Market Value. Missing values stay missing (never zero).`
          : 'Every populated month has both Market Value and Holding (%); Shares, Price and YTM never appear without Market Value.',
    });

    /* ---------- 3. allocation sums ---------- */
    const sums = [];
    let minSum = Infinity, maxSum = -Infinity;
    for (const P of portfolios) for (const mi of P.avail) {
      const s = M.summary(P.id, mi).totalW;
      sums.push([P.id, mi, s]);
      if (s < minSum) minSum = s;
      if (s > maxSum) maxSum = s;
    }
    const offSums = sums.filter((x) => Math.abs(x[2] - 100) > 0.01);
    add({
      id: 'alloc-sum',
      group: 'Allocations',
      title: 'Holding (%) sums per portfolio-month',
      status: offSums.length ? 'warn' : 'pass',
      summary: `${U.int(sums.length)} portfolio-months checked; totals range ${U.fmt(minSum, 6)}% – ${U.fmt(maxSum, 6)}%. ${offSums.length ? offSums.length + ' differ from 100% by more than 0.01%.' : 'All equal 100% within 0.01% (net current assets, which can be negative, are included).'}`,
      table: offSums.length ? { columns: ['Portfolio', 'Month', 'Sum of Holding (%)'], rows: offSums.map((x) => [pN(x[0]), mLab(x[1]), x[2]]) } : null,
    });

    // implied total (MV / Holding%) consistency within each portfolio-month
    let worstSpread = 0, worstAt = null;
    for (const P of portfolios) for (const mi of P.avail) {
      let lo = Infinity, hi = -Infinity;
      for (const rid of P.recIds) {
        const r = records[rid], k = r.pos[mi];
        if (k < 0) continue;
        const hp = r.hp[k], mv = r.mv[k];
        if (Math.abs(hp) > 0.5 && U.isNum(mv)) {
          const imp = mv / (hp / 100);
          if (imp < lo) lo = imp;
          if (imp > hi) hi = imp;
        }
      }
      if (lo < Infinity && lo > 0) {
        const sp = hi / lo - 1;
        if (sp > worstSpread) { worstSpread = sp; worstAt = [P.id, mi]; }
      }
    }
    add({
      id: 'mv-hp',
      group: 'Allocations',
      title: 'Holding (%) is consistent with Market Value',
      status: worstSpread > 0.001 ? 'warn' : 'pass',
      summary: `Market Value ÷ Holding (%) implies one portfolio total per month. Largest spread across rows in any portfolio-month: ${U.fmt(worstSpread * 100, 6)}%${worstAt ? ' (' + pN(worstAt[0]) + ', ' + mLab(worstAt[1]) + ')' : ''}. The source Holding (%) is used as the allocation everywhere.`,
    });

    /* ---------- 4. MV vs quantity × price (equity shares) ---------- */
    let nChk = 0, w1 = 0, w5 = 0;
    const mvMiss = [];
    for (const r of records) {
      if (r.cls !== 'EQ') continue;
      for (let k = 0; k < r.mis.length; k++) {
        const mv = r.mv[k], sh = r.sh[k], px = r.px[k];
        if (Number.isNaN(mv) || Number.isNaN(sh) || Number.isNaN(px) || Math.abs(mv) <= 0.01) continue;
        nChk++;
        const calc = (sh * px) / 1e7;
        const rel = Math.abs(mv - calc) / Math.abs(mv);
        if (rel <= 0.01) w1++;
        if (rel <= 0.05) w5++;
        else mvMiss.push([pN(r.pid), r.company, mLab(r.mis[k]), mv, sh, px, calc, ((calc - mv) / mv) * 100, r.excelRow]);
      }
    }
    mvMiss.sort((a, b) => Math.abs(b[7]) - Math.abs(a[7]));
    add({
      id: 'mv-qty-px',
      group: 'Allocations',
      title: 'Market Value ≈ Shares × Price ÷ 1 crore (equity shares)',
      status: mvMiss.length ? 'warn' : 'pass',
      summary: `${U.int(nChk)} equity cells with all three values: ${U.fmt((w1 / nChk) * 100, 2)}% agree within 1%, ${U.fmt((w5 / nChk) * 100, 2)}% within 5%. ${mvMiss.length} cells differ by more than 5% (mostly early-period corporate-action history). Market Value and Holding (%) are always taken from the source as reported; Price is only displayed, never used to rebuild values.`,
      table: mvMiss.length ? { columns: ['Portfolio', 'Security', 'Month', 'Market Value (₹ cr)', 'Shares', 'Price (₹)', 'Shares × Price (₹ cr)', 'Difference %', 'Sheet row'], rows: mvMiss } : null,
    });

    /* ---------- 5. negatives & zeros ---------- */
    const negByCls = new Map(), zeroByCls = new Map(), zeroRows = [];
    for (const r of records) for (let k = 0; k < r.mis.length; k++) {
      const mv = r.mv[k];
      if (mv < 0) negByCls.set(r.cls, (negByCls.get(r.cls) || 0) + 1);
      if (mv === 0) { zeroByCls.set(r.cls, (zeroByCls.get(r.cls) || 0) + 1); zeroRows.push([pN(r.pid), r.company, r.assetType, mLab(r.mis[k]), r.sh[k], r.excelRow]); }
    }
    add({
      id: 'negatives',
      group: 'Values',
      title: 'Negative market values',
      status: 'info',
      summary: `Negative values appear where the source reports them: ${Array.from(negByCls.entries()).map(([c, n]) => M.CLASS_INFO[c].label + ' ' + n).join(', ') || 'none'}. Net current assets and short derivative legs are legitimately negative; they are shown as reported.`,
    });
    add({
      id: 'zeros',
      group: 'Values',
      title: 'Recorded zero values (0% is different from "not held")',
      status: zeroRows.length ? 'warn' : 'pass',
      summary: zeroRows.length ? `${zeroRows.length} row-months carry a recorded Market Value of exactly 0 (${Array.from(zeroByCls.entries()).map(([c, n]) => M.CLASS_INFO[c].label + ' ' + n).join(', ')}). They are treated as held at 0%, not as missing.` : 'No recorded zero values.',
      table: zeroRows.length ? { columns: ['Portfolio', 'Security', 'Asset Type', 'Month', 'Shares', 'Sheet row'], rows: zeroRows } : null,
    });

    /* ---------- 6. identifiers ---------- */
    const noIsin = new Map(), badIsin = [];
    for (const r of records) {
      if (!r.isin) noIsin.set(r.assetType || '(blank)', (noIsin.get(r.assetType || '(blank)') || 0) + 1);
      else if (!r.isinValid) badIsin.push([pN(r.pid), r.company, r.isinRaw, r.excelRow]);
    }
    const distinctIsin = new Set(records.filter((r) => r.isinValid).map((r) => r.isin)).size;
    add({
      id: 'isin',
      group: 'Identifiers',
      title: 'ISIN presence and check digits',
      status: badIsin.length ? 'warn' : 'pass',
      summary: `${distinctIsin} distinct ISINs; ${badIsin.length ? badIsin.length + ' fail the ISO 6166 check digit and are matched by name instead.' : 'all pass the ISO 6166 check digit.'} ${U.int(Array.from(noIsin.values()).reduce((a, b) => a + b, 0))} rows have no ISIN and are identified by normalised name within their class.`,
      table: { columns: ['Asset Type', 'Rows without ISIN'], rows: Array.from(noIsin.entries()).sort((a, b) => b[1] - a[1]) },
    });
    // same ISIN used under different names / names under different ISINs
    const conflicts = [];
    for (const s of securities) {
      if (s.sectors.size > 1) conflicts.push([s.name, s.isin || (s.isinBad ? s.isinBad + ' (invalid)' : '—'), 'Sector', Array.from(s.sectors).join(' | ')]);
      if (s.mcaps.size > 1) conflicts.push([s.name, s.isin || (s.isinBad ? s.isinBad + ' (invalid)' : '—'), 'SEBI MCAP Type', Array.from(s.mcaps).join(' | ')]);
      if (s.names.size > 1) conflicts.push([s.name, s.isin || (s.isinBad ? s.isinBad + ' (invalid)' : '—'), 'Company Name', Array.from(s.names.keys()).join(' | ')]);
    }
    add({
      id: 'class-conflicts',
      group: 'Classifications',
      title: 'Conflicting classifications for the same security',
      status: conflicts.length ? 'warn' : 'pass',
      summary: conflicts.length ? `${conflicts.length} attribute conflicts. Each position keeps the value from its own source row, so history is never overwritten.` : 'Every canonical security has one sector, one market-cap label and one name across all portfolios and months.',
      table: conflicts.length ? { columns: ['Security', 'ISIN', 'Attribute', 'Values in source'], rows: conflicts } : null,
    });
    const typeRows = new Map();
    for (const r of records) {
      const k = (r.asset || '(blank)') + '\u0000' + (r.assetType || '(blank)');
      const e = typeRows.get(k) || { asset: r.asset || '(blank)', type: r.assetType || '(blank)', cls: r.cls, mapped: r.clsMapped, n: 0 };
      e.n++;
      typeRows.set(k, e);
    }
    add({
      id: 'class-map',
      group: 'Classifications',
      title: 'Asset Type → analytical class mapping',
      status: M.unmappedTypes.size ? 'warn' : 'pass',
      summary: M.unmappedTypes.size ? `${M.unmappedTypes.size} asset type(s) are not in the mapping table and were classified by keyword: ${Array.from(M.unmappedTypes.keys()).join(', ')}.` : 'Every Asset Type in the source is mapped. Source Asset and Asset Type values are still shown unchanged throughout.',
      table: { columns: ['Asset (source)', 'Asset Type (source)', 'Analytical class', 'Rows', 'Mapped by'], rows: Array.from(typeRows.values()).sort((a, b) => b.n - a.n).map((e) => [e.asset, e.type, M.CLASS_INFO[e.cls].label, e.n, e.mapped ? 'table' : 'keyword']) },
    });
    const blankSector = records.filter((r) => !r.sector).length;
    const blankMcapEq = records.filter((r) => r.cls === 'EQ' && !r.mcap);
    add({
      id: 'blank-class',
      group: 'Classifications',
      title: 'Blank sector and market-cap labels',
      status: blankSector || blankMcapEq.length ? 'warn' : 'pass',
      summary: `${blankSector} rows have no Sector. ${blankMcapEq.length} equity-share rows have no SEBI MCAP Type (typically merged, delisted, unlisted or SME companies); they appear as "(blank in source)" — never re-labelled.`,
      table: blankMcapEq.length ? { columns: ['Portfolio', 'Security', 'Asset Type', 'Sheet row'], rows: blankMcapEq.map((r) => [pN(r.pid), r.company, r.assetType, r.excelRow]) } : null,
    });
    add({
      id: 'mcap-static',
      group: 'Classifications',
      title: 'Market-cap labels are a single value per row',
      status: 'info',
      summary: 'The source carries one SEBI MCAP Type per row (not one per month), so every month of a row uses that label. The source does not contain point-in-time market-cap classifications; historical market-cap composition therefore reflects the labels as supplied.',
    });

    /* ---------- 7. duplicates & identity ---------- */
    const groups = new Map();
    for (const r of records) {
      const k = r.pid + '\u0000' + r.company;
      const g = groups.get(k);
      if (g) g.push(r.id); else groups.set(k, [r.id]);
    }
    const dupGroups = [];
    for (const [, ids] of groups) {
      if (ids.length < 2) continue;
      const recs = ids.map((i) => records[i]);
      const bySec = new Map();
      for (const r of recs) { const l = bySec.get(r.secId) || []; l.push(r); bySec.set(r.secId, l); }
      const treatments = [];
      let overlapCells = 0;
      for (const [sid, rs] of bySec) {
        if (rs.length < 2) continue;
        const seen = new Map();
        for (const r of rs) for (const mi of r.mis) seen.set(mi, (seen.get(mi) || 0) + 1);
        const ov = Array.from(seen.values()).filter((c) => c > 1).length;
        overlapCells += ov;
        treatments.push(ov ? `summed in ${ov} month(s) — ${M.CLASS_INFO[securities[sid].cls].label}` : `stitched: ${rs.length} sequential fragments — ${M.CLASS_INFO[securities[sid].cls].label}`);
      }
      if (bySec.size > 1) treatments.push(`kept separate: ${bySec.size} distinct instruments (${Array.from(new Set(recs.map((r) => r.assetType))).join(', ')})`);
      dupGroups.push({
        pid: recs[0].pid,
        company: recs[0].company,
        n: recs.length,
        rows: recs.map((r) => r.excelRow),
        types: Array.from(new Set(recs.map((r) => r.assetType))),
        treatment: treatments.join('; '),
        stitched: treatments.some((t) => t.startsWith('stitched')),
        summed: overlapCells > 0,
        separate: bySec.size > 1,
      });
    }
    add({
      id: 'duplicates',
      group: 'Duplicates & identity',
      title: 'Repeated Scheme + Company Name rows',
      status: dupGroups.length ? 'warn' : 'pass',
      summary: `${dupGroups.length} scheme/company combinations have more than one source row (${dupGroups.reduce((a, g) => a + g.n, 0)} rows). The export starts a new row whenever a descriptive attribute changes (e.g. a rating downgrade) or when the same issuer is held through a different instrument. Treatment: sequential fragments of one instrument are stitched into one history; different instruments stay separate; simultaneous rows of one instrument are summed. Nothing is discarded.`,
      table: {
        columns: ['Portfolio', 'Company Name', 'Rows', 'Asset Types', 'Excel rows', 'Treatment'],
        rows: dupGroups.map((g) => [pN(g.pid), g.company, g.n, g.types.join(', '), g.rows.join(', '), g.treatment]),
      },
    });
    const multiPositions = [];
    for (const P of portfolios) for (const mi of P.avail) for (const ps of P.pos[mi].values()) if (ps.multi) multiPositions.push([pN(P.id), securities[ps.sec].name, mLab(mi), ps.src.length, ps.src.map((i) => records[i].excelRow).join(', ')]);
    add({
      id: 'multi-positions',
      group: 'Duplicates & identity',
      title: 'Positions built from more than one source row in the same month',
      status: multiPositions.length ? 'warn' : 'pass',
      summary: multiPositions.length ? `${multiPositions.length} portfolio-month positions combine several source rows of the same instrument (values summed; descriptive attributes from the row with the largest market value).` : 'No position combines more than one source row in the same month.',
      table: multiPositions.length ? { columns: ['Portfolio', 'Security', 'Month', 'Rows combined', 'Excel rows'], rows: multiPositions } : null,
    });

    // identity continuation: a no-ISIN equity line that exactly fills a gap of another equity line
    const continuations = [];
    for (const P of portfolios) {
      const held = M.heldSecurities(P.id).filter((sid) => securities[sid].cls === 'EQ');
      const noIsin = held.filter((sid) => !securities[sid].isin);
      for (const b of noIsin) {
        for (const run of M.runs(P.id, b)) {
          const before = M.prevAvail(P.id, run.start), after = M.nextAvail(P.id, run.end);
          if (before < 0 || after < 0) continue;
          for (const a of held) {
            if (a === b) continue;
            const sa = M.series(P.id, a);
            if (sa.state[before] !== 2 || sa.state[after] !== 2) continue;
            let absent = true;
            for (const mi of M.availIn(P.id, run.start, run.end)) if (sa.state[mi] === 2) { absent = false; break; }
            if (absent) continuations.push({ pid: P.id, a, b, from: run.start, to: run.end });
          }
        }
      }
    }
    add({
      id: 'continuations',
      group: 'Duplicates & identity',
      title: 'Possible identity continuations (not merged)',
      status: continuations.length ? 'warn' : 'pass',
      summary: continuations.length
        ? `${continuations.length} case(s) where an equity line without an ISIN exactly fills a gap in another equity line of the same portfolio — typically a renamed company. They are NOT merged automatically (the source treats them as different rows); movement labels around the gap should be read with this in mind.`
        : 'No equity line without an ISIN exactly fills a gap in another line.',
      table: continuations.length ? { columns: ['Portfolio', 'Line with gap', 'Line filling the gap', 'Gap months'], rows: continuations.map((c) => [pN(c.pid), securities[c.a].name + (securities[c.a].isin ? ' (' + securities[c.a].isin + ')' : ''), securities[c.b].name + ' (no ISIN)', mLab(c.from) + ' – ' + mLab(c.to)]) } : null,
    });

    // corporate-action signatures (quantity jumps with inverse price move)
    const caSig = [], caRaw = [];
    for (const P of portfolios) {
      for (const sid of M.heldSecurities(P.id)) {
        if (securities[sid].cls !== 'EQ') continue;
        let prev = null;
        for (const mi of P.avail) {
          const ps = P.pos[mi].get(sid);
          if (ps && prev && ps.qty && prev.qty && ps.px && prev.px) {
            const rq = ps.qty / prev.qty, rp = ps.px / prev.px;
            if ((rq >= 1.9 && rp <= 0.6) || (rq <= 0.55 && rp >= 1.8)) { caSig.push([pN(P.id), securities[sid].name, mLab(prev.mi) + ' → ' + mLab(mi), rq, rp]); caRaw.push({ pid: P.id, sid, from: prev.mi, to: mi, rq, rp }); }
          }
          prev = ps || null;
        }
      }
    }
    add({
      id: 'corporate-actions',
      group: 'Duplicates & identity',
      title: 'Quantity jumps paired with an inverse price move',
      status: caSig.length ? 'warn' : 'pass',
      summary: caSig.length
        ? `${caSig.length} month-on-month change(s) look like an unadjusted corporate action (e.g. a demerger): quantity ×${caSig.map((x) => U.fmt(x[3], 2)).join('/')} with price ×${caSig.map((x) => U.fmt(x[4], 3)).join('/')}. Shares in the source are otherwise already adjusted for splits and bonuses, so quantity-based movement is reliable elsewhere.`
        : 'No split/bonus-like quantity jumps: shares are consistently adjusted in the source.',
      table: caSig.length ? { columns: ['Portfolio', 'Security', 'Months', 'Quantity ratio', 'Price ratio'], rows: caSig } : null,
    });

    // price consistency across portfolios
    const pxMap = new Map();
    let pxConflicts = 0, pxShared = 0;
    for (const P of portfolios) for (const mi of P.avail) for (const ps of P.pos[mi].values()) {
      if (ps.px == null || ps.cls !== 'EQ') continue;
      const k = ps.sec * 1000 + mi;
      const v = pxMap.get(k);
      if (v === undefined) pxMap.set(k, ps.px);
      else { pxShared++; if (v !== ps.px) pxConflicts++; }
    }
    add({
      id: 'price-consistency',
      group: 'Values',
      title: 'Same security, same month → same price in every portfolio',
      status: pxConflicts ? 'warn' : 'pass',
      summary: `${U.int(pxShared)} repeated security-months compared; ${pxConflicts ? pxConflicts + ' carry different prices.' : 'prices are identical across portfolios (one vendor price per security per month).'}`,
    });

    // maturity
    const matured = [];
    for (const P of portfolios) for (const mi of P.avail) for (const ps of P.pos[mi].values()) {
      if (!ps.maturity) continue;
      const [y, m] = months[mi].key.split('-').map(Number);
      const monthEnd = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
      if (monthEnd > ps.maturity.slice(0, 10)) matured.push([pN(P.id), securities[ps.sec].name, mLab(mi), U.dateLabel(ps.maturity)]);
    }
    add({
      id: 'maturity',
      group: 'Values',
      title: 'Instruments reported after their maturity date',
      status: matured.length ? 'warn' : 'pass',
      summary: matured.length ? `${matured.length} position(s) are reported in a month that ends after the instrument's maturity date.` : 'No instrument is reported after its maturity date.',
      table: matured.length ? { columns: ['Portfolio', 'Instrument', 'Month', 'Maturity'], rows: matured } : null,
    });

    /* ---------- 8. availability ---------- */
    const availRows = M.portfolioOrder.map((pid) => {
      const P = portfolios[pid];
      return [P.name, P.first >= 0 ? mLab(P.first) : '—', P.last >= 0 ? mLab(P.last) : '—', P.avail.length, P.missing.length ? P.missing.map(mLab).join(', ') : 'None'];
    });
    const anyMissing = portfolios.some((P) => P.missing.length);
    add({
      id: 'availability',
      group: 'Availability',
      title: 'Months with data per portfolio',
      status: anyMissing ? 'warn' : 'pass',
      summary: anyMissing ? 'Some portfolios have months without data inside their history. Those months are never offered; comparisons use the previous available month and say so.' : 'Each portfolio has data for every month between its first and last month. Histories start at different months, so every selector is limited to the selected portfolio’s own months.',
      table: { columns: ['Portfolio', 'First month', 'Latest month', 'Months with data', 'Missing months'], rows: availRows },
    });

    /* ---------- 9. reconciliation: source → model ---------- */
    let maxDiff = 0, srcCells = 0, modelSrcRefs = 0, worst = null;
    for (const P of portfolios) for (const mi of P.avail) {
      let s = 0;
      for (const rid of P.recIds) {
        const r = records[rid], k = r.pos[mi];
        if (k >= 0) { srcCells++; if (!Number.isNaN(r.hp[k])) s += r.hp[k]; }
      }
      let m = 0;
      for (const ps of P.pos[mi].values()) { modelSrcRefs += ps.src.length; if (U.isNum(ps.w)) m += ps.w; }
      const d = Math.abs(s - m);
      if (d > maxDiff) { maxDiff = d; worst = [P.id, mi]; }
    }
    const recOK = maxDiff < 1e-9 && srcCells === modelSrcRefs && srcCells === recMonths;
    add({
      id: 'reconciliation',
      group: 'Reconciliation',
      title: 'Source rows → model positions',
      status: recOK ? 'pass' : 'fail',
      summary: `Every populated source row-month (${U.int(srcCells)}) is assigned to exactly one position (${U.int(modelSrcRefs)} references). Largest difference between the source Holding (%) total and the model total in any portfolio-month: ${maxDiff.toExponential(2)}%${worst && maxDiff > 1e-9 ? ' (' + pN(worst[0]) + ', ' + mLab(worst[1]) + ')' : ''}.`,
    });

    const counts = { pass: 0, warn: 0, fail: 0, info: 0 };
    for (const c of checks) counts[c.status]++;
    return { checks, counts, dupGroups, continuations, caSignatures: caSig, caRaw, ms: performance.now() - t0 };
  }

  HPI.validate = validate;
})();

/* ---- 04_charts.js ---- */
/* =============================================================================
   04_charts.js — Chart.js wrappers
   Rules applied everywhere:
     • every available month is plotted (no thinning; only axis labels skip);
     • "not held" / "no data" are gaps (null), never zeros, in line charts;
     • tooltips show exact values with the correct unit (%, ₹ cr, count, rank).
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util;
  const C = (HPI.charts = {});

  C.palette = ['#2456d6', '#e8884c', '#15803d', '#8e44ad', '#0f7f86', '#c0392b', '#b7791f', '#38a8e6', '#6b7c93', '#d35400', '#1abc9c', '#c2185b', '#34495e', '#7cb342', '#5e35b1', '#00838f'];
  C.color = (i) => C.palette[i % C.palette.length];
  C.OTHER = '#b8c2cc';
  C.A = '#2456d6';
  C.B = '#e8884c';

  const registry = new Map();
  let ready = false;
  C.available = () => typeof window.Chart === 'function';

  C.setup = () => {
    if (!C.available() || ready) return;
    const Chart = window.Chart;
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.font.size = 10; // Fund Performance Dashboard scale
    Chart.defaults.color = '#5d6b74';
    Chart.defaults.borderColor = '#e8ecf2';
    Chart.defaults.animation = false;
    Chart.defaults.responsive = true;
    Chart.defaults.maintainAspectRatio = false;
    Chart.defaults.plugins.legend.position = 'bottom';
    Chart.defaults.plugins.legend.labels.boxWidth = 10;
    Chart.defaults.plugins.legend.labels.boxHeight = 10;
    Chart.defaults.plugins.legend.labels.padding = 12;
    Chart.defaults.plugins.tooltip.backgroundColor = '#16242c';
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.plugins.tooltip.cornerRadius = 6;
    Chart.defaults.plugins.tooltip.titleFont = { weight: 'bold' };
    Chart.defaults.plugins.tooltip.boxPadding = 4;
    Chart.defaults.elements.line.borderWidth = 2;
    Chart.defaults.elements.point.radius = 0;
    Chart.defaults.elements.point.hitRadius = 8;
    Chart.defaults.elements.point.hoverRadius = 4;
    ready = true;
  };

  C.destroyAll = () => {
    for (const ch of registry.values()) {
      try { ch.destroy(); } catch (e) { /* ignore */ }
    }
    registry.clear();
  };

  function mount(canvas, config) {
    if (!canvas) return null;
    const box = canvas.parentElement;
    if (!C.available()) {
      if (box) box.innerHTML = '<div class="empty"><strong>Charts unavailable</strong>The chart library did not load. All values are in the table below.</div>';
      return null;
    }
    C.setup();
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) return null; // non-rendering environments
    const prev = registry.get(canvas.id);
    if (prev) prev.destroy();

    registry.set(canvas.id || U.uid('c'), ch);

  C.mount = mount;
  C.get = (id) => registry.get(id);

  const fmtFor = (unit) =>
    unit === 'chg' ? (v) => U.chg(v) : unit === 'pp' ? U.pp : unit === 'cr' ? U.cr : unit === 'count' ? U.int : unit === 'rank' ? (v) => (U.isNum(v) ? '#' + v : '—') : unit === 'qty' ? U.qty : unit === 'price' ? U.price : (v) => U.pct(v, 4);
  const tickFor = (unit) =>
    unit === 'chg' ? (v) => (v > 0 ? '+' : '') + U.fmt(v, Math.abs(v) < 10 && v !== 0 ? 1 : 0) + '%' : unit === 'pp' ? (v) => U.fmt(v, Math.abs(v) < 1 && v !== 0 ? 2 : 1) + '%' : unit === 'cr' ? (v) => '₹' + U.fmt(v, Math.abs(v) >= 100 ? 0 : 1) : unit === 'count' || unit === 'rank' ? (v) => (Number.isInteger(v) ? U.int(v) : '') : unit === 'qty' ? (v) => U.qty(v) : unit === 'price' ? (v) => '₹' + U.fmt(v, 0) : (v) => U.fmt(v, Math.abs(v) < 1 && v !== 0 ? 2 : 1) + '%';

  function baseTooltip(opts) {
    return {
      mode: opts.mode || 'index',
      intersect: false,
      filter: (item) => item.raw != null && !(typeof item.parsed.y === 'number' && Number.isNaN(item.parsed.y)) && !(item.dataset._hideZero && item.raw === 0),
      itemSort: opts.sortTooltip ? (a, b) => (b.raw || 0) - (a.raw || 0) : undefined,
      callbacks: {
        title: (items) => (items.length ? (opts.titles ? opts.titles[items[0].dataIndex] : items[0].label) : ''),
        label: (item) => {
          const ds = item.dataset;
          const f = ds._fmt || fmtFor(ds._unit || opts.unit);
          const v = opts.horizontal ? item.parsed.x : item.parsed.y;
          return ' ' + ds.label + ': ' + f(Array.isArray(item.raw) ? item.raw[1] - item.raw[0] : v) + (ds._note ? ' ' + ds._note(item.dataIndex) : '');
        },
        footer: opts.footer || undefined,
      },
    };
  }

  /**
   * Line chart.  datasets: [{label, data, color, dash, axis:'y'|'y2', unit, fill, width}]
   * opts: {labels, titles, unit, unit2, reverse2, yMin, yMax, markerIndex}
   */
  C.line = (canvas, opts) => {
    const datasets = opts.datasets.map((d, i) => ({
      label: d.label,
      data: d.data,
      borderColor: d.color || C.color(i),
      backgroundColor: d.fill ? (d.fillColor || (d.color || C.color(i)) + '22') : d.color || C.color(i),
      borderDash: d.dash || [],
      borderWidth: d.width || 2,
      fill: d.fill ? 'origin' : false,
      spanGaps: false,
      yAxisID: d.axis || 'y',
      stepped: d.stepped || false,
      pointRadius: d.points ? 2.5 : opts.labels.length <= 36 ? 2 : 0,
      pointBackgroundColor: d.color || C.color(i),
      _unit: d.unit || (d.axis === 'y2' ? opts.unit2 : opts.unit),
      _reverse: !!d.reverse,
      _fmt: d.fmt,
      _note: d.note,
      order: d.order || i,
    }));
    const scales = {
      x: { grid: { display: false }, ticks: { autoSkip: true, autoSkipPadding: 14, maxRotation: 0 } },
      y: { ticks: { callback: tickFor(opts.unit) }, suggestedMin: opts.yMin, suggestedMax: opts.yMax, beginAtZero: opts.zero !== false },
    };
    // an axis with nothing plotted on it is hidden; the first visible axis draws the gridlines
    const hasBase = datasets.some((d) => d.yAxisID === 'y');
    if (!hasBase && datasets.length) scales.y.display = false;
    const axisIds = Array.from(new Set(datasets.map((d) => d.yAxisID).filter((id) => id !== 'y')));
    axisIds.forEach((axisId, axisIndex) => {
      const first = datasets.find((d) => d.yAxisID === axisId);
      const unit = first && first._unit ? first._unit : opts.unit2;
      const reverse = !!(first && first._reverse);
      const k = hasBase ? axisIndex + 1 : axisIndex;
      scales[axisId] = {
        position: k % 2 ? 'right' : 'left',
        grid: { drawOnChartArea: !hasBase && axisIndex === 0 },
        reverse,
        ticks: { callback: tickFor(unit) },
        beginAtZero: !reverse,
      };
      if (unit === 'rank') {
        const vals = datasets.filter((d) => d.yAxisID === axisId).flatMap((d) => d.data).filter((v) => U.isNum(v));
        scales[axisId].min = 1;

  };
})();

    const input = document.getElementById('gsearch');
    q = q.trim().toLowerCase();
    if (q.length < 2) { box.hidden = true; input.setAttribute('aria-expanded', 'false'); srItems = []; return; }
    const idx = M.searchIndex();
    const score = (it) => (it.label.toLowerCase().startsWith(q) ? 0 : it.text.includes(' ' + q) ? 1 : 2);
    const groups = { portfolio: [], security: [], sector: [] };
    for (const it of idx) if (it.text.includes(q)) groups[it.type].push(it);
    const out = [];
    const labels = { portfolio: 'Portfolios', security: 'Securities', sector: 'Sectors' };
    let html = '';
    for (const t of ['portfolio', 'security', 'sector']) {
      const list = groups[t].sort((a, b) => score(a) - score(b) || a.label.localeCompare(b.label)).slice(0, t === 'security' ? 8 : 5);
      if (!list.length) continue;
      html += `<div class="sr-group" role="presentation">${labels[t]}</div>`;
      for (const it of list) {
        let sub = '';
        if (t === 'security') { const n = M.sec(it.id).pids.size; sub = `${it.sub} · held by ${n} ${U.plural(n, 'portfolio')}`; }
        if (t === 'portfolio') { const P = M.portfolios[it.id]; sub = `${M.months[P.first].label} – ${M.months[P.last].label}`; }
        if (t === 'sector') sub = 'Sector';
        html += `<button type="button" class="sr-item" role="option" id="sr-${out.length}" data-sr="${out.length}" aria-selected="false"><span>${esc(it.label)}</span><small>${esc(sub)}</small></button>`;
        out.push(it);
      }
    }
    if (!out.length) html = `<div class="sr-group">No matches for “${esc(q)}”</div>`;
    srItems = out;
    srActive = out.length ? 0 : -1;
    box.innerHTML = html;
    box.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    syncSearch();
  }
  function syncSearch() {
    document.querySelectorAll('#gsearch-list [data-sr]').forEach((b, i) => b.setAttribute('aria-selected', String(i === srActive)));
    const input = document.getElementById('gsearch');
    input.setAttribute('aria-activedescendant', srActive >= 0 ? 'sr-' + srActive : '');
  }
  function closeSearch() {
    const box = document.getElementById('gsearch-list');
    box.hidden = true;
    document.getElementById('gsearch').setAttribute('aria-expanded', 'false');
  }
  function pickSearch(i) {
    const it = srItems[i];
    const M = HPI.model;
    if (!it) return;
    closeSearch();
    document.getElementById('gsearch').value = '';
    if (it.type === 'portfolio') {
      const portfolioPages = ['overlap', 'audit'];
      HPI.setState({ pid: it.id, page: portfolioPages.includes(S.page) || S.page === 'overview' ? 'portfolio' : S.page });
    } else if (it.type === 'security') {
      const sid = it.id;
      if (M.heldSecurities(S.pid).includes(sid)) HPI.setState({ sec: sid, page: 'stock' });
      else {
        const best = bestPortfolioFor((pid, mi) => { const ps = M.pos(pid, mi, sid); return ps ? ps.w : null; }, Array.from(M.sec(sid).pids));
        UI.toast(`${M.pName(S.pid)} never held ${M.secName(sid)}; switched to ${M.pName(best)}.`);
        HPI.setState({ pid: best, sec: sid, page: 'stock' }, { silent: true });
      }
    } else if (it.type === 'sector') {
      const has = (pid) => M.avail(pid).some((mi) => M.groupMap(pid, mi, 'sector', S.sectorScope).has(it.id));
      let pid = S.pid;
      if (!has(pid)) {
        pid = bestPortfolioFor((p, mi) => { const g = M.groupMap(p, mi, 'sector', S.sectorScope).get(it.id); return g ? g.w : null; }, M.portfolioOrder.filter(has));
        if (pid != null) UI.toast(`${M.pName(S.pid)} has no holdings in ${it.id}; switched to ${M.pName(pid)}.`);
      }
      if (pid != null) HPI.setState({ pid, sector: it.id, page: 'sector', tabs: Object.assign({}, S.tabs, { sector: 'detail' }) }, { silent: true });
    }
  }
  /** the portfolio with the largest value of f at its latest month (ties: alphabetical) */
  function bestPortfolioFor(f, pids) {
    const M = HPI.model;
    let best = null, bw = -Infinity;
    for (const pid of M.portfolioOrder) {
      if (!pids.includes(pid)) continue;
      let v = null;
      const a = M.avail(pid);
      for (let k = a.length - 1; k >= 0 && v == null; k--) v = f(pid, a[k]);
      const w = v == null ? -1 : v;
      if (w > bw) { bw = w; best = pid; }
    }
    return best;
  }

    lastPage = S.page;
  };
  HPI.errors = [];
})();

(function () {

  const HPI = window.HPI;

  const UI = HPI.ui;
  const K = (HPI.kit = {});

  K.months = (M, S) => M.availIn(S.pid, S.from, S.to);
  K.labels = (M, mis) => mis.map((mi) => M.months[mi].short);
  K.titles = (M, mis) => mis.map((mi) => M.months[mi].label);
  K.marker = (mis, mi) => { const i = mis.indexOf(mi); return i >= 0 ? i : null; };
  K.pShort = (name) => name.replace(/\s*Fund\b/i, '').replace(/-Reg\(G\)|\(G\)/g, '').replace(/Motilal Oswal/i, 'MO').trim();
  K.exp = (M, pid, ...parts) => U.fileSafe([K.pShort(M.pName(pid)), ...parts].join('_'));
  K.key = (M, mi) => M.months[mi].key;

  K.scopeSeg = (name, value) => UI.seg(name, 'Scope', [{ value: 'eq', label: 'Stocks only', title: 'Equity shares: domestic, overseas, ADRs & GDRs' }, { value: 'all', label: 'All positions', title: 'Every line, including cash, debt and derivatives' }], value);
  K.basisSeg = (value) => UI.seg('rebase', 'Weights', [{ value: 'fund', label: '% of fund', title: 'Source Holding (%) — share of the whole portfolio' }, { value: 'scope', label: 'Re-based to 100%', title: 'Share of the selected scope only' }], value);
  K.moveSeg = (value) => UI.seg('movBasis', 'Movement basis', [{ value: 'qty', label: 'Quantity', title: 'Change in reported quantity (shares/units)' }, { value: 'alloc', label: 'Allocation', title: 'Change in Holding (%)' }], value);
  K.scopeLabel = (scope) => (scope === 'eq' ? 'stocks only' : 'all positions');

  /**
   * Composition series by dimension over months.
   * returns {keys, series: Map key -> number[] (0 = no holdings), counts: Map key -> number[], totals: number[]}
   */
  K.compose = (M, pid, mis, dim, scope, rebase) => {
    const keys = M.dimKeys(pid, mis, dim, scope);
    const series = new Map(keys.map((k) => [k, []]));
    const counts = new Map(keys.map((k) => [k, []]));
    const totals = [];
    for (const mi of mis) {
      const gm = M.groupMap(pid, mi, dim, scope);
      let tot = 0;
      for (const e of gm.values()) tot += e.w;
      totals.push(tot);
      for (const k of keys) {
        const e = gm.get(k);
        const w = e ? e.w : 0;
        series.get(k).push(rebase === 'scope' && tot ? (w / tot) * 100 : w);
        counts.get(k).push(e ? e.n : 0);
      }
    }
    return { keys, series, counts, totals };
  };
  /** keep the n largest keys (by average) and fold the rest into one "other" dataset */
  K.topDatasets = (M, comp, n, dim, otherLabel) => {
    const out = [];
    const top = comp.keys.slice(0, n);
    top.forEach((k, i) => out.push({ key: k, label: M.dimLabel(dim, k), data: comp.series.get(k), color: HPI.charts.color(i) }));
    const rest = comp.keys.slice(n);
    if (rest.length) {
      const data = comp.series.get(rest[0]).map((_, j) => rest.reduce((s, k) => s + comp.series.get(k)[j], 0));
      out.push({ key: '__other__', label: `${otherLabel} (${rest.length})`, data, color: HPI.charts.OTHER });
    }
    return out;
  };
  K.weightOf = (M, pid, mi, dim, scope, key, rebase) => {
    const gm = M.groupMap(pid, mi, dim, scope);
    const e = gm.get(key);
    if (!e) return null;
    if (rebase !== 'scope') return e.w;
    let tot = 0;
    for (const x of gm.values()) tot += x.w;
    return tot ? (e.w / tot) * 100 : null;
  };

  /** items for the security picker: held now (by weight), held earlier, other instruments */
  K.securityItems = (M, pid, mi) => {
    const held = M.heldSecurities(pid);
    const now = [], earlier = [], other = [];
    for (const sid of held) {
      const s = M.sec(sid);
      const ps = M.pos(pid, mi, sid);
      const ser = M.series(pid, sid);
      const item = { id: sid, label: s.name, search: (s.isin || s.isinBad || '') + ' ' + Array.from(s.names.keys()).join(' '), sub: ps ? U.pct(ps.w) : 'last held ' + M.months[ser.last].label, w: ps ? ps.w : -1, last: ser.last };
      if (s.cls !== 'EQ') { item.group = 'Other instruments'; item.sub = HPI.CLASS_INFO[s.cls].short + ' · ' + item.sub; other.push(item); }
      else if (ps) { item.group = `Stocks held in ${M.months[mi].label}`; now.push(item); }
      else { item.group = 'Stocks held earlier'; earlier.push(item); }
    }
    now.sort((a, b) => b.w - a.w || a.label.localeCompare(b.label));
    earlier.sort((a, b) => b.last - a.last || a.label.localeCompare(b.label));
    other.sort((a, b) => b.w - a.w || a.label.localeCompare(b.label));
    return [...now, ...earlier, ...other];
  };
  K.defaultStock = (M, pid, mi) => {
    const eq = M.scoped(pid, mi, 'eq');
    if (eq && eq.length) return eq[0].sec;
    const held = M.heldSecurities(pid).filter((sid) => M.sec(sid).cls === 'EQ');
    return held.length ? held[0] : M.heldSecurities(pid)[0];
  };
  K.statusOrder = { NEW: 0, 'RE-ENTERED': 1, INCREASED: 2, REDUCED: 3, EXITED: 4, UNCHANGED: 5, UNKNOWN: 6 };

  /** standard security + allocation columns */
  K.secCol = (M, opts = {}) => ({
    key: 'name',
    label: opts.label || 'Security',
    value: (r) => M.secName(r.sec),
    html: (r) => UI.secCell(M, r.sec, opts.extra ? opts.extra(r) : null),
    csv: (r) => M.secName(r.sec),
    sticky: opts.sticky,
  });
  K.isinCol = (M) => ({ key: 'isin', label: 'ISIN', value: (r) => M.isinText(r.sec), html: (r) => U.esc(M.isinShow(r.sec, '—')), hidden: true });
  K.pctCol = (key, label, get, opts = {}) => ({ key, label, num: true, value: get, html: (r) => (opts.html ? opts.html(r) : UI.pctCell(get(r))), csv: (r) => get(r), title: opts.title });
  K.ppCol = (key, label, get) => ({ key, label, num: true, value: get, html: (r) => UI.ppCell(get(r)), csv: (r) => get(r), title: 'Allocation change: the later allocation minus the earlier one' });
})();
