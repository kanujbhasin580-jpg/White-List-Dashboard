/* =============================================================================
   18_compare.js — Period comparison: Month A vs Month B
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, K = HPI.kit, C = HPI.charts, SH = HPI.shell;
  const esc = U.esc;
  const ST = ['NEW', 'RE-ENTERED', 'INCREASED', 'REDUCED', 'EXITED', 'UNCHANGED'];

  HPI.pages.compare = {
    nav: 'Period comparison',
    title: 'Period comparison',
    icon: 'compare',
    purpose: 'Everything that differs between two months of the same portfolio: holdings, sectors, market cap, asset mix and cash — before and after, side by side.',
    render(root, S, M) {
      const pid = S.pid;
      const a0 = S.cmpA, b0 = S.cmpB;
      const A = Math.min(a0, b0), B = Math.max(a0, b0);
      const swapped = a0 > b0;
      const av = M.avail(pid);
      const scope = S.cmpScope === 'all' ? 'all' : 'eq';
      const tab = S.tabs.compare;
      const la = M.months[A].label, lb = M.months[B].label;
      root.innerHTML = `${SH.header('compare', [SH.chip('Month A', esc(la), true), SH.chip('Month B', esc(lb), true)])}
        <div class="toolbar">
          <span class="ctl"><label class="ctl-label" for="cmp-a">Month A (before)</label><select id="cmp-a">${UI.monthOptions(av, a0)}</select></span>
          <button type="button" class="icon-btn" id="cmp-swap" aria-label="Swap month A and month B" title="Swap">${UI.icon('swap')}</button>
          <span class="ctl"><label class="ctl-label" for="cmp-b">Month B (after)</label><select id="cmp-b">${UI.monthOptions(av, b0)}</select></span>
          <button type="button" class="btn sm" id="cmp-range" title="Use the first and last month of the global range">Use range ${esc(M.months[S.from].short)} → ${esc(M.months[S.to].short)}</button>
          <button type="button" class="btn sm" id="cmp-prev" title="Compare the as-of month with the previous available month">${esc(M.months[S.mi].short)} vs previous month</button>
          ${K.moveSeg(S.movBasis)}
        </div>
        ${swapped ? UI.notice('info', `Month A is later than month B, so the comparison runs forward in time: ${esc(la)} → ${esc(lb)}.`) : ''}
        ${av.length < 2 ? UI.notice('info', `${esc(M.pName(pid))} has data for only one month (${esc(M.months[av[0]].label)}), so there is no second month to compare yet.`) : A === B ? UI.notice('warn', 'Month A and month B are the same month, so nothing can differ. Choose two different months.') : ''}
        <div id="cmp-body"></div>`;
      root.querySelector('#cmp-a').addEventListener('change', (e) => HPI.setState({ cmpA: +e.target.value }));
      // Month B is the as-of month of this page: choosing it also moves the top-bar as-of month
      root.querySelector('#cmp-b').addEventListener('change', (e) => HPI.setState({ cmpB: +e.target.value, mi: +e.target.value }));
      root.querySelector('#cmp-swap').addEventListener('click', () => HPI.setState({ cmpA: b0, cmpB: a0 }));
      root.querySelector('#cmp-range').addEventListener('click', () => HPI.setState({ cmpA: S.from, cmpB: S.to }));
      root.querySelector('#cmp-prev').addEventListener('click', () => { const p = M.prevAvail(pid, S.mi); if (p >= 0) HPI.setState({ cmpA: p, cmpB: S.mi }); else UI.toast('The as-of month is the first month of data.'); });
      if (A === B) return;
      const body = root.querySelector('#cmp-body');

      const sa = M.summary(pid, A), sb = M.summary(pid, B);
      const eqRows = M.compare(pid, A, B, 'alloc', 'eq');
      let adds = 0, inc = 0, red = 0, exits = 0, nAdd = 0, nInc = 0, nRed = 0, nEx = 0;
      for (const r of eqRows) {
        if (!r.a && r.b) { adds += r.wB; nAdd++; }
        else if (r.a && !r.b) { exits -= r.wA; nEx++; }
        else if (r.dW > 0) { inc += r.dW; nInc++; }
        else if (r.dW < 0) { red += r.dW; nRed++; }
      }
      const diffRow = (label, va, vb, d) => `<tr><th scope="row">${esc(label)}</th><td class="num">${va}</td><td class="num">${vb}</td><td class="num">${d}</td></tr>`;
      const dInt = (x, y) => (y - x > 0 ? '+' : y - x < 0 ? '−' : '') + Math.abs(y - x);
      const up = eqRows.filter((r) => r.dW > 0).sort((x, y) => y.dW - x.dW).slice(0, 10);
      const down = eqRows.filter((r) => r.dW < 0).sort((x, y) => x.dW - y.dW).slice(0, 10);
      const big = [...up, ...down.slice().reverse()];
      body.innerHTML = `<div class="grid">
        ${UI.card({
          span: 5,
          title: 'Portfolio characteristics',
          sub: `${esc(la)} vs ${esc(lb)}`,
          flush: true,
          body: `<div class="table-wrap"><table class="dt" data-test="cmp-kpis"><caption class="visually-hidden">Characteristics compared</caption><thead><tr><th scope="col">Measure</th><th class="num" scope="col">${esc(la)}</th><th class="num" scope="col">${esc(lb)}</th><th class="num" scope="col">Change</th></tr></thead><tbody>
            ${diffRow('Equity holdings', U.int(sa.nEq), U.int(sb.nEq), dInt(sa.nEq, sb.nEq))}
            ${diffRow('All positions', U.int(sa.nAll), U.int(sb.nAll), dInt(sa.nAll, sb.nAll))}
            ${diffRow('Equity shares, total', U.pct(sa.eqW), U.pct(sb.eqW), UI.ppCell(sb.eqW - sa.eqW))}
            ${diffRow('Cash & net assets', U.pct(sa.cashW), U.pct(sb.cashW), UI.ppCell(sb.cashW - sa.cashW))}
            ${diffRow('Largest holding', sa.top1 ? `${U.pct(sa.top1.w)}<br><small class="muted">${esc(U.shortName(M.secName(sa.top1.sec), 26))}</small>` : '—', sb.top1 ? `${U.pct(sb.top1.w)}<br><small class="muted">${esc(U.shortName(M.secName(sb.top1.sec), 26))}</small>` : '—', sa.top1 && sb.top1 ? UI.ppCell(sb.top1.w - sa.top1.w) : '—')}
            ${diffRow('Top 5 holdings', U.pct(sa.top5W), U.pct(sb.top5W), UI.ppCell(sb.top5W - sa.top5W))}
            ${diffRow('Top 10 holdings', U.pct(sa.top10W), U.pct(sb.top10W), UI.ppCell(sb.top10W - sa.top10W))}
            ${diffRow('Largest sector', sa.topSector ? `${U.pct(sa.topSector.w)}<br><small class="muted">${esc(sa.topSector.label)}</small>` : '—', sb.topSector ? `${U.pct(sb.topSector.w)}<br><small class="muted">${esc(sb.topSector.label)}</small>` : '—', '—')}
            ${diffRow('Total market value', U.cr(sa.aum), U.cr(sb.aum), U.crDelta(sb.aum - sa.aum))}
          </tbody></table></div>`,
        })}
        ${UI.card({
          span: 7,
          title: 'How the equity allocation changed',
          sub: `Stocks only, % of fund, by allocation: ${U.pct(sa.eqW)} + new ${U.pp(adds)} + increases ${U.pp(inc)} + reductions ${U.pp(red)} + exits ${U.pp(exits)} = ${U.pct(sb.eqW)}. Changes include price moves.`,
          body: UI.chart('cmp-wf', 'tall', 'Allocation waterfall'),
        })}
        ${UI.card({ span: 12, title: 'Largest allocation changes', sub: 'Ten largest increases and ten largest decreases among stocks, change in allocation (% of fund)', body: UI.chart('cmp-big', 'tall', 'Largest allocation changes') })}
      </div>
      ${UI.tabs('compare', [{ id: 'holdings', label: 'Holdings' }, { id: 'sectors', label: 'Sectors' }, { id: 'mcap', label: 'Market cap' }, { id: 'assets', label: 'Asset & asset type' }, { id: 'cash', label: 'Cash & other lines' }], tab)}
      <div id="cmp-tab" role="tabpanel" aria-labelledby="tab-compare-${tab}"></div>`;
      C.waterfall(document.getElementById('cmp-wf'), {
        steps: [
          { label: la, value: sa.eqW, kind: 'total' },
          { label: `New / re-entered (${nAdd})`, value: adds, kind: 'delta', count: nAdd },
          { label: `Increased (${nInc})`, value: inc, kind: 'delta', count: nInc },
          { label: `Reduced (${nRed})`, value: red, kind: 'delta', count: nRed },
          { label: `Exited (${nEx})`, value: exits, kind: 'delta', count: nEx },
          { label: lb, value: sb.eqW, kind: 'total' },
        ],
      });
      C.bar(document.getElementById('cmp-big'), { labels: big.map((r) => r.name), horizontal: true, unit: 'pp', labelMax: 30, datasets: [{ label: 'Allocation change', data: big.map((r) => r.dW), colors: big.map((r) => (r.dW > 0 ? '#15803d' : '#c0392b')), unit: 'pp' }], onClick: (i) => HPI.setState({ sec: big[i].sec, page: 'stock' }) });
      const tb = body.querySelector('#cmp-tab');
      ({ holdings, sectors: (h) => dimTab(h, S, M, pid, A, B, 'sector'), mcap: (h) => dimTab(h, S, M, pid, A, B, 'mcap'), assets, cash }[tab] || holdings)(tb, S, M, pid, A, B, scope);
    },
  };

  function holdings(host, S, M, pid, A, B) {
    const scope = S.cmpScope === 'all' ? 'all' : 'eq';
    const rows = M.compare(pid, A, B, S.movBasis, scope);
    const cnt = M.countStatus(rows);
    const filt = ST.includes(S.cmpFilter) ? S.cmpFilter : 'all';
    const shown = filt === 'all' ? rows : rows.filter((r) => r.status === filt);
    const ra = M.ranks(pid, A), rb = M.ranks(pid, B);
    host.innerHTML = UI.card({
      title: `Holdings: ${esc(M.months[A].label)} → ${esc(M.months[B].label)}`,
      sub: `Status by ${S.movBasis === 'qty' ? 'reported quantity (allocation where no quantity; marked *)' : 'allocation'}. New = not held in month A nor before it; re-entered = held before month A but not in it. Observed changes, not confirmed trades.`,
      actions: K.scopeSeg('cmpScope', scope),
      flush: true,
      body: `<div style="padding:0 16px 10px">${UI.chips('cmpFilter', [{ value: 'all', label: 'All', n: rows.length }, ...ST.map((s) => ({ value: s, label: UI.statusText(s), n: cnt[s] }))], filt, 'Filter by status')}</div><div id="cmp-h"></div>`,
    });
    UI.table(document.getElementById('cmp-h'), {
      id: 'cmp-h',
      caption: 'Holdings compared',
      rows: shown,
      unit: 'holding',
      sort: { key: 'dW', dir: 'desc' },
      search: (r) => r.name + ' ' + M.isinText(r.sec) + ' ' + (r.sector || ''),
      exportName: K.exp(M, pid, 'comparison', K.key(M, A), K.key(M, B), S.movBasis),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        K.secCol(M),
        K.isinCol(M),
        { key: 'status', label: 'Status', value: (r) => K.statusOrder[r.status], html: (r) => UI.moveBadge(r, S.movBasis), csv: (r) => r.status },
        { key: 'wA', label: M.months[A].label, num: true, value: (r) => r.wA, html: (r) => (r.a ? UI.pctCell(r.wA) : UI.notHeld()), csv: (r) => r.wA },
        { key: 'wB', label: M.months[B].label, num: true, value: (r) => r.wB, html: (r) => (r.b ? UI.pctCell(r.wB) : UI.notHeld()), csv: (r) => r.wB },
        { key: 'dW', label: 'Allocation change', num: true, value: (r) => r.dW, html: (r) => UI.ppCell(r.dW) },
        { key: 'relW', label: 'Relative change', num: true, value: (r) => r.relW, html: (r) => (r.relW == null ? '<span class="faint">—</span>' : UI.chgCell(r.relW)) },
        { key: 'qA', label: 'Quantity A', num: true, value: (r) => r.qA, html: (r) => (r.a ? U.qty(r.qA) : '—') },
        { key: 'qB', label: 'Quantity B', num: true, value: (r) => r.qB, html: (r) => (r.b ? U.qty(r.qB) : '—') },
        { key: 'relQ', label: 'Qty change %', num: true, value: (r) => r.relQ, html: (r) => (r.relQ == null ? '<span class="faint">—</span>' : UI.chgCell(r.relQ)) },
        { key: 'rA', label: 'Rank A', num: true, value: (r) => ra.get(r.sec) || null, html: (r) => (ra.get(r.sec) ? '#' + ra.get(r.sec) : '—') },
        { key: 'rB', label: 'Rank B', num: true, value: (r) => rb.get(r.sec) || null, html: (r) => (rb.get(r.sec) ? '#' + rb.get(r.sec) : '—') },
        { key: 'sector', label: 'Sector', value: (r) => r.sector || '', html: (r) => esc(r.sector || '—') },
      ],
    });
  }

  function dimTab(host, S, M, pid, A, B, dim) {
    const scope = (dim === 'sector' ? S.sectorScope : S.mcapScope) === 'all' ? 'all' : 'eq';
    const gA = M.groupMap(pid, A, dim, scope), gB = M.groupMap(pid, B, dim, scope);
    const keys = Array.from(new Set([...gA.keys(), ...gB.keys()]));
    const rows = keys.map((k) => ({ key: k, label: M.dimLabel(dim, k), a: gA.get(k) ? gA.get(k).w : null, b: gB.get(k) ? gB.get(k).w : null, na: gA.get(k) ? gA.get(k).n : 0, nb: gB.get(k) ? gB.get(k).n : 0 }));
    rows.sort((x, y) => Math.abs((y.b || 0) - (y.a || 0)) - Math.abs((x.b || 0) - (x.a || 0)));
    const top = rows.slice().sort((x, y) => Math.max(y.a || 0, y.b || 0) - Math.max(x.a || 0, x.b || 0)).slice(0, 14);
    const name = dim === 'sector' ? 'Sector' : 'Market-cap category';
    host.innerHTML = `<div class="grid">
      ${UI.card({ span: 6, title: `${name} allocation`, sub: `${K.scopeLabel(scope)}, % of fund (scope set on the ${dim === 'sector' ? 'Sector' : 'Market cap'} page)`, body: UI.chart('cmp-dim', 'tall', name + ' comparison') })}
      ${UI.card({ span: 6, title: `${name} changes`, sub: 'Sorted by size of change', flush: true, body: '<div id="cmp-dt"></div>' })}
    </div>`;
    C.bar(document.getElementById('cmp-dim'), { labels: top.map((r) => r.label), horizontal: true, unit: 'pct', labelMax: 22, datasets: [{ label: M.months[A].label, data: top.map((r) => r.a || 0), color: '#b8c7e6' }, { label: M.months[B].label, data: top.map((r) => r.b || 0), color: C.A }] });
    UI.table(document.getElementById('cmp-dt'), {
      id: 'cmp-dt-' + dim,
      caption: name + ' changes',
      rows,
      unit: dim === 'sector' ? 'sector' : 'category',
      pageSize: 50,
      sort: { key: 'ad', dir: 'desc' },
      exportName: K.exp(M, pid, dim + '_comparison', K.key(M, A), K.key(M, B), scope),
      onRowClick: (r) => HPI.setState(dim === 'sector' ? { sector: r.key, page: 'sector', tabs: Object.assign({}, S.tabs, { sector: 'detail' }) } : { mcapCat: r.key, page: 'mcap' }),
      columns: [
        { key: 'label', label: name, value: (r) => r.label, html: (r) => `<strong>${esc(r.label)}</strong>` },
        { key: 'a', label: M.months[A].short, num: true, value: (r) => r.a, html: (r) => (r.a == null ? '<span class="nodata">No holdings</span>' : U.pct(r.a)) },
        { key: 'b', label: M.months[B].short, num: true, value: (r) => r.b, html: (r) => (r.b == null ? '<span class="nodata">No holdings</span>' : U.pct(r.b)) },
        { key: 'ad', label: 'Allocation change', num: true, value: (r) => Math.abs((r.b || 0) - (r.a || 0)), html: (r) => UI.ppCell((r.b || 0) - (r.a || 0)), csv: (r) => (r.b || 0) - (r.a || 0), title: 'Sorted by absolute size' },
        { key: 'rel', label: 'Relative change', num: true, value: (r) => (r.a != null && r.b != null ? U.relChange(r.a, r.b) : null), html: (r) => (r.a != null && r.b != null ? UI.chgCell(U.relChange(r.a, r.b)) : '<span class="faint">—</span>') },
        { key: 'na', label: 'Holdings A', num: true, value: (r) => r.na, html: (r) => U.int(r.na) },
        { key: 'nb', label: 'Holdings B', num: true, value: (r) => r.nb, html: (r) => U.int(r.nb) },
      ],
    });
  }

  function assets(host, S, M, pid, A, B) {
    const mk = (dim) => {
      const gA = M.groupMap(pid, A, dim, 'all'), gB = M.groupMap(pid, B, dim, 'all');
      return Array.from(new Set([...gA.keys(), ...gB.keys()])).map((k) => ({ key: k, label: M.dimLabel(dim, k), a: gA.get(k) ? gA.get(k).w : null, b: gB.get(k) ? gB.get(k).w : null, na: gA.get(k) ? gA.get(k).n : 0, nb: gB.get(k) ? gB.get(k).n : 0 }));
    };
    host.innerHTML = `<div class="grid">${UI.card({ span: 5, title: 'Asset (source field)', flush: true, body: '<div id="cmp-as"></div>' })}${UI.card({ span: 7, title: 'Asset Type (source field)', flush: true, body: '<div id="cmp-at"></div>' })}</div>`;
    const cols = (label) => [
      { key: 'label', label, value: (r) => r.label, html: (r) => `<strong>${esc(r.label)}</strong>` },
      { key: 'a', label: M.months[A].short, num: true, value: (r) => r.a, html: (r) => (r.a == null ? '<span class="nodata">None</span>' : U.pct(r.a)) },
      { key: 'b', label: M.months[B].short, num: true, value: (r) => r.b, html: (r) => (r.b == null ? '<span class="nodata">None</span>' : U.pct(r.b)) },
      { key: 'd', label: 'Allocation change', num: true, value: (r) => (r.b || 0) - (r.a || 0), html: (r) => UI.ppCell((r.b || 0) - (r.a || 0)) },
      { key: 'na', label: 'Lines A', num: true, value: (r) => r.na, html: (r) => U.int(r.na) },
      { key: 'nb', label: 'Lines B', num: true, value: (r) => r.nb, html: (r) => U.int(r.nb) },
    ];
    UI.table(document.getElementById('cmp-as'), { id: 'cmp-as', caption: 'Asset compared', rows: mk('asset'), unit: 'asset', pageSizes: [25], sort: { key: 'b', dir: 'desc' }, exportName: K.exp(M, pid, 'asset_comparison', K.key(M, A), K.key(M, B)), columns: cols('Asset') });
    UI.table(document.getElementById('cmp-at'), { id: 'cmp-at', caption: 'Asset Type compared', rows: mk('assetType'), unit: 'type', pageSizes: [25], sort: { key: 'b', dir: 'desc' }, exportName: K.exp(M, pid, 'asset_type_comparison', K.key(M, A), K.key(M, B)), columns: cols('Asset Type') });
  }

  function cash(host, S, M, pid, A, B) {
    const rows = M.compare(pid, A, B, 'alloc', 'all').filter((r) => r.cls !== 'EQ');
    host.innerHTML = UI.card({ title: 'Cash, debt and other non-equity lines', sub: 'Each source line kept separate; allocation in each month', flush: true, body: '<div id="cmp-c"></div>' });
    UI.table(document.getElementById('cmp-c'), {
      id: 'cmp-c',
      caption: 'Non-equity lines compared',
      rows,
      unit: 'line',
      sort: { key: 'wB', dir: 'desc' },
      exportName: K.exp(M, pid, 'non_equity_comparison', K.key(M, A), K.key(M, B)),
      columns: [
        K.secCol(M),
        { key: 'type', label: 'Asset Type', value: (r) => r.assetType || '', html: (r) => esc(r.assetType || '—') },
        { key: 'wA', label: M.months[A].label, num: true, value: (r) => r.wA, html: (r) => (r.a ? UI.pctCell(r.wA) : UI.notHeld()), csv: (r) => r.wA },
        { key: 'wB', label: M.months[B].label, num: true, value: (r) => r.wB, html: (r) => (r.b ? UI.pctCell(r.wB) : UI.notHeld()), csv: (r) => r.wB },
        { key: 'dW', label: 'Allocation change', num: true, value: (r) => r.dW, html: (r) => UI.ppCell(r.dW) },
        { key: 'status', label: 'Status', value: (r) => K.statusOrder[r.status], html: (r) => UI.moveBadge(r, 'alloc'), csv: (r) => r.status },
      ],
    });
  }
})();

/* ---- 18u_unified.js ---- */
/* ============================================================================
   18u_unified.js — Unified executive workspace
   The landing page: the selected portfolio as it stood in the chosen month,
   laid out like a fund factsheet (key facts, top 10 holdings, sector and
   market-cap split), plus what changed since the previous month and a route
   into every detailed analysis. It reads the same model, state and
   calculations as every other page, so there is one analytical engine.
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, SH = HPI.shell;
  const esc = U.esc;

  function go(page, patch = {}) {
    location.hash = HPI.hashFor(Object.assign({ page }, patch));
  }

  // changes since the previous month, in the unit of the figure they belong to
  const countDelta = (a, b) => (a === b ? 'No change' : (a > b ? '+' : '−') + U.int(Math.abs(a - b)));
  const allocDelta = (a, b) => (U.isNum(a) && U.isNum(b) ? (Math.abs(a - b) < 0.005 ? 'No change' : U.pp(a - b)) : '—');

  // allocation bar scaled to the largest value in its list; the number beside it carries the meaning
  const bar = (w, max) => `<span class="u-bar" aria-hidden="true"><span style="width:${Math.max(1.5, Math.min(100, (w / (max || 1)) * 100)).toFixed(1)}%"></span></span>`;

  const MCAP_SHADES = ['#16325f', '#2456d6', '#7fa0ea', '#b9c3d0'];
  const mcapShade = (name, i) => (/large/i.test(name) ? MCAP_SHADES[0] : /mid/i.test(name) ? MCAP_SHADES[1] : /small/i.test(name) ? MCAP_SHADES[2] : MCAP_SHADES[3]);

  HPI.pages.unified = {
    nav: 'Unified Executive',
    title: 'Unified Executive Workspace',
    icon: 'overview',
    purpose: 'The selected portfolio as it stood in the chosen month: key facts, top holdings, sector and market-cap split, and what changed since the previous month, with a route into each detailed analysis.',
    render(root, S, M) {
      const pid = S.pid, mi = S.mi;
      const p = M.portfolios[pid];
      const sm = M.summary(pid, mi);
      const prevInfo = SH.prevLabel(pid, mi);
      const prev = prevInfo ? M.summary(pid, prevInfo.prev) : null;
      const vsTxt = prevInfo ? ` vs ${prevInfo.label}` : '';
      const V = HPI.validation || { counts: {} };

      /* ---------- factsheet band ---------- */
      const facts = [
        { label: 'Market value', value: U.cr(sm.aum), delta: prev ? U.crDelta(sm.aum - prev.aum) + vsTxt : 'First month of data', test: 'u-aum' },
        { label: 'Equity holdings', value: U.int(sm.nEq), delta: prev ? countDelta(sm.nEq, prev.nEq) + vsTxt : 'First month of data', test: 'u-neq' },
        { label: 'All positions', value: U.int(sm.nAll), delta: prev ? countDelta(sm.nAll, prev.nAll) + vsTxt : 'First month of data', test: 'u-nall' },
        { label: 'Cash & net assets', value: U.pct(sm.cashW), delta: prev ? allocDelta(sm.cashW, prev.cashW) + vsTxt : 'First month of data', test: 'u-cash' },
        { label: 'Top 10 concentration', value: U.pct(sm.top10W), delta: prev ? allocDelta(sm.top10W, prev.top10W) + vsTxt : 'First month of data', test: 'u-top10' },
        { label: 'Largest holding', value: sm.top1 ? U.pct(sm.top1.w) : '—', delta: sm.top1 ? U.shortName(M.secName(sm.top1.sec), 30) : 'No equity holdings', test: 'u-top1' },
      ];
      const factsHtml = facts.map((f) => `<div class="u-fact" data-test="${f.test}"><dt>${esc(f.label)}</dt><dd><span class="u-fact-value">${f.value}</span><span class="u-fact-delta">${esc(f.delta)}</span></dd></div>`).join('');

      /* ---------- top 10 holdings ---------- */
      const eq = (M.scoped(pid, mi, 'eq') || []).filter((ps) => U.isNum(ps.w)).slice().sort((a, b) => b.w - a.w);
      const top = eq.slice(0, 10);
      const topMax = top.length ? top[0].w : 1;
      const topSum = top.reduce((s, ps) => s + ps.w, 0);
      const topRows = top.map((ps, i) => `<tr>
          <td class="num u-rank">${i + 1}</td>
          <th scope="row"><button type="button" class="linkish" data-unified-stock="${esc(String(ps.sec))}" title="Open ${esc(M.secName(ps.sec))} in Stock analysis">${esc(U.shortName(M.secName(ps.sec), 44))}</button></th>
          <td class="u-muted-cell">${esc(M.dimLabel('sector', ps.sector))}</td>
          <td class="u-muted-cell">${esc(M.dimLabel('mcap', ps.mcap))}</td>
          <td class="num u-alloc">${U.pct(ps.w)}${bar(ps.w, topMax)}</td>
        </tr>`).join('');

      /* ---------- sector allocation: top 8 plus the rest, so the list adds up ---------- */
      const sectorsAll = Array.from(M.groupMap(pid, mi, 'sector', 'eq').entries())
        .map(([key, x]) => ({ key, name: M.dimLabel('sector', key), w: x.w, n: x.n }))
        .sort((a, b) => b.w - a.w);
      const sectors = sectorsAll.slice(0, 8);
      const rest = sectorsAll.slice(8);
      if (rest.length) sectors.push({ name: `Other sectors (${rest.length})`, w: rest.reduce((s, x) => s + x.w, 0), n: rest.reduce((s, x) => s + x.n, 0), other: true });
      const secMax = sectors.length ? Math.max(...sectors.map((x) => x.w)) : 1;
      const eqTotal = sectorsAll.reduce((s, x) => s + x.w, 0);
      const sectorRows = sectors.map((x) => `<tr${x.other ? ' class="u-other"' : ''}>
          <th scope="row">${esc(x.name)}</th>
          <td class="num u-alloc">${U.pct(x.w)}${bar(x.w, secMax)}</td>
          <td class="num u-muted-cell">${U.int(x.n)}</td>
        </tr>`).join('');

      /* ---------- market-cap split ---------- */
      const mcaps = Array.from(M.groupMap(pid, mi, 'mcap', 'eq').entries())
        .map(([key, x]) => ({ key, name: M.dimLabel('mcap', key), w: x.w, n: x.n }))
        .sort((a, b) => (/large/i.test(a.name) ? 0 : /mid/i.test(a.name) ? 1 : /small/i.test(a.name) ? 2 : 3) - (/large/i.test(b.name) ? 0 : /mid/i.test(b.name) ? 1 : /small/i.test(b.name) ? 2 : 3) || b.w - a.w);
      const mcTotal = mcaps.reduce((s, x) => s + x.w, 0) || 1;
      const mcapBar = mcaps.map((x, i) => `<span style="width:${((x.w / mcTotal) * 100).toFixed(2)}%;background:${mcapShade(x.name, i)}" title="${esc(x.name)}: ${U.pct(x.w)}"></span>`).join('');
      const mcapRows = mcaps.map((x, i) => `<tr>
          <th scope="row"><span class="u-swatch" style="background:${mcapShade(x.name, i)}" aria-hidden="true"></span>${esc(x.name)}</th>
          <td class="num">${U.pct(x.w)}</td>
          <td class="num u-muted-cell">${U.int(x.n)}</td>
        </tr>`).join('');

      /* ---------- since the previous month ---------- */
      let changeBody;
      if (!prevInfo) {
        changeBody = `<p class="u-empty">This is the first month of data for this portfolio, so there is no earlier month to compare with.</p>`;
      } else {
        const mv = M.movement(pid, mi, S.movBasis, 'eq');
        const cnt = M.countStatus(mv.rows);
        const counts = [['NEW', cnt.NEW], ['RE-ENTERED', cnt['RE-ENTERED']], ['INCREASED', cnt.INCREASED], ['REDUCED', cnt.REDUCED], ['EXITED', cnt.EXITED], ['UNCHANGED', cnt.UNCHANGED]]
          .map(([st, n]) => `<li>${UI.badge(st)}<b>${U.int(n || 0)}</b></li>`).join('');
        const rows = (mv.rows || []).filter((r) => U.isNum(r.dW) && Math.abs(r.dW) >= 0.005);
        const ups = rows.filter((r) => r.dW > 0).sort((a, b) => b.dW - a.dW).slice(0, 3);
        const downs = rows.filter((r) => r.dW < 0).sort((a, b) => a.dW - b.dW).slice(0, 3);
        const moveList = (list, emptyTxt) => (list.length
          ? `<ul class="u-moves">${list.map((r) => `<li><button type="button" class="linkish" data-unified-stock="${esc(String(r.sec))}">${esc(U.shortName(r.name, 34))}</button><span class="u-move-status">${UI.moveBadge(r, S.movBasis)}</span><span class="num ${r.dW > 0 ? 'pos' : 'neg'}">${U.pp(r.dW)}</span></li>`).join('')}</ul>`
          : `<p class="u-empty">${emptyTxt}</p>`);
        changeBody = `
          <ul class="u-counts" aria-label="Stocks by movement, ${esc(prevInfo.label)} to ${esc(M.months[mi].label)}">${counts}</ul>
          <div class="u-moves-grid">
            <div><h3>Largest increases in allocation</h3>${moveList(ups, 'No stock gained allocation.')}</div>
            <div><h3>Largest decreases in allocation</h3>${moveList(downs, 'No stock lost allocation.')}</div>
          </div>
          <p class="u-note">Observed changes between two month-ends, classified by ${S.movBasis === 'qty' ? 'reported quantity' : 'allocation'}; allocation can also move with prices.</p>`;
      }

      /* ---------- explore further ---------- */
      const tiles = [
        ['overview', 'Coverage and each portfolio’s history'],
        ['portfolio', 'Every holding, ranks and composition over time'],
        ['stock', 'One security’s allocation, rank and quantity'],
        ['sector', 'Sector weights and their constituents'],
        ['mcap', 'Large, mid and small cap over time'],
        ['cash', 'Cash and every non-equity line'],
        ['movements', 'New, increased, reduced and exited holdings'],
        ['overlap', 'Common holdings between two funds'],
        ['compare', 'Any two months side by side'],
        ['audit', 'Checks, lineage, methodology and updates'],
      ].filter(([pg]) => HPI.pages[pg])
        .map(([pg, d]) => `<button type="button" class="u-tile" data-unified-page="${pg}">${UI.icon(HPI.pages[pg].icon || pg)}<span><strong>${esc(HPI.pages[pg].nav)}</strong><span>${esc(d)}</span></span></button>`).join('');

      root.innerHTML = `${SH.header('unified')}
        <div class="grid u-page">
          <section class="card span-12 u-hero" aria-labelledby="u-fund">
            <div class="u-hero-id">
              <h2 id="u-fund">${esc(p.name)}</h2>
              <p>Portfolio as on <b>${esc(M.months[mi].label)}</b>. Holdings history from ${esc(M.months[p.first].label)} to ${esc(M.months[p.last].label)}, ${U.count(p.avail.length, 'month')} of data.</p>
              <div class="u-hero-actions">
                <button class="btn sm" type="button" data-unified-page="portfolio">${UI.icon('portfolio')}Portfolio snapshot</button>
                <button class="btn sm" type="button" data-unified-page="stock">${UI.icon('stock')}Stock analysis</button>
                <button class="btn sm" type="button" data-unified-page="compare">${UI.icon('compare')}Compare periods</button>
              </div>
            </div>
            <dl class="u-facts">${factsHtml}</dl>
          </section>

          ${UI.card({
            span: 7, title: 'Top 10 holdings', sub: `Equity shares by allocation, ${esc(M.months[mi].label)}`, flush: true,
            actions: `<button class="btn sm" type="button" data-unified-page="portfolio">Open full portfolio</button>`,
            body: top.length
              ? `<div class="table-wrap"><table class="dt u-table"><caption class="visually-hidden">Top 10 holdings</caption><thead><tr><th class="num" scope="col">#</th><th scope="col">Security</th><th scope="col">Sector</th><th scope="col">Market cap</th><th class="num" scope="col">Allocation</th></tr></thead><tbody>${topRows}</tbody></table></div>
                 <p class="u-foot">Together the top 10 hold <b>${U.pct(topSum)}</b> of the fund.</p>`
              : `<p class="u-empty">This portfolio held no equity shares in ${esc(M.months[mi].label)}.</p>`,
          })}
          ${UI.card({
            span: 5, title: 'Sector allocation', sub: 'Equity shares, % of fund', flush: true,
            actions: `<button class="btn sm" type="button" data-unified-page="sector">Open sector analysis</button>`,
            body: sectors.length
              ? `<div class="table-wrap"><table class="dt u-table"><caption class="visually-hidden">Sector allocation</caption><thead><tr><th scope="col">Sector</th><th class="num" scope="col">Allocation</th><th class="num" scope="col">Stocks</th></tr></thead><tbody>${sectorRows}</tbody></table></div>
                 <p class="u-foot">All sectors together: <b>${U.pct(eqTotal)}</b> of the fund in equity shares.</p>`
              : `<p class="u-empty">No sector data for this month.</p>`,
          })}
          ${UI.card({
            span: 5, title: 'Market-cap split', sub: 'Equity shares by SEBI MCAP Type, % of fund', flush: true,
            actions: `<button class="btn sm" type="button" data-unified-page="mcap">Open market-cap analysis</button>`,
            body: mcaps.length
              ? `<div class="u-stack" role="img" aria-label="${esc(mcaps.map((x) => `${x.name} ${U.pct(x.w)}`).join(', '))}">${mcapBar}</div>
                 <div class="table-wrap"><table class="dt u-table"><caption class="visually-hidden">Market-cap split</caption><thead><tr><th scope="col">Category</th><th class="num" scope="col">Allocation</th><th class="num" scope="col">Stocks</th></tr></thead><tbody>${mcapRows}</tbody></table></div>
                 <p class="u-foot">Categories are the source’s SEBI MCAP Type, one label per security.</p>`
              : `<p class="u-empty">No market-cap classification for this month.</p>`,
          })}
          ${UI.card({
            span: 7, title: prevInfo ? `Since ${esc(prevInfo.label)}` : 'Since the previous month', sub: prevInfo ? `How the stocks moved between ${esc(prevInfo.label)} and ${esc(M.months[mi].label)}` : '', flush: true,
            actions: `<button class="btn sm" type="button" data-unified-page="movements">Open movements</button>`,
            body: `<div class="u-change">${changeBody}</div>`,
          })}

          <section class="card span-12 u-data" aria-label="Data behind this view">
            <p>Built from <b>${esc(M.source.file)}</b>: ${U.count(M.records.length, 'source row')}, ${U.count(M.portfolios.length, 'portfolio')} and ${U.count(M.nM, 'month')}. Validation: ${U.int(V.counts.pass || 0)} passed, ${U.int(V.counts.warn || 0)} to review, ${U.int(V.counts.fail || 0)} failed.</p>
            <button type="button" class="btn sm" data-unified-audit>${UI.icon('audit')}Open data &amp; audit</button>
          </section>

          <section class="span-12 u-explore" aria-labelledby="u-explore-h">
            <h2 id="u-explore-h">Explore further</h2>
            <p>Every analysis opens with this portfolio and month already selected.</p>
            <div class="u-tiles">${tiles}</div>
          </section>
        </div>`;

      root.querySelectorAll('[data-unified-page]').forEach((b) => b.addEventListener('click', () => go(b.dataset.unifiedPage)));
      root.querySelectorAll('[data-unified-stock]').forEach((b) => b.addEventListener('click', () => go('stock', { sec: +b.dataset.unifiedStock })));
      root.querySelectorAll('[data-unified-audit]').forEach((b) => b.addEventListener('click', () => go('audit')));
    },
  };
})();

/* ---- 19_audit.js ---- */
/* =============================================================================
   19_audit.js — Data & audit
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, K = HPI.kit, SH = HPI.shell;
  const esc = U.esc;

  HPI.pages.audit = {
    nav: 'Data & audit',
    title: 'Data & audit',
    icon: 'audit',
    purpose: 'What was loaded, every validation check, data availability, duplicate and identity handling, source-to-screen lineage, the methodology behind every figure, and the Google Sheet the data comes from.',
    render(root, S, M) {
      const V = HPI.validation;
      const tab = S.tabs.audit;
      root.innerHTML = `${SH.header('audit')}
        ${UI.tabs('audit', [{ id: 'summary', label: 'Summary' }, { id: 'checks', label: `Validation checks (${V.checks.length})` }, { id: 'availability', label: 'Availability' }, { id: 'identity', label: 'Duplicates & identity' }, { id: 'lineage', label: 'Lineage explorer' }, { id: 'method', label: 'Methodology' }, { id: 'update', label: 'Data source' }, { id: 'about', label: 'About & test report' }], tab)}
        <div id="au-body" role="tabpanel" aria-labelledby="tab-audit-${tab}"></div>`;
      const body = root.querySelector('#au-body');
      ({ summary, checks, availability, identity, lineage, method, update, about }[tab] || summary)(body, S, M, V);
    },
  };

  const checkTable = (c, host, id) => {
    if (!c || !c.table) return;
    const cols = c.table.columns.map((label, i) => ({ key: 'c' + i, label, value: (r) => r[i], html: (r) => (typeof r[i] === 'number' ? U.fmt(r[i], Number.isInteger(r[i]) ? 0 : 4) : esc(r[i] == null ? '—' : r[i])), num: c.table.rows.length && typeof c.table.rows[0][i] === 'number' }));
    UI.table(host, { id, caption: c.title, rows: c.table.rows, unit: 'row', columns: cols, exportName: 'Audit_' + c.id, search: (r) => r.join(' '), pageSize: 25 });
  };

  /* ------------------------------------------------------------------ */
  function summary(body, S, M, V) {
    const src = M.source;
    const b = HPI.build || {};
    const cm = V.checks.find((c) => c.id === 'class-map');
    const cnt = V.checks.find((c) => c.id === 'counts');
    const rows = [
      ['Data source', 'Google Sheet — ' + src.file], ['Sheet ID', src.sheetId || HPI.sheet.id], ['Tab', src.sheet], ['Used range', src.ref],
      ['Read via', 'Google Sheets query'],
      ['Last synced', HPI.sheet.when(HPI.sheet.status && HPI.sheet.status.syncedAt)], ['Content fingerprint (SHA-256)', src.sha256],
      ['Extracted', src.extractedAt], ['Extractor', src.extractor], ['Dashboard build', (b.id || '—') + (b.builtAt ? ' (' + b.builtAt + ')' : '')], ['Chart library', 'Chart.js ' + (b.chartjs || '')],
    ];
    const perf = [['Model build', U.fmt(M.buildMs, 0) + ' ms'], ['Validation', U.fmt(V.ms, 0) + ' ms'], ['Last page render', U.fmt(HPI.lastRenderMs || 0, 0) + ' ms']];
    body.innerHTML = `<div class="grid">
      ${UI.card({ span: 12, title: 'Validation status', flush: true, body: UI.kpis([{ label: 'Passed', value: U.int(V.counts.pass), test: 'au-pass' }, { label: 'To review', value: U.int(V.counts.warn), sub: 'anomalies in the source, handled and explained', test: 'au-warn' }, { label: 'Failed', value: U.int(V.counts.fail), sub: V.counts.fail ? 'the model does not reconcile — investigate' : 'model reconciles to the source', test: 'au-fail' }, { label: 'Informational', value: U.int(V.counts.info), test: 'au-info' }]), actions: `<button type="button" class="btn sm" data-go='${JSON.stringify({ tabs: Object.assign({}, S.tabs, { audit: 'checks' }) })}'>Open checks</button>` })}
      ${UI.card({ span: 6, title: 'Source and build', flush: true, body: `<div class="table-wrap"><table class="dt"><caption class="visually-hidden">Source metadata</caption><tbody>${rows.map((r) => `<tr><th scope="row">${esc(r[0])}</th><td style="word-break:break-all">${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>` })}
      ${UI.card({ span: 6, title: 'Counts', flush: true, body: '<div id="au-counts"></div>' })}
      ${UI.card({ span: 12, title: 'How source asset types are grouped', sub: 'Analytical classes decide scopes such as “stocks only”; the source Asset and Asset Type values are always displayed unchanged.', flush: true, body: '<div id="au-map"></div>' })}
      ${UI.card({ span: 6, title: 'Session diagnostics', sub: 'Errors caught while using the dashboard in this session', body: HPI.errors.length ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Time</th><th>Section</th><th>Message</th></tr></thead><tbody>${HPI.errors.map((e) => `<tr><td>${esc(e.at.slice(11, 19))}</td><td>${esc(e.page || '')}</td><td>${esc(e.message)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No errors in this session.</p>' })}
      ${UI.card({ span: 6, title: 'Performance', body: `<dl class="stat-list">${perf.map((p) => `<dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd>`).join('')}</dl>` })}
    </div>`;
    checkTable(cnt, document.getElementById('au-counts'), 'au-counts');
    checkTable(cm, document.getElementById('au-map'), 'au-map');
  }

  /* ------------------------------------------------------------------ */
  function checks(body, S, M, V) {
    const groups = [];
    for (const c of V.checks) { let g = groups.find((x) => x.name === c.group); if (!g) groups.push((g = { name: c.group, items: [] })); g.items.push(c); }
    body.innerHTML = groups.map((g) => UI.card({ title: esc(g.name), flush: true, body: g.items.map((c) => `<div class="check" data-check="${c.id}"><div class="check-head">${UI.badge(c.status)}<span class="check-title">${esc(c.title)}</span></div><p class="check-sum">${esc(c.summary)}</p>${c.table ? `<button type="button" class="btn sm" data-check-open="${c.id}" aria-expanded="false">Show details (${U.count(c.table.rows.length, 'row')})</button><div class="check-detail" hidden></div>` : ''}</div>`).join('') })).join('<div style="height:14px"></div>');
    body.querySelectorAll('[data-check-open]').forEach((btn) => btn.addEventListener('click', () => {
      const det = btn.nextElementSibling;
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      btn.textContent = open ? btn.textContent.replace('Hide', 'Show') : btn.textContent.replace('Show', 'Hide');
      det.hidden = open;
      if (!open && !det.dataset.done) { det.dataset.done = '1'; checkTable(V.checks.find((c) => c.id === btn.getAttribute('data-check-open')), det, 'chk-' + btn.getAttribute('data-check-open')); }
    }));
  }

  /* ------------------------------------------------------------------ */
  function availability(body, S, M, V) {
    const head = M.months.map((m) => `<th class="mcol" scope="col" title="${esc(m.label)}">${m.key.endsWith('-01') ? esc(m.key.slice(0, 4)) : ''}</th>`).join('');
    const rows = M.portfolioOrder.map((pid) => {
      const P = M.portfolios[pid];
      const cells = M.months.map((m, i) => {
        const y = P.availSet.has(i), miss = !y && i > P.first && i < P.last;
        return `<td class="av ${y ? 'y' : miss ? 'm' : 'n'}" title="${esc(P.name + ' — ' + m.label + ': ' + (y ? 'data' : miss ? 'missing' : 'outside history'))}"></td>`;
      }).join('');
      return `<tr><th scope="row" class="sticky" style="white-space:nowrap">${esc(P.name)}</th>${cells}</tr>`;
    }).join('');
    body.innerHTML = `${UI.card({ title: 'Data availability by portfolio and month', sub: 'Blue = data; red = missing inside the portfolio’s history; grey = before the first or after the last month. Selectors only ever offer blue months.', flush: true, body: `<div class="table-wrap"><table class="dt avail-grid"><caption class="visually-hidden">Availability matrix</caption><thead><tr><th class="sticky" scope="col">Portfolio</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>` })}<div style="height:14px"></div>${UI.card({ title: 'Availability details', flush: true, body: '<div id="au-av"></div>' })}`;
    checkTable(V.checks.find((c) => c.id === 'availability'), document.getElementById('au-av'), 'au-av');
  }

  /* ------------------------------------------------------------------ */
  function identity(body, S, M, V) {
    const ids = ['duplicates', 'multi-positions', 'continuations', 'class-conflicts', 'corporate-actions', 'isin', 'blank-class'];
    body.innerHTML = ids.map((id) => {
      const c = V.checks.find((x) => x.id === id);
      return c ? UI.card({ title: `${UI.badge(c.status)} ${esc(c.title)}`, sub: esc(c.summary), flush: true, body: c.table ? `<div id="idt-${id}"></div>` : '' }) : '';
    }).join('<div style="height:14px"></div>');
    for (const id of ids) { const host = document.getElementById('idt-' + id); if (host) checkTable(V.checks.find((x) => x.id === id), host, 'idt-' + id); }
  }

  /* ------------------------------------------------------------------ */
  function lineage(body, S, M) {
    const pid = S.pid, mi = S.mi;
    const pos = M.positions(pid, mi);
    const sid = S.sec != null && M.pos(pid, mi, S.sec) ? S.sec : pos[0].sec;
    const dims = [{ value: 'sector', label: 'Sector' }, { value: 'mcap', label: 'Market cap' }, { value: 'asset', label: 'Asset' }, { value: 'assetType', label: 'Asset Type' }, { value: 'cls', label: 'Analytical class' }];
    const dim = dims.find((d) => d.value === S.linDim) ? S.linDim : 'sector';
    const groups = M.groupBy(pid, mi, dim, 'all');
    const gkey = groups.find((g) => g.key === S.linKey) ? S.linKey : groups[0].key;
    const g = groups.find((x) => x.key === gkey);
    let srcSum = 0, srcRows = 0;
    for (const rid of M.portfolios[pid].recIds) { const r = M.records[rid], k = r.pos[mi]; if (k >= 0) { srcRows++; if (!Number.isNaN(r.hp[k])) srcSum += r.hp[k]; } }
    const s = M.summary(pid, mi);
    body.innerHTML = `<div class="grid">
      ${UI.card({
        span: 12,
        title: `Reconciliation — ${esc(M.pName(pid))}, ${esc(M.months[mi].label)}`,
        sub: 'The same total at each layer: source cells → model positions → what the pages display',
        flush: true,
        body: `<div class="table-wrap"><table class="dt" data-test="recon"><caption class="visually-hidden">Reconciliation</caption><thead><tr><th scope="col">Layer</th><th class="num" scope="col">Lines</th><th class="num" scope="col">Sum of Holding (%)</th></tr></thead><tbody>
          <tr><th scope="row">Source rows with data this month</th><td class="num">${U.int(srcRows)}</td><td class="num">${U.fmt(srcSum, 8)}%</td></tr>
          <tr><th scope="row">Model positions (after stitching / summing)</th><td class="num">${U.int(s.nAll)}</td><td class="num">${U.fmt(s.totalW, 8)}%</td></tr>
          <tr><th scope="row">Difference</th><td class="num">${U.int(srcRows - s.nAll)} ${srcRows - s.nAll ? '<span class="muted">(rows combined)</span>' : ''}</td><td class="num">${(srcSum - s.totalW).toExponential(2)}%</td></tr>
        </tbody></table></div>`,
      })}
      ${UI.card({ span: 12, title: 'Trace one position to its source cells', sub: 'Choose any line held this month', body: `<div class="toolbar"><div id="lin-pick"></div></div><div id="lin-out"></div>` })}
      ${UI.card({
        span: 12,
        title: 'Trace an aggregate',
        sub: 'Every position behind a sector, market-cap, asset or class total for this month (all positions, % of fund)',
        actions: `<label class="ctl-label" for="lin-dim">Dimension</label><select id="lin-dim">${dims.map((d) => `<option value="${d.value}" ${d.value === dim ? 'selected' : ''}>${d.label}</option>`).join('')}</select><label class="ctl-label" for="lin-key">Value</label><select id="lin-key" style="max-width:260px">${groups.map((x) => `<option value="${esc(x.key)}" ${x.key === gkey ? 'selected' : ''}>${esc(x.label)} (${U.pct(x.w)})</option>`).join('')}</select>`,
        flush: true,
        body: `<p class="muted" style="padding:0 16px">Total shown on the pages: <strong>${U.pct(g.w, 6)}</strong> across ${g.n} ${U.plural(g.n, 'position')}. The rows below sum to exactly this figure.</p><div id="lin-agg"></div>`,
      })}
    </div>`;
    const items = pos.map((ps) => ({ id: ps.sec, label: M.secName(ps.sec), sub: U.pct(ps.w) + ' · ' + (ps.assetType || ''), search: M.isinText(ps.sec) }));
    const show = (id) => {
      const lin = M.lineage(pid, mi, id);
      const name = { MV: 'Market Value', SH: 'Shares', HP: 'Holding (%)', PX: 'Price', YTM: 'YTM' };
      document.getElementById('lin-out').innerHTML = `<div class="table-wrap"><table class="dt" data-test="lineage"><caption class="visually-hidden">Source cells</caption><thead><tr><th class="num" scope="col">Sheet row</th><th scope="col">Company Name</th><th scope="col">Asset Type</th>${Object.values(name).map((n) => `<th class="num" scope="col">${n}</th>`).join('')}</tr></thead><tbody>${lin.map((l) => `<tr><td class="num">${l.rec.excelRow}</td><td>${esc(l.rec.company)}</td><td>${esc(l.rec.assetType || '')}</td>${l.cells.map((c) => `<td class="num"><span class="faint">${esc(c.addr || '')}</span> ${c.value == null ? '<span class="nodata">blank</span>' : esc(String(c.value))}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted" style="margin-top:8px">Canonical identifier <code>${esc(M.sec(id).key)}</code>. <button type="button" class="linkish" data-lineage="${pid}|${mi}|${id}">Open full lineage</button></p>`;
    };
    UI.combo(document.getElementById('lin-pick'), { id: 'lin-combo', label: 'Position', items, value: sid, onSelect: (id) => { show(id); } });
    show(sid);
    UI.table(document.getElementById('lin-agg'), {
      id: 'lin-agg',
      caption: 'Positions in the aggregate',
      rows: g.positions,
      unit: 'position',
      sort: { key: 'w', dir: 'desc' },
      exportName: K.exp(M, pid, 'trace', dim, M.dimLabel(dim, gkey), K.key(M, mi)),
      columns: [
        K.secCol(M),
        { key: 'type', label: 'Asset Type', value: (r) => r.assetType || '', html: (r) => esc(r.assetType || '') },
        { key: 'w', label: 'Holding (%)', num: true, value: (r) => r.w, html: (r) => U.fmt(r.w, 8) + '%' },
        { key: 'rows', label: 'Excel rows', value: (r) => r.src.map((i) => M.records[i].excelRow).join(', '), html: (r) => esc(r.src.map((i) => M.records[i].excelRow).join(', ')) },
        { key: 'lin', label: 'Cells', sortable: false, csv: false, html: (r) => UI.linBtn(pid, mi, r.sec) },
      ],
    });
    document.getElementById('lin-dim').addEventListener('change', (e) => HPI.setState({ linDim: e.target.value, linKey: null }));
    document.getElementById('lin-key').addEventListener('change', (e) => HPI.setState({ linKey: e.target.value }));
  }

  /* ------------------------------------------------------------------ */
  function method(body) {
    const el = document.getElementById('hpi-method');
    const html = el ? JSON.parse(el.textContent) : '<p>Methodology not bundled.</p>';
    body.innerHTML = UI.card({ title: 'Methodology', sub: 'How every figure in this dashboard is derived from the Google Sheet.', body: `<div class="doc">${html}</div>` });
  }

  /* ------------------------------------------------------------------ */
  const docs = () => { try { return JSON.parse((document.getElementById('hpi-docs') || {}).textContent || '{}'); } catch (e) { return {}; } };
  function about(body) {
    const d = docs();
    body.innerHTML = `<div class="grid">
      ${UI.card({ span: 12, title: 'About this dashboard', sub: 'How to use the dashboard and keep its Google Sheet up to date.', body: `<div class="doc">${d.about || '<p>Not bundled.</p>'}</div>` })}
      ${UI.card({ span: 12, title: 'Test report', sub: 'How this build was verified.', body: `<div class="doc">${d.tests || '<p>Not bundled.</p>'}</div>` })}
    </div>`;
  }

  /* ---------- Data source: the Google Sheet ---------- */
  const facts = (M, V) => {
    const first = M.months[0], last = M.months[M.months.length - 1];
    return [
      ['Months', `${first.label} – ${last.label} (${U.count(M.months.length, 'month')})`],
      ['Portfolios', U.int(M.portfolios.length)], ['Source rows', U.int(M.records.length)], ['Positions', U.int(M.nPositions)],
      ['Validation', `${U.int(V.counts.pass)} passed · ${U.int(V.counts.warn)} to review · ${U.int(V.counts.fail)} failed`],
    ];
  };
  const kvTable = (rows, caption) => `<div class="table-wrap"><table class="dt kv-table"><caption class="visually-hidden">${esc(caption)}</caption><tbody>${rows.map((r) => `<tr><th scope="row">${esc(r[0])}</th><td>${r[2] ? r[1] : esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;

  function update(body, S, M, V) {
    const SHT = HPI.sheet, st = SHT.status || {}, src = M.source;
    const link = `<a href="${esc(SHT.url)}" target="_blank" rel="noopener noreferrer">${esc(SHT.url)}</a>`;
    const state = st.checking
      ? 'Checking the sheet now…'
      : st.error
        ? `Could not re-read the sheet: ${esc(st.error)}`
        : st.newer
          ? 'The sheet has changed — reload to show the latest data.'
          : st.fromCache ? 'Showing the last sync of this sheet.' : 'Up to date with the sheet.';
    body.innerHTML = `<div class="grid">
      ${UI.card({ span: 7, title: 'Google Sheet', sub: 'All data in this dashboard comes from this sheet and nowhere else. It is read every time the dashboard opens.', flush: true, body: kvTable([
        ['Link', link, true],
        ['Tab', 'gid ' + SHT.gid],
        ['Status', state, true],
        ['Last synced', SHT.when(st.syncedAt)],
        ['Read via', 'Google Sheets query'],
        ['Content fingerprint', src.sha256 || '—'],
      ], 'Google Sheet') + `<div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button type="button" class="btn primary" id="sync-now" data-test="sync-now" ${st.checking ? 'disabled' : ''}>Sync now</button>
          ${st.newer ? '<button type="button" class="btn" id="sync-reload">Reload with the latest data</button>' : ''}
          <a class="btn" href="${esc(SHT.url)}" target="_blank" rel="noopener noreferrer">Open the sheet</a>
        </div>` })}
      ${UI.card({ span: 5, title: 'Data on screen', flush: true, body: kvTable(facts(M, V), 'Current data') })}
      ${UI.card({ span: 12, title: 'Keeping the sheet readable', body: `<div class="doc"><p>The sheet must stay shared as <b>Anyone with the link can view</b>. Keep the layout of the first tab: row 1 carries the band titles (Market Value, Shares, Holding (%), Price, YTM) over their month columns; row 2 carries the column names (Scheme Name, Company Name, Sector, Asset, Asset Type, Rating, Rating Agency, Rate Basket, ISIN, Issuer Name, Coupon Rate, Maturity Date, SEBI MCAP Type) and the months; holdings start in row 3. New months and funds are picked up automatically.</p><p>The sheet is read fresh every time the dashboard opens, so it always starts on the sheet’s latest data and latest month. This browser also keeps a copy of the last successful sync: while the sheet loads you can open that copy straight away, and it is used, with a warning, if the sheet cannot be reached. It is always a copy of this sheet, and it is replaced at the next sync.</p></div>` })}
    </div>`;
    const b = body.querySelector('#sync-now');
    if (b) b.addEventListener('click', () => HPI.syncNow(true));
    const r = body.querySelector('#sync-reload');
    if (r) r.addEventListener('click', () => location.reload());
  }
})();

/* ---- 99_main.js ---- */
/* =============================================================================
   99_main.js — start-up: Google Sheet → model → validation → interface
   The only data source is the Google Sheet (09b_sheet.js), read fresh at every
   start so the dashboard opens on the sheet's latest data and latest month.
   While it loads, a previous sync kept in this browser can be opened at once
   ("Open the last sync now"); the sheet is then checked in the background and a
   change is offered as a reload.  If the sheet cannot be read, the previous
   sync is shown with a warning; with no previous sync no figures are shown.
   ========================================================================== */
(async function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util;
  const SH = HPI.sheet;
  const ld0 = document.getElementById('loading'), ns0 = document.querySelector('body > noscript');
  Object.assign((HPI.template = HPI.template || {}), { loading: ld0 ? ld0.outerHTML : '', noscript: ns0 ? ns0.outerHTML : '' });
  const bar = document.getElementById('load-bar');
  const step = document.getElementById('load-step');
  const progress = async (pct, text) => {
    if (bar) bar.style.width = pct + '%';
    if (step) step.textContent = text;
    await U.tick();
  };
  window.addEventListener('error', (e) => HPI.errors && HPI.errors.push({ at: new Date().toISOString(), page: HPI.state && HPI.state.page, message: String(e.message) }));
  window.addEventListener('unhandledrejection', (e) => HPI.errors && HPI.errors.push({ at: new Date().toISOString(), page: HPI.state && HPI.state.page, message: String(e.reason && e.reason.message ? e.reason.message : e.reason) }));

  /* ---------- sync banner ---------- */
  function banner(kind, html, actions = []) {
    let el = document.getElementById('sync-banner');
    if (!html) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'sync-banner'; el.setAttribute('role', 'status'); el.setAttribute('data-test', 'sync-banner'); document.body.appendChild(el); }
    el.className = 'sync-banner ' + kind;
    el.innerHTML = `<div class="sb-text">${html}</div><div class="sb-actions">${actions.map((a, i) => `<button type="button" class="btn sm${i === 0 ? ' primary' : ''}" data-sb="${i}">${U.esc(a.label)}</button>`).join('')}<button type="button" class="icon-btn sb-close" aria-label="Dismiss" data-sb="x">×</button></div>`;
    el.querySelectorAll('[data-sb]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.sb; if (k === 'x') el.remove(); else actions[+k].run(); }));
  }
  HPI.syncBanner = banner;
  const paintStatus = () => {
    const st = SH.status || {};
    document.querySelectorAll('[data-sync-when]').forEach((n) => { n.textContent = st.checking ? 'checking…' : SH.when(st.syncedAt); });
    document.querySelectorAll('[data-sync-word]').forEach((n) => { n.textContent = st.error ? 'not reachable' : st.checking ? 'checking' : st.newer ? 'update ready' : 'synced'; });
    document.querySelectorAll('[data-sync-dot]').forEach((n) => { n.dataset.state = st.error ? 'error' : st.checking ? 'checking' : 'ok'; });
    if (HPI.state && HPI.state.page === 'audit' && HPI.state.tabs && HPI.state.tabs.audit === 'update' && HPI.renderAll) HPI.renderAll({});
  };

  /** Re-read the sheet; compare with what is on screen. */
  HPI.syncNow = async (manual) => {
    const cur = HPI.model && HPI.model.source && HPI.model.source.sha256;
    SH.status = Object.assign({}, SH.status, { checking: true, error: null });
    paintStatus();
    try {
      const raw = await SH.fetch();
      if (raw.source.sha256 !== cur) {
        await SH.cachePut(raw);
        SH.status = Object.assign({}, SH.status, { checking: false, newer: { at: new Date().toISOString(), months: raw.months.length, rows: raw.rows.length } });
        banner('info', '<b>The Google Sheet has changed since this data was synced.</b> Reload to show the latest data.', [{ label: 'Reload with the latest data', run: HPI.reloadLatest }]);
      } else {
        await SH.cacheTouch();
        SH.status = Object.assign({}, SH.status, { checking: false, syncedAt: new Date().toISOString(), fromCache: false, newer: null, transport: raw.source.transport });
        banner(null);
        if (manual) HPI.ui.toast('Up to date — the data matches the Google Sheet.');
      }
    } catch (e) {
      console.error(e);
      SH.status = Object.assign({}, SH.status, { checking: false, error: String(e && e.message) });
      banner('warn', `<b>Showing the last sync of the Google Sheet (${U.esc(SH.when(SH.status.syncedAt))}).</b> ${U.esc(e && e.message)}`, [{ label: 'Try again', run: () => HPI.syncNow(true) }]);
    }
    paintStatus();
  };

  /** reload on the latest data; the address keeps the page but not the months, so it opens on the newest month */
  HPI.reloadLatest = () => {
    try { history.replaceState(null, '', location.pathname + location.search + '#/' + ((HPI.state && HPI.state.page) || 'unified')); } catch (e) { /* ignore */ }
    location.reload();
  };

  async function start(raw) {
    await progress(86, 'Building security identities and positions…');
    const M = (HPI.model = HPI.buildModel(raw));
    if (!M.portfolios.length) throw new Error('The Google Sheet contains no portfolios.');
    if (!M.nPositions) throw new Error('The Google Sheet contains no holdings.');
    await progress(92, 'Running validation checks…');
    HPI.validation = HPI.validate(M);
    await progress(96, 'Preparing the interface…');
    const missing = HPI.PAGES.filter((k) => !HPI.pages[k]);
    if (missing.length) throw new Error('Missing sections: ' + missing.join(', '));
    HPI.shell.build();
    const notes = HPI.initState(M);
    HPI.renderAll({});
    paintStatus();
    if (notes.length) HPI.ui.toast(notes.join(' '));
    await progress(100, 'Ready');
    const ld = document.getElementById('loading');
    if (ld) ld.remove();
    HPI.ready = true;
  }

  try {
    try { HPI.build = JSON.parse((document.getElementById('hpi-build') || {}).textContent || '{}'); } catch (e) { HPI.build = {}; }
    await progress(2, 'Looking for the last sync of the Google Sheet…');
    const cached = await SH.cacheGet();
    const fresh = SH.fetch(progress).then((raw) => ({ raw }), (err) => ({ err }));
    let skip = () => {};
    const skipped = new Promise((resolve) => { skip = resolve; });
    if (cached) {
      const card = document.querySelector('.loading-card');
      if (card) {
        const box = document.createElement('div');
        box.className = 'load-skip';
        box.innerHTML = `<button type="button" class="btn sm" id="load-skip" data-test="load-skip">Open the last sync now</button><span class="muted small">Synced ${U.esc(SH.when(cached.syncedAt))}. The sheet is checked for changes in the background.</span>`;
        card.appendChild(box);
        box.querySelector('#load-skip').addEventListener('click', () => skip({ skip: true }));
      }
    }
    const first = await Promise.race([fresh, skipped]);
    const skipBox = document.querySelector('.load-skip');
    if (skipBox) skipBox.remove();
    if (first.raw) {
      SH.status = { syncedAt: new Date().toISOString(), transport: first.raw.source.transport, fromCache: false };
      await SH.cachePut(first.raw);
      await start(first.raw);
    } else if (cached) {
      // opened from the last sync: either chosen while the sheet was loading, or the sheet could not be read
      SH.status = { syncedAt: cached.syncedAt, transport: cached.raw.source.transport, fromCache: true, checking: !first.err };
      await start(cached.raw);
      const cur = cached.raw.source.sha256;
      const settle = async (r) => {
        if (r.raw) {
          if (r.raw.source.sha256 !== cur) {
            await SH.cachePut(r.raw);
            SH.status = Object.assign({}, SH.status, { checking: false, newer: { at: new Date().toISOString(), months: r.raw.months.length, rows: r.raw.rows.length } });
            banner('info', '<b>The Google Sheet has changed since this data was synced.</b> Reload to show the latest data.', [{ label: 'Reload with the latest data', run: HPI.reloadLatest }]);
          } else {
            await SH.cacheTouch();
            SH.status = Object.assign({}, SH.status, { checking: false, syncedAt: new Date().toISOString(), fromCache: false, newer: null });
          }
        } else {
          console.error(r.err);
          SH.status = Object.assign({}, SH.status, { checking: false, error: String(r.err && r.err.message) });
          banner('warn', `<b>Showing the last sync of the Google Sheet (${U.esc(SH.when(SH.status.syncedAt))}).</b> ${U.esc(r.err && r.err.message)}`, [{ label: 'Try again', run: () => HPI.syncNow(true) }]);
        }
        paintStatus();
      };
      if (first.err) settle(first);
      else fresh.then(settle);
    } else {
      throw first.err;
    }
  } catch (err) {
    console.error(err);
    HPI.startError = String(err && err.message);
    const card = document.querySelector('.loading-card');
    if (card) {
      card.innerHTML = `<h2>The data could not be loaded from the Google Sheet</h2><p>${U.esc(err && err.message)}</p><p class="muted">This dashboard takes all of its data from <a href="${U.esc(SH.url)}" target="_blank" rel="noopener noreferrer">this Google Sheet</a>. No partial or placeholder figures are shown when it cannot be read.</p><p><button type="button" class="btn primary" id="load-retry">Try again</button></p>`;
      const b = document.getElementById('load-retry');
      if (b) b.addEventListener('click', () => location.reload());
    }
  }
})();
</script>
