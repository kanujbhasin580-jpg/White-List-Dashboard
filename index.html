/* ---- 09_import.js ---- */
/* =============================================================================
   09_import.js — turn the portfolio-history sheet into the raw data format
   -----------------------------------------------------------------------------
   The Google Sheet reader (09b_sheet.js) delivers a grid: row 1 = band titles,
   row 2 = column names and months, rows 3+ = holdings.  IMP.fromGrid applies
   the extraction rules (an exact port of build/extract_source.py) and returns
   the raw format the data model is built from.
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util;
  const IMP = (HPI.importer = {});

  /* ---------- the extraction rules (port of build/extract_source.py) ---------- */
  const METRIC_RULES = [['MV', /market\s*value/i], ['SH', /^\s*(shares|quantity|units)/i], ['HP', /holding/i], ['PX', /^\s*price/i], ['YTM', /ytm|yield/i]];
  const ATTR_NAMES = ['Asset', 'Asset Type', 'Rating', 'Rating Agency', 'Rate Basket', 'ISIN', 'Issuer Name', 'Coupon Rate', 'Maturity Date', 'SEBI MCAP Type'];
  const ID_NAMES = ['Scheme Name', 'Company Name', 'Sector'];
  const HP_DECIMALS = 8;
  const isDateVal = (v) => v instanceof Date;
  class ImportError extends Error {}
  IMP.ImportError = ImportError;

  function num(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'boolean' || isDateVal(v) || (typeof v === 'object' && v.error)) throw new ImportError('not a number');
    if (typeof v === 'number') return v;
    const s = String(v).trim().replace(/,/g, '');
    if (s === '' || s === '-' || s === '--') return null;
    const x = Number(s);
    if (Number.isNaN(x)) throw new ImportError('not a number');
    return x;
  }
  const enc = (x, dec) => (x == null ? null : dec != null ? Number(x.toFixed(dec)) : x);
  const monthKey = (d) => d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
  const dayKey = (d) => d.toISOString().slice(0, 10);
  const shown = (v) => (isDateVal(v) ? v.toISOString().slice(0, 19).replace('T', ' ') : v && v.error ? v.error : String(v));

  async function sha256(buf) {
    try {
      const h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { return null; }
  }

  /** Shared extraction rules: a grid {r1, r2, rowArr(excelRow), lastRow, ncols} → the raw format. */
  IMP.fromGrid = async (grid, source, progress = async () => {}) => {
    const { r1, r2, rowArr, lastRow, ncols } = grid;
    const issues = [];

    // ---- metric blocks: runs of date headers split at row-1 band titles ----
    const runs = [];
    for (let c = 0; c < ncols;) {
      if (isDateVal(r2[c])) {
        const s = c;
        while (c < ncols && isDateVal(r2[c])) c++;
        const anchors = [];
        for (let a = s; a < c; a++) if (typeof r1[a] === 'string' && r1[a].trim()) anchors.push(a);
        if (!anchors.length || anchors[0] !== s) throw new ImportError(`Month columns starting at ${U.colLetter(s + 1)} have no band title in row 1.`);
        const bounds = [...anchors, c];
        for (let k = 0; k < bounds.length - 1; k++) runs.push([bounds[k], bounds[k + 1]]);
      } else c++;
    }
    if (!runs.length) throw new ImportError('No month columns found in header row 2 — is this a portfolio-history export?');
    const blocks = [];
    let monthsRef = null;
    for (const [s, e] of runs) {
      const title = r1[s];
      const rule = METRIC_RULES.find(([, rx]) => rx.test(title));
      const key = rule ? rule[0] : null;
      const months = r2.slice(s, e).map(monthKey);
      if (monthsRef == null) monthsRef = months;
      else if (months.join() !== monthsRef.join()) throw new ImportError(`Block '${title}' has a different month sequence from the first block.`);
      if (key == null) issues.push({ type: 'unmapped-block', detail: `Band '${title}' at ${U.colLetter(s + 1)} is not a recognised metric and was ignored` });
      blocks.push({ key, title: title.trim(), col0: s + 1, ncol: e - s });
    }
    if (new Set(monthsRef).size !== monthsRef.length) throw new ImportError('Duplicate month headers inside a block.');
    const keys = blocks.filter((b) => b.key).map((b) => b.key);
    for (const need of ['MV', 'HP']) if (!keys.includes(need)) throw new ImportError(`Required metric block missing: ${need === 'MV' ? 'Market Value' : 'Holding (%)'}.`);
    if (new Set(keys).size !== keys.length) throw new ImportError('A metric block appears twice.');

    // ---- identifier / attribute columns ----
    const headerPos = new Map();
    r2.forEach((h, i) => { if (typeof h === 'string' && h.trim() && !headerPos.has(h.trim())) headerPos.set(h.trim(), i); });
    for (const need of ['Scheme Name', 'Company Name']) if (!headerPos.has(need)) throw new ImportError(`Required column missing: ${need}.`);
    const cols = {};
    for (const name of [...ID_NAMES, ...ATTR_NAMES]) cols[name] = headerPos.has(name) ? headerPos.get(name) + 1 : null;
    for (const name of [...ID_NAMES, ...ATTR_NAMES]) if (!headerPos.has(name)) issues.push({ type: 'missing-column', detail: `Column '${name}' not found; treated as blank` });
    for (const h of headerPos.keys()) if (![...ID_NAMES, ...ATTR_NAMES].includes(h)) issues.push({ type: 'extra-column', detail: `Column '${h}' is not used by the dashboard` });

    // ---- data rows ----
    const strings = [], sidx = new Map();
    const S = (v) => {
      if (v == null) return -1;
      const s = isDateVal(v) ? shown(v) : String(v);
      if (s.trim() === '') return -1;
      if (!sidx.has(s)) { sidx.set(s, strings.length); strings.push(s); }
      return sidx.get(s);
    };
    const blockBy = {};
    for (const b of blocks) if (b.key) blockBy[b.key] = b;
    const nm = monthsRef.length;
    const outRows = [], outCells = [];
    for (let excelRow = 3; excelRow <= lastRow; excelRow++) {
      if (excelRow % 400 === 0) await progress(84 + 12 * (excelRow / lastRow), `Extracting rows… ${U.int(excelRow)} of ${U.int(lastRow)}`);
      const row = rowArr(excelRow);
      const g = (name) => (cols[name] ? row[cols[name] - 1] : null);
      let scheme = g('Scheme Name'), company = g('Company Name');
      const series = {};
      let anyVal = false;
      for (const k of ['MV', 'SH', 'HP', 'PX', 'YTM']) {
        const b = blockBy[k];
        const vals = new Array(nm).fill(null);
        if (b) for (let j = 0; j < nm; j++) {
          const rawv = row[b.col0 - 1 + j];
          try { vals[j] = num(rawv); }
          catch (e) { issues.push({ type: 'malformed-number', detail: `${U.colLetter(b.col0 + j)}${excelRow}: '${shown(rawv)}' is not a number; ignored` }); vals[j] = null; }
          if (vals[j] != null) anyVal = true;
        }
        series[k] = vals;
      }
      const blank = (v) => v == null || String(v).trim() === '';
      if (blank(scheme) && blank(company)) {
        if (anyVal) issues.push({ type: 'orphan-values', detail: `Row ${excelRow} has values but no Scheme/Company; skipped` });
        continue;
      }
      if (blank(scheme)) { issues.push({ type: 'missing-scheme', detail: `Row ${excelRow} has no Scheme Name; skipped` }); continue; }
      if (blank(company)) { issues.push({ type: 'missing-company', detail: `Row ${excelRow} has no Company Name; kept as '(unnamed)'` }); company = '(unnamed)'; }
      let mat = g('Maturity Date');
      if (isDateVal(mat)) mat = dayKey(mat);
      else if (mat != null) mat = String(mat);
      let coupon = g('Coupon Rate');
      try { coupon = num(coupon); } catch (e) { issues.push({ type: 'malformed-number', detail: `Coupon Rate row ${excelRow}: '${shown(coupon)}' ignored` }); coupon = null; }
      outRows.push([excelRow, S(scheme), S(company), S(g('Sector')), S(g('Asset')), S(g('Asset Type')), S(g('Rating')), S(g('Rating Agency')), S(g('Rate Basket')), S(g('ISIN')), S(g('Issuer Name')), enc(coupon), mat, S(g('SEBI MCAP Type'))]);
      const pop = [];
      for (let j = 0; j < nm; j++) if (['MV', 'SH', 'HP', 'PX', 'YTM'].some((k) => series[k][j] != null)) pop.push(j);
      const runsEnc = [];
      let j0 = null, prev = null;
      for (const j of pop) {
        if (j0 === null) { j0 = j; prev = j; }
        else if (j === prev + 1) prev = j;
        else { runsEnc.push(j0, prev - j0 + 1); j0 = j; prev = j; }
      }
      if (j0 !== null) runsEnc.push(j0, prev - j0 + 1);
      const cell = [runsEnc];
      for (const k of ['MV', 'SH', 'HP', 'PX', 'YTM']) {
        const vals = pop.map((j) => enc(series[k][j], k === 'HP' ? HP_DECIMALS : null));
        cell.push(vals.some((v) => v != null) ? vals : 0);
      }
      outCells.push(cell);
    }
    await progress(97, 'Fingerprinting the data…');
    const layout = { blocks, cols, hpDecimals: HP_DECIMALS };
    // content fingerprint: identical data gives an identical fingerprint whichever way it was read
    const content = JSON.stringify([monthsRef, layout, strings, outRows, outCells]);
    const raw = {
      format: 'hpi-raw-1',
      source: Object.assign({ ref: `A1:${U.colLetter(ncols)}${lastRow}`, sha256: await sha256(new TextEncoder().encode(content)) }, source, { extractedAt: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z') }),
      layout,
      months: monthsRef,
      strings,
      rows: outRows,
      cells: outCells,
      issues,
    };
    return raw;
  };

})();

/* ---- 09b_sheet.js ---- */
/* =============================================================================
   09b_sheet.js — the Google Sheet is the only data source
   -----------------------------------------------------------------------------
   The sheet named in <script id="hpi-source"> is read every time the dashboard
   opens, through Google's visualization endpoint loaded as a <script> (JSONP) —
   the one route Google allows from a file opened from disk as well as from a
   web address.  Rows 1 and 2 are requested on their own so the band titles and
   the month headers keep their own types; month headers are read from their
   displayed "Mon-YY" label.  The grid then goes through IMP.fromGrid, the same
   extraction rules the dashboard was built with.  The last successful sync is
   kept in this browser (IndexedDB) so the dashboard can open at once; the sheet
   is then re-read and any change is offered as a reload.  Nothing else is ever
   used as data.
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util;
  const IMP = HPI.importer;
  let cfg = {};
  try { cfg = JSON.parse((document.getElementById('hpi-source') || {}).textContent || '{}'); } catch (e) { cfg = {}; }
  const SH = (HPI.sheet = {
    id: cfg.sheetId || '',
    gid: String(cfg.gid == null ? '0' : cfg.gid),
    title: cfg.title || 'Google Sheet',
    url: cfg.url || (cfg.sheetId ? `https://docs.google.com/spreadsheets/d/${cfg.sheetId}/edit` : ''),
    status: null, // { syncedAt, transport, fromCache, error, newer }
  });
  class SheetError extends Error {}
  SH.SheetError = SheetError;
  const base = () => `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SH.id)}`;

  /* ---------- gviz over JSONP ---------- */
  let seq = 0;
  function gviz(range, timeoutMs = 180000) {
    return new Promise((resolve, reject) => {
      const cb = '__hpiGviz' + Date.now().toString(36) + (++seq);
      const s = document.createElement('script');
      let done = false;
      const finish = (fn, v) => { if (done) return; done = true; clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); fn(v); };
      const timer = setTimeout(() => finish(reject, new SheetError('Google did not answer within ' + Math.round(timeoutMs / 1000) + ' seconds.')), timeoutMs);
      window[cb] = (d) => {
        if (!d || d.status === 'error') {
          const e = d && d.errors && d.errors[0];
          finish(reject, new SheetError('Google Sheets returned an error: ' + (e ? e.detailed_message || e.message || e.reason : 'unknown') + '.'));
        } else finish(resolve, d.table || { cols: [], rows: [] });
      };
      s.onerror = () => finish(reject, new SheetError('The Google Sheet could not be read. Check the internet connection, and that the sheet is shared as “Anyone with the link can view”.'));
      s.src = `${base()}/gviz/tq?headers=0&gid=${encodeURIComponent(SH.gid)}&range=${encodeURIComponent(range)}&tqx=responseHandler:${cb}&_=${Date.now()}`;
      document.head.appendChild(s);
    });
  }
  const DATE_RE = /^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+)(?:,(\d+))?)?\)$/;
  const cellValue = (c) => {
    if (!c || c.v == null) return null;
    const v = c.v;
    if (typeof v === 'string') {
      const m = DATE_RE.exec(v);
      if (m) return new Date(Date.UTC(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)));
    }
    return v;
  };
  const rowValues = (r, n, cell = cellValue) => {
    const a = new Array(n).fill(null);
    if (r && r.c) for (let i = 0; i < r.c.length && i < n; i++) a[i] = cell(r.c[i]);
    return a;
  };
  /* Month headers are read from the label the sheet displays ("Sep-26" = September 2026).
     Typed "Mon-YY" headers are turned into dates by Google Sheets with the YY taken as the
     day of the current year ("Jun-18" → 18 June 2026), so the stored date is not the month. */
  const MONS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  const MONTH_LABEL = /^\s*([A-Za-z]{3})[A-Za-z]*[-\s'’/]+(\d{2}|\d{4})\s*$/;
  const headerValue = (c) => {
    if (!c) return null;
    for (const t of [c.f, typeof c.v === 'string' ? c.v : null]) {
      const m = t && MONTH_LABEL.exec(t);
      const mi = m ? MONS.indexOf(m[1].toLowerCase()) : -1;
      if (mi >= 0) return new Date(Date.UTC(m[2].length === 2 ? 2000 + +m[2] : +m[2], mi, 1));
    }
    return cellValue(c);
  };
  async function readGviz(progress) {
    const t0 = performance.now();
    await progress(4, 'Reading the band titles and column names from the Google Sheet…');
    const [t1, t2] = await Promise.all([gviz('A1:ZZZ1'), gviz('A2:ZZZ2')]);
    let ticking = true;
    const ticker = (async () => { while (ticking) { await progress(10 + Math.min(60, (performance.now() - t0) / 400), `Downloading the holdings from the Google Sheet… ${Math.round((performance.now() - t0) / 1000)} s`); await new Promise((r) => setTimeout(r, 500)); } })();
    let t3;
    try { t3 = await gviz('A3:ZZZ'); } finally { ticking = false; await ticker.catch(() => {}); }
    const ncols = Math.max(t1.cols.length, t2.cols.length, t3.cols.length);
    if (!ncols || !t2.rows.length) throw new SheetError('The Google Sheet is empty, or its first tab is not the portfolio-history layout.');
    const r1 = rowValues(t1.rows[0], ncols), r2 = rowValues(t2.rows[0], ncols, headerValue);
    const data = t3.rows;
    const rowArr = (excelRow) => rowValues(data[excelRow - 3], ncols);
    return { r1, r2, rowArr, lastRow: data.length + 2, ncols, transport: 'gviz' };
  }

  /** Read the sheet now → raw.  Throws SheetError with a readable message. */
  SH.fetch = async (progress = async () => {}) => {
    if (!SH.id) throw new SheetError('No Google Sheet is configured in this file.');
    const t0 = performance.now();
    const grid = await readGviz(progress);
    await progress(82, 'Applying the extraction rules…');
    const raw = await IMP.fromGrid(grid, {
      file: SH.title, sheet: 'Google Sheet tab gid ' + SH.gid, url: SH.url, sheetId: SH.id, gid: SH.gid,
      transport: grid.transport, bytes: grid.bytes || null,
      extractor: 'Google Sheet sync 1.0 (Google Sheets query)',
    }, async (pct, text) => progress(82 + pct * 0.15, text));
    raw.source.fetchMs = Math.round(performance.now() - t0);
    return raw;
  };

  /* ---------- last successful sync, kept in this browser ---------- */
  const DB = 'hpi-google-sheet', STORE = 'sync';
  const key = () => SH.id + '|' + SH.gid;
  function db() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('no IndexedDB'));
      const rq = indexedDB.open(DB, 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore(STORE);
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  }
  SH.cacheGet = async () => {
    try {
      const d = await db();
      return await new Promise((resolve) => {
        const rq = d.transaction(STORE, 'readonly').objectStore(STORE).get(key());
        rq.onsuccess = () => { const v = rq.result; resolve(v && v.raw && v.raw.format === 'hpi-raw-1' && v.raw.source && v.raw.source.sheetId === SH.id ? v : null); };
        rq.onerror = () => resolve(null);
      });
    } catch (e) { return null; }
  };
  SH.cachePut = async (raw) => {
    try {
      const d = await db();
      await new Promise((resolve) => {
        const tx = d.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({ raw, syncedAt: new Date().toISOString() }, key());
        tx.oncomplete = resolve; tx.onerror = resolve; tx.onabort = resolve;
      });
      return true;
    } catch (e) { return false; }
  };
  SH.cacheTouch = async () => { const c = await SH.cacheGet(); if (c) await SH.cachePut(c.raw); };
  SH.when = (iso) => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
})();

            sub: pv ? `Stocks only, compared with ${pv.label}${pv.gap ? ' (previous available month)' : ''}. Observed change in ${S.movBasis === 'qty' ? 'reported quantity' : 'allocation'} between month-end holdings — not confirmed transactions.` : 'This is the portfolio’s first month of data, so there is nothing to compare with.',
            actions: `<button type="button" class="btn sm" data-go='${JSON.stringify({ page: 'movements', tabs: Object.assign({}, S.tabs, { movements: 'monthly' }) })}'>${UI.icon('moves')}Open movements</button>`,
            body: mv.rows
              ? `<div class="chips" style="margin-bottom:10px">${['NEW', 'RE-ENTERED', 'INCREASED', 'REDUCED', 'EXITED', 'UNCHANGED'].map((s) => `<span class="ctx-chip">${UI.badge(s)} <span class="tnum" data-move-count="${s}">${cnt[s]}</span></span>`).join('')}</div><div class="split"><div id="ov-up"></div><div id="ov-down"></div></div>`
              : UI.empty('No earlier month to compare with.', ''),
          })}
        </div>`;

      // universe table
      const rows = M.portfolioOrder.map((pid) => {
        const P = M.portfolios[pid];
        const s = M.summary(pid, P.last);
        return { pid, name: P.name, first: P.first, last: P.last, months: P.avail.length, missing: P.missing.length, aum: s.aum, nEq: s.nEq, cash: s.cashW, top10: s.top10W, top1: s.top1 ? s.top1.w : null, top1n: s.top1 ? M.secName(s.top1.sec) : '' };
      });
      UI.table(document.getElementById('ov-universe'), {
        id: 'ov-universe',
        caption: 'Portfolio universe',
        rows,
        unit: 'portfolio',
        sort: { key: 'name', dir: 'asc' },
        search: (r) => r.name,
        searchPlaceholder: 'Filter portfolios…',
        exportName: 'Portfolio_universe',
        rowKey: (r) => r.pid,
        rowClass: (r) => (r.pid === S.pid ? 'sel' : ''),
        onRowClick: (r) => HPI.setState({ pid: r.pid, page: 'portfolio' }),
        columns: [
          { key: 'name', label: 'Portfolio', value: (r) => r.name, html: (r) => `<strong>${esc(r.name)}</strong>` },
          { key: 'first', label: 'First month', num: true, value: (r) => r.first, html: (r) => esc(M.months[r.first].label), csv: (r) => M.months[r.first].key },
          { key: 'last', label: 'Latest month', num: true, value: (r) => r.last, html: (r) => esc(M.months[r.last].label), csv: (r) => M.months[r.last].key },
          { key: 'months', label: 'Months with data', num: true, value: (r) => r.months, html: (r) => U.int(r.months) },
          { key: 'missing', label: 'Missing months', num: true, value: (r) => r.missing, html: (r) => (r.missing ? `<span class="neg">${r.missing}</span>` : '0') },
          { key: 'aum', label: 'Market value, latest (₹ cr)', num: true, value: (r) => r.aum, html: (r) => U.cr(r.aum) },
          { key: 'nEq', label: 'Equity holdings', num: true, value: (r) => r.nEq, html: (r) => U.int(r.nEq) },
          { key: 'cash', label: 'Cash & net assets', num: true, value: (r) => r.cash, html: (r) => U.pct(r.cash) },
          { key: 'top10', label: 'Top 10', num: true, value: (r) => r.top10, html: (r) => U.pct(r.top10) },
          { key: 'top1n', label: 'Largest holding', value: (r) => r.top1n, html: (r) => (r.top1n ? `${esc(U.shortName(r.top1n, 30))} <span class="muted tnum">${U.pct(r.top1)}</span>` : '—') },
        ],
      });

      // trend mini charts over the selected range
      const labels = K.labels(M, mis), titles = K.titles(M, mis), marker = K.marker(mis, S.mi);
      const sums = mis.map((mi) => M.summary(S.pid, mi));
      C.line(document.getElementById('ov-c1'), { labels, titles, unit: 'count', zero: false, markerIndex: marker, datasets: [{ label: 'Equity holdings', data: sums.map((s) => s.nEq), unit: 'count' }] });
      C.line(document.getElementById('ov-c2'), { labels, titles, unit: 'pct', markerIndex: marker, datasets: [{ label: 'Cash & net assets', data: sums.map((s) => s.cashW), color: C.color(4) }] });
      C.line(document.getElementById('ov-c3'), { labels, titles, unit: 'pct', zero: false, markerIndex: marker, datasets: [{ label: 'Top 10', data: sums.map((s) => s.top10W), color: C.color(3) }] });

      // largest allocation changes this month
      if (mv.rows) {
        const up = mv.rows.filter((r) => r.dW > 0).sort((a, b) => b.dW - a.dW).slice(0, 8);
        const down = mv.rows.filter((r) => r.dW < 0).sort((a, b) => a.dW - b.dW).slice(0, 8);
        const mini = (id, list, title) =>
          UI.table(document.getElementById(id), {
            id,
            caption: title,
            rows: list,
            pageSizes: [8],
            pageSize: 8,
            emptyTitle: 'No changes in this direction.',
            onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
            columns: [
              { key: 'name', label: title, value: (r) => r.name, html: (r) => UI.secCell(M, r.sec) },
              { key: 'st', label: 'Movement', value: (r) => K.statusOrder[r.status], html: (r) => UI.moveBadge(r, S.movBasis) },
              { key: 'wB', label: 'Allocation', num: true, value: (r) => r.wB, html: (r) => UI.pctCell(r.wB) },
              { key: 'dW', label: 'Allocation change', num: true, value: (r) => r.dW, html: (r) => UI.ppCell(r.dW) },
            ],
          });
        mini('ov-up', up, 'Largest allocation increases');
        mini('ov-down', down, 'Largest allocation decreases');
      }
    },
  };
})();

/* ---- 11_portfolio.js ---- */
/* =============================================================================
   11_portfolio.js — Historical portfolio: snapshot · timeline · ranks · heatmap
   ========================================================================== */
(function () {
  'use strict';
  const HPI = window.HPI;
  const U = HPI.util, UI = HPI.ui, K = HPI.kit, C = HPI.charts, SH = HPI.shell;
  const esc = U.esc;

  const CLASS_FILTERS = [
    { value: 'all', label: 'All positions', test: () => true },
    { value: 'EQ', label: 'Equity shares', test: (ps) => ps.cls === 'EQ' },
    { value: 'DEBT', label: 'Debt & money market', test: (ps) => ps.cls === 'DEBT' },
    { value: 'CASH', label: 'Cash & net assets', test: (ps) => ps.cls === 'CASH' },
    { value: 'DER', label: 'Derivatives', test: (ps) => ps.cls === 'DER' },
    { value: 'OTHER', label: 'Other instruments', test: (ps) => !['EQ', 'DEBT', 'CASH', 'DER'].includes(ps.cls) },
  ];

  HPI.pages.portfolio = {
    nav: 'Historical portfolio',
    title: 'Historical portfolio',
    icon: 'portfolio',
    purpose: 'Exactly what the portfolio held in any month, how it compares with the month before, and how its shape evolved over time.',
    render(root, S, M) {
      const tab = S.tabs.portfolio;
      root.innerHTML = `${SH.header('portfolio')}${SH.profile(S.pid, S.mi)}
        ${UI.tabs('portfolio', [{ id: 'snapshot', label: 'Month snapshot' }, { id: 'timeline', label: 'Timeline' }, { id: 'top', label: 'Top holdings & ranks' }, { id: 'heatmap', label: 'Heatmap' }], tab)}
        <div id="pf-body" role="tabpanel" aria-labelledby="tab-portfolio-${tab}"></div>`;
      const body = root.querySelector('#pf-body');
      ({ snapshot, timeline, top, heatmap }[tab] || snapshot)(body, S, M);
    },
  };

  /* ------------------------------------------------------------------ */
  function snapshot(body, S, M) {
    const mi = S.mi;
    const pv = SH.prevLabel(S.pid, mi);
    const prev = pv ? pv.prev : -1;
    const all = M.positions(S.pid, mi);
    const s = M.summary(S.pid, mi);
    const mv = M.movement(S.pid, mi, S.movBasis, 'all');
    const moveBy = new Map(mv.rows ? mv.rows.map((r) => [r.sec, r]) : []);
    const cnt = M.countStatus(mv.rows);
    const ranks = M.ranks(S.pid, mi);
    const ranksPrev = prev >= 0 ? M.ranks(S.pid, prev) : null;
    const chipOpts = CLASS_FILTERS.map((f) => ({ value: f.value, label: f.label, n: all.filter(f.test).length })).filter((o) => o.n > 0 || o.value === 'all');
    const f = CLASS_FILTERS.find((x) => x.value === S.snapFilter) || CLASS_FILTERS[0];
    const eq = M.scoped(S.pid, mi, 'eq');
    const eqW = s.eqW;
    const effN = s.hhiEq > 0 ? (eqW / 100) * (eqW / 100) / s.hhiEq : null;
    const vsText = pv ? `${pv.label}${pv.gap ? ' (the previous month with data)' : ''}` : 'nothing — this is the first month of data';

    body.innerHTML = `
      ${pv ? UI.notice('info', `Compared with <strong>${esc(pv.label)}</strong>${pv.gap ? ', the previous month with data' : ''}: ${cnt.NEW} new, ${cnt['RE-ENTERED']} re-entered, ${cnt.INCREASED} increased, ${cnt.REDUCED} reduced, ${cnt.EXITED} exited, ${cnt.UNCHANGED} unchanged (${S.movBasis === 'qty' ? 'by reported quantity' : 'by allocation'}; all positions). <button type="button" class="linkish" data-go='${JSON.stringify({ page: 'movements' })}'>See movements</button>`) : UI.notice('info', 'This is the first month of data for this portfolio, so there is no earlier month to compare with.')}
      <div class="grid">
        ${UI.card({ span: 4, title: 'Asset allocation', sub: `Source “Asset” field, ${esc(M.months[mi].label)}`, body: UI.chart('pf-asset', 'short', 'Asset allocation') + '<div id="pf-atype"></div>' })}
        ${UI.card({ span: 4, title: 'Sector allocation', sub: `Stocks only, % of fund — ${M.groupBy(S.pid, mi, 'sector', 'eq').length} sectors`, actions: `<button type="button" class="btn sm" data-go='${JSON.stringify({ page: 'sector' })}'>${UI.icon('sector')}Sector analysis</button>`, body: UI.chart('pf-sector', 'tall', 'Sector allocation') })}
        ${UI.card({
          span: 4,
          title: 'Market cap & concentration',
          sub: 'Stocks only, % of fund; labels as supplied in the source',
          actions: `<button type="button" class="btn sm" data-go='${JSON.stringify({ page: 'mcap' })}'>${UI.icon('mcap')}Market cap</button>`,
          body: `${UI.chart('pf-mcap', 'short', 'Market-cap allocation')}
            <dl class="stat-list" style="margin-top:12px" data-test="concentration">
              <dt>Largest holding</dt><dd>${s.top1 ? `${U.pct(s.top1.w)} <span class="muted">${esc(M.secName(s.top1.sec))}</span>` : '—'}</dd>
              <dt>Second largest</dt><dd>${s.top2 ? `${U.pct(s.top2.w)} <span class="muted">${esc(M.secName(s.top2.sec))}</span>` : '—'}</dd>
              <dt>Top 5 holdings</dt><dd>${U.pct(s.top5W)}${s.top5N < 5 ? ` <span class="muted">(${s.top5N} held)</span>` : ''}</dd>
              <dt>Top 10 holdings</dt><dd>${U.pct(s.top10W)}${s.top10N < 10 ? ` <span class="muted">(${s.top10N} held)</span>` : ''}</dd>
              <dt>Equity shares, total</dt><dd>${U.pct(eqW)} <span class="muted">in ${s.nEq} holdings</span></dd>
              <dt>Effective number of stocks${UI.infoBtn('<p>1 ÷ Σ w², using equity-share weights re-based to 100%. It equals the number of holdings if all were equally weighted; lower values mean a more concentrated equity book.</p>')}</dt><dd>${effN != null ? U.fmt(effN, 1) : '—'}</dd>
            </dl>`,
        })}
        ${UI.card({
          span: 12,
          title: `Holdings in ${esc(M.months[mi].label)}`,
          sub: `Every line reported for the month. Previous and change columns compare with ${esc(vsText)}. Rank is among equity shares.`,
          flush: true,
          body: `<div style="padding:0 16px 10px">${UI.chips('snapFilter', chipOpts, S.snapFilter, 'Filter by instrument class')}</div><div id="pf-holdings"></div>`,
        })}
      </div>`;

    // asset allocation (source Asset field) + asset type table
    const assets = M.groupBy(S.pid, mi, 'asset', 'all');
    const assetsPrev = prev >= 0 ? M.groupMap(S.pid, prev, 'asset', 'all') : null;
    C.bar(document.getElementById('pf-asset'), {
      labels: assets.map((e) => e.label),
      horizontal: true,
      unit: 'pct',
      datasets: [{ label: M.months[mi].label, data: assets.map((e) => e.w), color: C.A }, ...(assetsPrev ? [{ label: M.months[prev].label, data: assets.map((e) => (assetsPrev.get(e.key) ? assetsPrev.get(e.key).w : 0)), color: '#b8c7e6' }] : [])],
    });
    const at = M.groupBy(S.pid, mi, 'assetType', 'all');
    const atPrev = prev >= 0 ? M.groupMap(S.pid, prev, 'assetType', 'all') : null;
    UI.table(document.getElementById('pf-atype'), {
      id: 'pf-atype',
      caption: 'Asset Type allocation',
      rows: at,
      pageSizes: [50],
      pageSize: 50,
      sort: { key: 'w', dir: 'desc' },
      exportName: K.exp(M, S.pid, 'asset_types', K.key(M, mi)),
      columns: [
        { key: 'label', label: 'Asset Type', value: (r) => r.label },
        { key: 'w', label: 'Allocation', num: true, value: (r) => r.w, html: (r) => U.pct(r.w) },
        { key: 'dw', label: 'Allocation change', num: true, value: (r) => (atPrev ? r.w - (atPrev.get(r.key) ? atPrev.get(r.key).w : 0) : null), html: (r) => (atPrev ? UI.ppCell(r.w - (atPrev.get(r.key) ? atPrev.get(r.key).w : 0)) : '—') },
        { key: 'n', label: 'Lines', num: true, value: (r) => r.n, html: (r) => U.int(r.n) },
      ],
    });
    const sec = M.groupBy(S.pid, mi, 'sector', 'eq').slice(0, 14);
    C.bar(document.getElementById('pf-sector'), {
      labels: sec.map((e) => e.label),
      horizontal: true,
      unit: 'pct',
      labelMax: 22,
      datasets: [{ label: 'Allocation', data: sec.map((e) => e.w), color: C.A }],
      onClick: (i) => HPI.setState({ page: 'sector', sector: sec[i].key, tabs: Object.assign({}, S.tabs, { sector: 'detail' }) }),
    });
    const mc = M.groupBy(S.pid, mi, 'mcap', 'eq');
    C.bar(document.getElementById('pf-mcap'), {
      labels: mc.map((e) => e.label),
      unit: 'pct',
      horizontal: true,
      datasets: [{ label: 'Allocation', data: mc.map((e) => e.w), color: C.A }],
      onClick: (i) => HPI.setState({ page: 'mcap', mcapCat: mc[i].key }),
    });

    // holdings table
    const rows = all.filter(f.test).map((ps) => {
      const pp = prev >= 0 ? M.pos(S.pid, prev, ps.sec) : undefined;
      return { sec: ps.sec, ps, pp, rank: ranks.get(ps.sec) || null, prevRank: ranksPrev ? ranksPrev.get(ps.sec) || null : null, mv: moveBy.get(ps.sec) };
    });
    UI.table(document.getElementById('pf-holdings'), {
      id: 'pf-holdings',
      caption: `Holdings in ${M.months[mi].label}`,
      rows,
      unit: 'position',
      sort: { key: 'w', dir: 'desc' },
      search: (r) => M.secName(r.sec) + ' ' + M.isinText(r.sec) + ' ' + (r.ps.sector || ''),
      searchPlaceholder: 'Search name, ISIN or sector…',
      exportName: K.exp(M, S.pid, 'holdings', K.key(M, mi)),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [
        { key: 'rank', label: 'Rank', num: true, value: (r) => r.rank, html: (r) => (r.rank ? '#' + r.rank : UI.na()), title: 'Rank among equity shares by allocation' },
        K.secCol(M, { sticky: false }),
        K.isinCol(M),
        { key: 'assetType', label: 'Asset Type', value: (r) => r.ps.assetType || '', html: (r) => esc(r.ps.assetType || '—') },
        { key: 'sector', label: 'Sector', value: (r) => r.ps.sector || '', html: (r) => esc(r.ps.sector || '—') },
        { key: 'mcap', label: 'Market cap', value: (r) => r.ps.mcap || '', html: (r) => (r.ps.mcap ? esc(r.ps.mcap) : '<span class="faint">(blank)</span>') },
        K.pctCol('w', 'Allocation', (r) => r.ps.w),
        { key: 'wp', label: 'Previous', num: true, value: (r) => (r.pp ? r.pp.w : null), html: (r) => (prev < 0 ? UI.noData('No earlier month') : r.pp ? UI.pctCell(r.pp.w) : UI.notHeld()), csv: (r) => (r.pp ? r.pp.w : '') },
        { key: 'dw', label: 'Allocation change', num: true, value: (r) => (prev < 0 ? null : r.ps.w - (r.pp ? r.pp.w : 0)), html: (r) => (prev < 0 ? '—' : UI.ppCell(r.ps.w - (r.pp ? r.pp.w : 0))), csv: (r) => (prev < 0 ? '' : r.ps.w - (r.pp ? r.pp.w : 0)) },
        { key: 'qty', label: 'Quantity', num: true, value: (r) => r.ps.qty, html: (r) => U.qty(r.ps.qty) },
        { key: 'rq', label: 'Qty change %', num: true, value: (r) => (r.mv ? r.mv.relQ : null), html: (r) => (r.mv && r.mv.relQ != null ? UI.chgCell(r.mv.relQ) : '<span class="faint">—</span>'), title: 'Change in reported quantity vs the previous month (%)' },
        { key: 'mvv', label: 'Market value', num: true, value: (r) => r.ps.mv, html: (r) => U.cr(r.ps.mv) },
        { key: 'px', label: 'Price', num: true, value: (r) => r.ps.px, html: (r) => U.price(r.ps.px) },
        { key: 'status', label: 'Movement', value: (r) => (r.mv ? K.statusOrder[r.mv.status] : 99), html: (r) => (r.mv ? UI.moveBadge(r.mv, S.movBasis) : '—'), csv: (r) => (r.mv ? r.mv.status : '') },
        { key: 'lin', label: 'Source', sortable: false, csv: false, html: (r) => UI.linBtn(S.pid, mi, r.sec) },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function timeline(body, S, M) {
    const mis = K.months(M, S);
    const labels = K.labels(M, mis), titles = K.titles(M, mis), marker = K.marker(mis, S.mi);
    const sums = mis.map((mi) => M.summary(S.pid, mi));
    const range = `${M.months[S.from].label} – ${M.months[S.to].label}`;
    let tl = S.tlSecs && S.tlSecs.length ? S.tlSecs : (M.scoped(S.pid, S.mi, 'eq') || []).slice(0, 5).map((p) => p.sec);
    const tlDefault = !(S.tlSecs && S.tlSecs.length);
    body.innerHTML = `<div class="grid">
      ${UI.card({ span: 6, title: 'Number of holdings', sub: range, body: UI.chart('tl-count', '', 'Number of holdings over time') })}
      ${UI.card({ span: 6, title: 'Concentration', sub: `Largest, top 5 and top 10 equity holdings, % of fund`, body: UI.chart('tl-conc', '', 'Concentration over time') })}
      ${UI.card({ span: 6, title: 'Asset composition', sub: 'Source “Asset” field, % of fund', body: UI.chart('tl-asset', '', 'Asset composition over time') })}
      ${UI.card({ span: 6, title: 'Cash & net assets', sub: '% of fund', actions: `<button type="button" class="btn sm" data-go='${JSON.stringify({ page: 'cash' })}'>${UI.icon('cash')}Cash analysis</button>`, body: UI.chart('tl-cash', '', 'Cash and net assets over time') })}
      ${UI.card({ span: 6, title: 'Sector composition', sub: 'Stocks only, % of fund; eight largest sectors in the range', body: UI.chart('tl-sector', 'tall', 'Sector composition over time') })}
      ${UI.card({ span: 6, title: 'Market-cap composition', sub: 'Stocks only, % of fund; labels as supplied', body: UI.chart('tl-mcap', 'tall', 'Market-cap composition over time') })}
      ${UI.card({
        span: 12,
        title: 'Individual stock weights',
        sub: tlDefault ? `Showing the five largest holdings in ${M.months[S.mi].label}. Add or remove stocks to compare.` : 'Selected stocks, % of fund. Gaps mean the stock was not held that month.',
        body: `<div class="toolbar"><div id="tl-add"></div><div class="chips">${tl.map((sid) => `<button type="button" class="chip" data-go='${JSON.stringify({ tlSecs: tl.filter((x) => x !== sid) })}' aria-label="Remove ${esc(M.secName(sid))}">${esc(U.shortName(M.secName(sid), 30))} ✕</button>`).join('')}</div></div>${UI.chart('tl-stocks', 'tall', 'Selected stock weights over time')}`,
      })}
      ${UI.card({ span: 12, title: 'Portfolio statistics by month', sub: range, flush: true, body: '<div id="tl-table"></div>' })}
    </div>`;
    C.line(document.getElementById('tl-count'), { labels, titles, unit: 'count', zero: false, markerIndex: marker, datasets: [{ label: 'Equity holdings', data: sums.map((s) => s.nEq) }, { label: 'All positions', data: sums.map((s) => s.nAll), dash: [5, 4], color: '#6b7c93' }] });

    const ac = K.compose(M, S.pid, mis, 'asset', 'all', 'fund');
    C.stack(document.getElementById('tl-asset'), { labels, titles, unit: 'pct', markerIndex: marker, datasets: K.topDatasets(M, ac, 6, 'asset', 'Other') });
    C.line(document.getElementById('tl-cash'), { labels, titles, unit: 'pct', markerIndex: marker, datasets: [{ label: 'Cash & net assets', data: sums.map((s) => s.cashW), color: C.color(4), fill: true }] });
    const sc = K.compose(M, S.pid, mis, 'sector', 'eq', 'fund');
    C.stack(document.getElementById('tl-sector'), { labels, titles, unit: 'pct', markerIndex: marker, datasets: K.topDatasets(M, sc, 8, 'sector', 'Other sectors') });
    const mc = K.compose(M, S.pid, mis, 'mcap', 'eq', 'fund');
    C.stack(document.getElementById('tl-mcap'), { labels, titles, unit: 'pct', markerIndex: marker, datasets: K.topDatasets(M, mc, 8, 'mcap', 'Other') });
    UI.combo(document.getElementById('tl-add'), {
      id: 'tl-combo',
      label: 'Add a stock to the chart',
      placeholder: 'Add a stock…',
      items: K.securityItems(M, S.pid, S.mi).filter((it) => !tl.includes(it.id)),
      value: null,
      onSelect: (sid) => HPI.setState({ tlSecs: [...tl, sid].slice(0, 8) }),
    });
    C.line(document.getElementById('tl-stocks'), {
      labels, titles, unit: 'pct', markerIndex: marker,
      datasets: tl.map((sid, i) => ({ label: M.secName(sid), data: mis.map((mi) => { const ps = M.pos(S.pid, mi, sid); return ps ? ps.w : null; }), color: C.color(i) })),
    });
    const trows = mis.slice().reverse().map((mi) => ({ mi, s: M.summary(S.pid, mi) }));
    UI.table(document.getElementById('tl-table'), {
      id: 'tl-table',
      caption: 'Portfolio statistics by month',
      rows: trows,
      unit: 'month',
      sort: { key: 'mi', dir: 'desc' },
      exportName: K.exp(M, S.pid, 'monthly_statistics', K.key(M, S.from), K.key(M, S.to)),

        { key: 'aum', label: 'Market value', num: true, value: (r) => r.s.aum, html: (r) => U.cr(r.s.aum) },
      ],

  /* ------------------------------------------------------------------ */
  function top(body, S, M) {
    const mi = S.mi;
    const pv = SH.prevLabel(S.pid, mi);
    const prev = pv ? pv.prev : -1;
    const eq = M.scoped(S.pid, mi, 'eq');
    const rp = prev >= 0 ? M.ranks(S.pid, prev) : null;
    const nSel = S.topN === 'all' ? eq.length : +(S.topN || 10);
    const mis = K.months(M, S).slice().reverse();
    const depth = 10;
    body.innerHTML = `<div class="grid">
      ${UI.card({
        span: 12,
        title: `Top holdings in ${esc(M.months[mi].label)}`,
        sub: `Equity shares ranked by allocation.${pv ? ` Rank change compares with ${esc(pv.label)}.` : ''}`,
        actions: UI.seg('topN', 'Show', [{ value: '10', label: 'Top 10' }, { value: '20', label: 'Top 20' }, { value: '50', label: 'Top 50' }, { value: 'all', label: 'All' }], S.topN || '10'),
        flush: true,
        body: '<div id="top-table"></div>',
      })}
      ${UI.card({
        span: 12,
        title: 'Portfolio leadership by month',
        sub: `The ${depth} largest equity holdings in every month of the range, newest first. ${S.sec != null && M.sec(S.sec).cls === 'EQ' ? `Cells for ${esc(M.secName(S.sec))} are highlighted.` : 'Select a stock on the Stock analysis page to highlight it.'}`,
        actions: K.csvBtn(K.exp(M, S.pid, 'rank_history', K.key(M, S.from), K.key(M, S.to)), ['Month', ...Array.from({ length: depth }, (_, i) => `Rank ${i + 1}`), ...Array.from({ length: depth }, (_, i) => `Rank ${i + 1} allocation %`)], mis.map((m) => {
          const e = M.scoped(S.pid, m, 'eq').slice(0, depth);
          return [M.months[m].key, ...Array.from({ length: depth }, (_, i) => (e[i] ? M.secName(e[i].sec) : '')), ...Array.from({ length: depth }, (_, i) => (e[i] ? e[i].w : ''))];
        })),
        flush: true,
        body: `<div class="table-wrap limit"><table class="dt" data-test="rank-matrix"><caption class="visually-hidden">Top holdings by month</caption><thead><tr><th scope="col" class="sticky">Month</th>${Array.from({ length: depth }, (_, i) => `<th scope="col">Rank ${i + 1}</th>`).join('')}</tr></thead><tbody>${mis
          .map((m) => {
            const e = M.scoped(S.pid, m, 'eq').slice(0, depth);
            return `<tr${m === mi ? ' class="sel"' : ''}><th scope="row" class="sticky">${esc(M.months[m].label)}</th>${Array.from({ length: depth }, (_, i) =>
              e[i] ? `<td style="${e[i].sec === S.sec ? 'background:var(--accent-soft);font-weight:700' : ''}"><button type="button" class="linkish" style="font-weight:inherit;color:var(--ink)" data-open-sec="${e[i].sec}" title="${esc(M.secName(e[i].sec))}">${esc(U.shortName(M.secName(e[i].sec), 20))}</button><br><span class="muted tnum">${U.pct(e[i].w)}</span></td>` : '<td class="faint">—</td>'

      })}

    const rows = eq.slice(0, nSel).map((ps, i) => {
      const pp = prev >= 0 ? M.pos(S.pid, prev, ps.sec) : undefined;
      return { sec: ps.sec, ps, rank: i + 1, prevRank: rp ? rp.get(ps.sec) || null : null, pp };
    });
    UI.table(document.getElementById('top-table'), {
      id: 'top-table',
      caption: 'Top holdings',
      rows,
      unit: 'holding',
      pageSize: 50,
      sort: { key: 'rank', dir: 'asc' },
      exportName: K.exp(M, S.pid, 'top_holdings', K.key(M, mi)),
      onRowClick: (r) => HPI.setState({ sec: r.sec, page: 'stock' }),
      columns: [

        K.isinCol(M),
        K.pctCol('w', 'Allocation', (r) => r.ps.w),
        { key: 'prevRank', label: 'Previous rank', num: true, value: (r) => r.prevRank, html: (r) => (prev < 0 ? UI.noData('No earlier month') : r.prevRank ? '#' + r.prevRank : UI.notHeld()) },
        { key: 'rc', label: 'Rank change', num: true, value: (r) => (r.prevRank ? r.prevRank - r.rank : null), html: (r) => (r.prevRank ? (r.prevRank - r.rank > 0 ? `<span class="pos">▲ ${r.prevRank - r.rank}</span>` : r.prevRank - r.rank < 0 ? `<span class="neg">▼ ${r.rank - r.prevRank}</span>` : '<span class="muted">0</span>') : '<span class="faint">—</span>'), title: 'Places moved up (▲) or down (▼)' },

        { key: 'sector', label: 'Sector', value: (r) => r.ps.sector || '', html: (r) => esc(r.ps.sector || '—') },
        { key: 'mcap', label: 'Market cap', value: (r) => r.ps.mcap || '', html: (r) => esc(r.ps.mcap || '(blank)') },
      ],

  /* ------------------------------------------------------------------ */
  function heatmap(body, S, M) {
    const mis = K.months(M, S);
    const metric = S.heatMetric === 'rank' ? 'rank' : 'w';
    const set = new Set();
    for (const mi of mis) for (const ps of M.scoped(S.pid, mi, 'eq')) set.add(ps.sec);
    const order = Array.from(set).map((sid) => {
      const ser = M.series(S.pid, sid);
      let mx = -Infinity;
      for (const mi of mis) if (U.isNum(ser.w[mi]) && ser.w[mi] > mx) mx = ser.w[mi];
      const now = U.isNum(ser.w[S.to]) ? ser.w[S.to] : -1;
      return { sid, ser, mx, now };
    });
    order.sort((a, b) => b.now - a.now || b.mx - a.mx || M.secName(a.sid).localeCompare(M.secName(b.sid)));
    const limit = S.heatRows === 'all' ? order.length : +(S.heatRows || 40);
    const shown = order.slice(0, limit);
    let max = 0;
    for (const o of shown) for (const mi of mis) { const v = o.ser.w[mi]; if (U.isNum(v) && v > max) max = v; }
    const rows = shown.map((o) => ({
      key: o.sid,
      label: `<button type="button" class="linkish" style="color:var(--ink)" data-open-sec="${o.sid}">${esc(U.shortName(M.secName(o.sid), 34))}</button>`,
      cells: mis.map((mi) => {
        const st = o.ser.state[mi];
        if (st === 0) return { kind: 'na' };
        if (st === 1) return { kind: 'nh' };
        if (metric === 'rank') { const r = M.rank(S.pid, mi, o.sid); return { kind: 'v', v: r, text: '#' + r }; }
        return { kind: 'v', v: o.ser.w[mi], text: U.fmt(o.ser.w[mi], 2) };
      }),
    }));
    const nRank = shown.length ? Math.max(...shown.map((o) => Math.max(...mis.map((mi) => M.rank(S.pid, mi, o.sid) || 0)))) : 1;
    body.innerHTML = UI.card({
      title: metric === 'rank' ? 'Rank by month' : 'Allocation by month',
      sub: `${shown.length} of ${order.length} stocks held in the range, ordered by allocation in ${esc(M.months[S.to].label)}. ${metric === 'rank' ? 'Darker = higher rank (1 = largest).' : 'Values are % of fund; darker = larger.'} “–” not held, “·” no data.`,
      actions: `${UI.seg('heatMetric', 'Show', [{ value: 'w', label: 'Allocation' }, { value: 'rank', label: 'Rank' }], metric)} ${UI.seg('heatRows', 'Rows', [{ value: '25', label: '25' }, { value: '40', label: '40' }, { value: '100', label: '100' }, { value: 'all', label: 'All' }], S.heatRows || '40')} ${K.csvBtn(K.exp(M, S.pid, metric === 'rank' ? 'rank_heatmap' : 'allocation_heatmap', K.key(M, S.from), K.key(M, S.to)), ['Security', 'ISIN', ...mis.map((mi) => M.months[mi].key)], order.map((o) => [M.secName(o.sid), M.isinText(o.sid), ...mis.map((mi) => (o.ser.state[mi] === 2 ? (metric === 'rank' ? M.rank(S.pid, mi, o.sid) : o.ser.w[mi]) : o.ser.state[mi] === 1 ? 'not held' : 'no data'))]))}`,
      flush: true,
      body:
        `<div class="heat-legend"><span>${metric === 'rank' ? `#${nRank}` : '0%'}</span><span class="ramp"></span><span>${metric === 'rank' ? '#1' : U.pct(max)}</span><span><span class="sw" style="background:#fafbfc;border:1px solid #e3e8ef"></span>Not held</span></div>` +
        UI.heatmap({ rows, cols: mis, max: metric === 'rank' ? 1 : max, color: metric === 'rank' ? (v) => UI.heatColor(nRank + 1 - v, nRank) : null, caption: 'Stock heatmap', rowLabel: 'Stock' }),
    });
    if (metric === 'rank') {
      // text colour for dark rank cells
      body.querySelectorAll('td.hc.num').forEach((td) => { const r = +td.textContent.slice(1); if (r && r <= nRank * 0.4) td.style.color = '#fff'; });
    }
    body.querySelectorAll('[data-heat-row]').forEach((tr) => tr.addEventListener('click', (e) => { if (!e.target.closest('button')) HPI.setState({ sec: +tr.getAttribute('data-heat-row'), page: 'stock' }); }));
  }
})();

    }
    return out;
  }

        px: { label: 'Price (adjusted)', unit: 'price', values: mis.map((mi) => U.isNum(ser.px[mi]) ? ser.px[mi] : null) },
      };
      const portfolioKeys = M.portfolioOrder.filter((otherPid) => otherPid !== pid && M.series(otherPid, sid).count > 0).map((otherPid) => 'pf:' + otherPid);
      for (const key of portfolioKeys) {
        const otherPid = Number(key.slice(3));
        const os = M.series(otherPid, sid);
        customDefs[key] = { label: M.pName(otherPid), unit: 'pct', values: mis.map((m) => os.state[m] === 2 ? os.w[m] : null) };
      }
      // Custom is intentionally limited to change/rank/quantity/value/price plus other portfolios.
      // Absolute allocation already has its own dedicated chart view.
      const allowedCustomKeys = ['rel', 'rank', 'qty', 'mv', 'px'];
      const savedMetrics = Array.isArray(S.stockCustom) ? S.stockCustom.filter((key) => allowedCustomKeys.includes(key)) : [];
      const customPortfolioSelected = Array.isArray(S.stockCustomPortfolios) ? S.stockCustomPortfolios.filter((key) => portfolioKeys.includes('pf:' + key) || portfolioKeys.includes(key)) : [];
      const normalizedPortfolioSelected = customPortfolioSelected.map((key) => String(key).startsWith('pf:') ? String(key).slice(3) : String(key));
      const selectedKeys = new Set(savedMetrics.concat(normalizedPortfolioSelected.map((p) => 'pf:' + p)));
      const axisColors = (i) => C.color(i + 1);
      const activeCustomKeys = secondary === 'custom' ? savedMetrics.concat(normalizedPortfolioSelected.map((p) => 'pf:' + p)).filter((key) => customDefs[key]) : [];
      const unitAxis = new Map();
      let nextAxis = 2;
      activeCustomKeys.forEach((key) => {
        const d = customDefs[key];
        if (!d) return;
        // every allocation series shares the main allocation axis; each other measure gets its own axis
        if (!unitAxis.has(d.unit)) unitAxis.set(d.unit, d.unit === 'pct' ? 'y' : 'y' + (nextAxis++));
      });
      const chartOpts = {
        labels,
        titles,
        unit: 'pct',
        axisTitles: true,
        markerIndex: marker,
        datasets: secondary === 'custom' ? [] : [{ label: 'Allocation', data: alloc, color: C.A, fill: true, fillColor: 'rgba(36,86,214,0.10)', points: mis.length <= 60 }],
        onClick: (i) => HPI.setState({ mi: mis[i] })
      };
      if (secondary !== 'custom') {
        if (secondary === 'rank') { chartOpts.datasets.push({ label: 'Rank', data: customDefs.rank.values, axis: 'y2', color: C.B, unit: 'rank', reverse: true, stepped: true }); chartOpts.unit2 = 'rank'; chartOpts.reverse2 = true; }
        if (secondary === 'qty') { chartOpts.datasets.push({ label: 'Quantity', data: customDefs.qty.values, axis: 'y2', color: C.B, unit: 'qty', stepped: true }); chartOpts.unit2 = 'qty'; }
        if (secondary === 'mv') { chartOpts.datasets.push({ label: 'Market value', data: customDefs.mv.values, axis: 'y2', color: C.B, unit: 'cr' }); chartOpts.unit2 = 'cr'; }
        if (secondary === 'px') { chartOpts.datasets.push({ label: 'Price (adjusted)', data: customDefs.px.values, axis: 'y2', color: C.B, unit: 'price' }); chartOpts.unit2 = 'price'; }
        if (secondary === 'allocation') { chartOpts.datasets = [{ label: 'Allocation', data: alloc, color: C.A, fill: true, fillColor: 'rgba(36,86,214,0.10)', points: mis.length <= 60 }]; }
      }
      activeCustomKeys.forEach((key, i) => {
        const d = customDefs[key];
        chartOpts.datasets.push({ label: d.label, data: d.values, axis: unitAxis.get(d.unit), color: d.color || axisColors(i), unit: d.unit, reverse: !!d.reverse, stepped: !!d.stepped });
      });
      if (activeCustomKeys.length) {
        const units = Array.from(new Set(activeCustomKeys.map((key) => customDefs[key].unit)));
        if (units.includes('rank')) { chartOpts.unit2 = 'rank'; chartOpts.reverse2 = true; }
        else if (units.length) chartOpts.unit2 = units.find((u) => u !== 'pct') || null;
      }
      C.line(document.getElementById('st-chart'), chartOpts);

      const customWrap = root.querySelector('#st-custom-wrap');
      if (customWrap) {
        if (secondary === 'custom') {
          const item = (key) => { const d = customDefs[key]; return `<button type="button" class="custom-series ${selectedKeys.has(key) ? 'selected' : ''}" aria-pressed="${selectedKeys.has(key)}" data-stock-custom="${esc(key)}"><span>${esc(d.label)}</span><span>${selectedKeys.has(key) ? '✓' : '+'}</span></button>`; };
          const pfButtons = portfolioKeys.length ? portfolioKeys.map((key) => item(key)).join('') : '<span class="muted">No other portfolio has held this security.</span>';
          customWrap.innerHTML = `<div class="stock-custom-builder"><div class="stock-custom-head"><div><strong>Custom chart</strong><span class="muted">Choose the series to plot. Allocations share the left axis; every other measure gets its own axis.</span></div><div class="stock-custom-actions"><button type="button" class="btn sm" data-stock-custom-all="${sid}">All</button><button type="button" class="btn sm" data-stock-custom-none>Clear</button></div></div><div class="stock-custom-section"><span class="stock-custom-label">Metrics</span><div class="stock-custom-grid">${allowedCustomKeys.map(item).join('')}</div></div><div class="stock-custom-section"><span class="stock-custom-label">This security in other portfolios</span><div class="stock-custom-grid">${pfButtons}</div></div></div>`;
        } else customWrap.innerHTML = '';
      }

      const body = root.querySelector('#st-body');
      ({ monthly, history, month, compare, funds }[tab] || monthly)(body, S, M, sid, mis);
    },
  };

  /* ------------------------------------------------------------------ */
  function monthly(body, S, M, sid, mis) {
    const pid = S.pid;
    const sec = M.sec(sid);
    const rows = mis.slice().reverse().map((mi) => {
      const prev = M.prevAvail(pid, mi);
      const ps = M.pos(pid, mi, sid);
      const pp = prev >= 0 ? M.pos(pid, prev, sid) : undefined;
      return { mi, prev, ps, pp, st: prev >= 0 ? M.statusOf(pid, sid, prev, mi, S.movBasis) : null, rank: M.rank(pid, mi, sid) };
    });
    body.innerHTML = UI.card({ title: 'Month-by-month position', sub: `Every available month in the range, newest first. Status compares each month with the previous available month (${S.movBasis === 'qty' ? 'by reported quantity' : 'by allocation'}); it is an observed change, not a confirmed trade.`, flush: true, body: '<div id="st-monthly"></div>' });
    UI.table(document.getElementById('st-monthly'), {
      id: 'st-monthly',
      caption: 'Monthly position',
      rows,
      unit: 'month',
      sort: { key: 'mi', dir: 'desc' },
      pageSize: 50,
      exportName: K.exp(M, pid, U.shortName(sec.name, 30), 'history', K.key(M, S.from), K.key(M, S.to)),
      rowClass: (r) => (r.mi === S.mi ? 'sel' : ''),
      columns: [
        { key: 'mi', label: 'Month', value: (r) => r.mi, html: (r) => esc(M.months[r.mi].label), csv: (r) => M.months[r.mi].key },
        { key: 'st', label: 'Status', value: (r) => (r.st ? K.statusOrder[r.st.status] : 99), html: (r) => (r.st ? UI.moveBadge(r.st, S.movBasis) : r.ps ? '<span class="muted">First month</span>' : UI.notHeld()), csv: (r) => (r.st ? r.st.status : r.ps ? 'FIRST MONTH' : 'NOT HELD') },
        K.pctCol('w', 'Allocation', (r) => (r.ps ? r.ps.w : null)),
        { key: 'wp', label: 'Previous', num: true, value: (r) => (r.pp ? r.pp.w : null), html: (r) => (r.prev < 0 ? UI.noData('No earlier month') : r.pp ? UI.pctCell(r.pp.w) : UI.notHeld()), csv: (r) => (r.pp ? r.pp.w : '') },
        { key: 'dw', label: 'Allocation change', num: true, value: (r) => (r.prev < 0 || (!r.ps && !r.pp) ? null : (r.ps ? r.ps.w : 0) - (r.pp ? r.pp.w : 0)), html: (r) => (r.prev < 0 || (!r.ps && !r.pp) ? '—' : UI.ppCell((r.ps ? r.ps.w : 0) - (r.pp ? r.pp.w : 0))) },
        { key: 'rw', label: 'Relative change', num: true, value: (r) => (r.ps && r.pp ? U.relChange(r.pp.w, r.ps.w) : null), html: (r) => (r.ps && r.pp ? UI.chgCell(U.relChange(r.pp.w, r.ps.w)) : '<span class="faint">—</span>'), title: 'Relative change in allocation' },
        { key: 'rank', label: 'Rank', num: true, value: (r) => r.rank, html: (r) => (r.rank ? '#' + r.rank : sec.cls === 'EQ' ? '—' : UI.na()) },
        { key: 'qty', label: 'Quantity', num: true, value: (r) => (r.ps ? r.ps.qty : null), html: (r) => (r.ps ? U.qty(r.ps.qty) : '—') },
        { key: 'rq', label: 'Qty change %', num: true, value: (r) => (r.ps && r.pp && r.ps.qty != null && r.pp.qty != null ? U.relChange(r.pp.qty, r.ps.qty) : null), html: (r) => (r.ps && r.pp && r.ps.qty != null && r.pp.qty != null ? UI.chgCell(U.relChange(r.pp.qty, r.ps.qty)) : '<span class="faint">—</span>') },
        { key: 'mv', label: 'Market value', num: true, value: (r) => (r.ps ? r.ps.mv : null), html: (r) => (r.ps ? U.cr(r.ps.mv) : '—') },
        { key: 'px', label: 'Price', num: true, value: (r) => (r.ps ? r.ps.px : null), html: (r) => (r.ps ? U.price(r.ps.px) : '—') },
        { key: 'lin', label: 'Source', sortable: false, csv: false, html: (r) => (r.ps ? UI.linBtn(pid, r.mi, sid) : '') },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function history(body, S, M, sid) {
    const pid = S.pid;
    const ser = M.series(pid, sid);
    const avail = M.avail(pid);
    const runs = M.runs(pid, sid);
    const since = avail.filter((mi) => mi >= ser.first);
    const events = [];
    let prev = -1;
    for (const mi of avail) {
      if (prev >= 0) {
        const st = M.statusOf(pid, sid, prev, mi, 'qty');
        if (st && (st.status === 'NEW' || st.status === 'RE-ENTERED' || st.status === 'EXITED')) events.push({ mi, prev, status: st.status });
      } else if (ser.state[mi] === 2) events.push({ mi, prev: -1, status: 'FIRST' });
      prev = mi;
    }
    let peak = null, inc = null, dec = null;
    for (const mi of avail) {
      const w = ser.state[mi] === 2 ? ser.w[mi] : null;
      if (w != null && (!peak || w > peak.w)) peak = { w, mi };
      const p = M.prevAvail(pid, mi);
      if (p >= 0 && (ser.state[mi] === 2 || ser.state[p] === 2)) {
        const d = (ser.state[mi] === 2 ? ser.w[mi] : 0) - (ser.state[p] === 2 ? ser.w[p] : 0);
        if (!inc || d > inc.d) inc = { d, mi };
        if (!dec || d < dec.d) dec = { d, mi };
      }
    }
    const longest = runs.reduce((a, r) => (r.n > (a ? a.n : 0) ? r : a), null);
    const reentries = events.filter((e) => e.status === 'RE-ENTERED').length;
    const w = (mi) => (ser.state[mi] === 2 ? U.pct(ser.w[mi]) : UI.notHeld());
    body.innerHTML = `<div class="grid">
      ${UI.card({
        span: 5,
        title: 'Consistency of holding',
        sub: 'Observed presence across the portfolio’s months with data',
        body: `<dl class="stat-list" data-test="consistency">
            <dt>First observed</dt><dd>${esc(M.months[ser.first].label)}</dd>
            <dt>Last observed</dt><dd>${esc(M.months[ser.last].label)}${ser.last === avail[avail.length - 1] ? ' <span class="muted">(latest month)</span>' : ''}</dd>
            <dt>Months held</dt><dd>${ser.count} of ${since.length} available since first observed (${U.fmt((ser.count / since.length) * 100, 1)}%)</dd>
            <dt>Holding periods</dt><dd>${runs.length}</dd>
            <dt>Re-entries</dt><dd>${reentries}</dd>
            <dt>Longest continuous period</dt><dd>${longest ? `${longest.n} months (${esc(M.months[longest.start].label)} – ${esc(M.months[longest.end].label)})` : '—'}</dd>
            <dt>Peak allocation</dt><dd>${peak ? `${U.pct(peak.w)} in ${esc(M.months[peak.mi].label)}` : '—'}</dd>
            <dt>Largest one-month increase</dt><dd>${inc && inc.d > 0 ? `${U.pp(inc.d)} in ${esc(M.months[inc.mi].label)}` : '—'}</dd>
            <dt>Largest one-month decrease</dt><dd>${dec && dec.d < 0 ? `${U.pp(dec.d)} in ${esc(M.months[dec.mi].label)}` : '—'}</dd>
          </dl>
          <div style="margin-top:14px"><div class="muted" style="font-size:.8rem">Whole history, ${esc(M.months[avail[0]].label)} – ${esc(M.months[avail[avail.length - 1]].label)}</div>${UI.presence(ser, avail)}${UI.presenceLegend()}</div>`,
      })}
      ${UI.card({ span: 7, title: 'Entries, exits and re-entries', sub: 'Observed from month-end holdings (not confirmed transactions)', body: `<ul class="events" data-test="events">${events
        .map((e) => {
          const label = e.status === 'FIRST' ? UI.badge('NEW', 'First month the security appears') : UI.badge(e.status);
          const detail = e.status === 'EXITED' ? `Last held ${esc(M.months[e.prev].label)} at ${w(e.prev)}` : e.status === 'FIRST' ? `First observed at ${w(e.mi)}${e.mi === avail[0] ? ' — the portfolio’s first month of data, so it may have been held earlier' : ''}` : `${w(e.mi)}${e.prev >= 0 ? ` (not held in ${esc(M.months[e.prev].label)})` : ''}`;
          return `<li><span class="tnum">${esc(M.months[e.mi].label)}</span><span>${label}</span><span>${detail}</span></li>`;
        })
        .join('')}</ul>` })}
      ${UI.card({ span: 12, title: 'Holding periods', flush: true, body: '<div id="st-runs"></div>' })}
    </div>`;
    UI.table(document.getElementById('st-runs'), {
      id: 'st-runs',
      caption: 'Holding periods',
      rows: runs.map((r, i) => {
        let pk = null;
        for (const mi of M.availIn(pid, r.start, r.end)) if (!pk || ser.w[mi] > pk.w) pk = { w: ser.w[mi], mi };
        return { i: i + 1, r, pk };
      }),
      unit: 'period',
      sort: { key: 'i', dir: 'asc' },
      exportName: K.exp(M, pid, U.shortName(M.secName(sid), 30), 'holding_periods'),
      columns: [
        { key: 'i', label: 'Period', num: true, value: (x) => x.i, html: (x) => '#' + x.i },
        { key: 'start', label: 'From', value: (x) => x.r.start, html: (x) => esc(M.months[x.r.start].label), csv: (x) => M.months[x.r.start].key },
        { key: 'end', label: 'To', value: (x) => x.r.end, html: (x) => esc(M.months[x.r.end].label), csv: (x) => M.months[x.r.end].key },
        { key: 'n', label: 'Months', num: true, value: (x) => x.r.n, html: (x) => U.int(x.r.n) },
        { key: 'ws', label: 'Allocation at start', num: true, value: (x) => ser.w[x.r.start], html: (x) => UI.pctCell(ser.w[x.r.start]) },
        { key: 'we', label: 'Allocation at end', num: true, value: (x) => ser.w[x.r.end], html: (x) => UI.pctCell(ser.w[x.r.end]) },
        { key: 'pk', label: 'Peak', num: true, value: (x) => (x.pk ? x.pk.w : null), html: (x) => (x.pk ? `${U.pct(x.pk.w)} <span class="muted">${esc(M.months[x.pk.mi].short)}</span>` : '—') },
      ],
    });
  }

  /* ------------------------------------------------------------------ */
  function month(body, S, M, sid) {
    const pid = S.pid;
    const a = M.avail(pid);
    const m1 = S.stockMonth != null ? S.stockMonth : S.mi;
    const pvm = M.prevAvail(pid, m1);
    const m2 = S.stockCmpMonth != null ? S.stockCmpMonth : pvm >= 0 ? pvm : a[0];
    const P = (mi) => (mi >= 0 ? M.pos(pid, mi, sid) : undefined);
    const p1 = P(m1), p0 = P(pvm), p2 = P(m2);
    const row = (label, get, fmt, diff) => {
      const v1 = p1 ? get(p1, m1) : null, v0 = p0 ? get(p0, pvm) : null, v2 = p2 ? get(p2, m2) : null;
      const cell = (p, v, mi) => (mi < 0 ? UI.noData('No earlier month') : !p ? UI.notHeld() : fmt(v));
      const d = (x, y, px, py) => (diff && (px || py) ? diff(x, y, px, py) : '—');
      return `<tr><th scope="row">${esc(label)}</th><td class="num">${cell(p1, v1, m1)}</td><td class="num">${cell(p0, v0, pvm)}</td><td class="num">${pvm < 0 ? '—' : d(v1, v0, p1, p0)}</td><td class="num">${cell(p2, v2, m2)}</td><td class="num">${d(v1, v2, p1, p2)}</td></tr>`;
    };
    const ppDiff = (x, y, px, py) => UI.ppCell((px ? x : 0) - (py ? y : 0));
    const rankDiff = (x, y) => (U.isNum(x) && U.isNum(y) ? (y - x > 0 ? `<span class="pos">▲ ${y - x}</span>` : y - x < 0 ? `<span class="neg">▼ ${x - y}</span>` : '0') : '—');
    const relDiff = (x, y) => (U.isNum(x) && U.isNum(y) ? UI.chgCell(U.relChange(y, x)) : '—');
    const txt = (v) => esc(v == null ? '(blank)' : v);
    const txtDiff = (x, y, px, py) => (px && py ? (x === y ? '<span class="muted">same</span>' : '<strong>changed</strong>') : '—');
    body.innerHTML = UI.card({
      title: `${esc(M.secName(sid))} in ${esc(M.months[m1].label)}`,
      sub: 'Position at one month, compared with the previous available month and with any other month you choose.',
      actions: `<label class="ctl-label" for="st-m1">Month</label><select id="st-m1">${UI.monthOptions(a, m1)}</select><label class="ctl-label" for="st-m2">Compare with</label><select id="st-m2">${UI.monthOptions(a, m2)}</select>`,
      body: `<div class="table-wrap"><table class="dt" data-test="month-view"><caption class="visually-hidden">Position in a month</caption><thead><tr><th scope="col">Measure</th><th class="num" scope="col">${esc(M.months[m1].label)}</th><th class="num" scope="col">Previous${pvm >= 0 ? ' (' + esc(M.months[pvm].label) + ')' : ''}</th><th class="num" scope="col">Change vs previous</th><th class="num" scope="col">${esc(M.months[m2].label)}</th><th class="num" scope="col">Change vs ${esc(M.months[m2].short)}</th></tr></thead><tbody>
        ${row('Allocation', (p) => p.w, (v) => UI.pctCell(v), ppDiff)}
        ${row('Rank (equity shares)', (p, mi) => M.rank(pid, mi, sid), (v) => (v ? '#' + v : UI.na()), rankDiff)}
        ${row('Quantity', (p) => p.qty, U.qty, relDiff)}
        ${row('Market value', (p) => p.mv, U.cr, relDiff)}
        ${row('Price (adjusted)', (p) => p.px, U.price, relDiff)}
        ${row('Sector', (p) => p.sector, txt, txtDiff)}
        ${row('Market cap', (p) => p.mcap, txt, txtDiff)}
        ${row('Asset', (p) => p.asset, txt, txtDiff)}
        ${row('Asset Type', (p) => p.assetType, txt, txtDiff)}
      </tbody></table></div>`,
    });
    // the month of the month view is the dashboard's as-of month, so the top bar and this view always agree
    body.querySelector('#st-m1').addEventListener('change', (e) => HPI.setState({ mi: +e.target.value, stockMonth: null, stockCmpMonth: null }));
    body.querySelector('#st-m2').addEventListener('change', (e) => HPI.setState({ stockCmpMonth: +e.target.value }));
  }

  /* ------------------------------------------------------------------ */
  function compare(body, S, M, sid, mis) {
    const pid = S.pid;
    const items = K.securityItems(M, pid, S.mi).filter((it) => it.id !== sid);
    const b = S.secB != null && S.secB !== sid ? S.secB : null;
    body.innerHTML = `<div class="toolbar"><span class="ctl-label">Compare ${esc(M.secName(sid))} with</span><div id="st-pickb"></div></div><div id="st-cmp"></div>`;
    UI.combo(document.getElementById('st-pickb'), { id: 'st-comb', label: 'Second security', placeholder: 'Choose a second security…', items, value: b, onSelect: (id) => HPI.setState({ secB: id }) });
    const out = document.getElementById('st-cmp');
    if (b == null) { out.innerHTML = UI.empty('Choose a second security to compare.', 'Both securities are shown for the same portfolio and months.'); return; }
    const sa = M.series(pid, sid), sb = M.series(pid, b);
    const labels = K.labels(M, mis), titles = K.titles(M, mis);
    out.innerHTML = `<div class="grid">
      ${UI.card({ span: 8, title: 'Allocation', sub: '% of fund; gaps mean not held', body: UI.chart('cmp-a', 'tall', 'Allocation comparison') })}
      ${UI.card({ span: 4, title: 'Relative allocation', sub: `${esc(U.shortName(M.secName(sid), 24))} minus ${esc(U.shortName(M.secName(b), 24))}, difference in allocation (months when both are held)`, body: UI.chart('cmp-r', 'tall', 'Relative allocation') })}
      ${UI.card({ span: 12, title: 'Month by month', flush: true, body: '<div id="cmp-t"></div>' })}
    </div>`;
    const va = mis.map((mi) => (sa.state[mi] === 2 ? sa.w[mi] : null)), vb = mis.map((mi) => (sb.state[mi] === 2 ? sb.w[mi] : null));
    C.line(document.getElementById('cmp-a'), { labels, titles, unit: 'pct', markerIndex: K.marker(mis, S.mi), datasets: [{ label: M.secName(sid), data: va, color: C.A }, { label: M.secName(b), data: vb, color: C.B }] });
    C.line(document.getElementById('cmp-r'), { labels, titles, unit: 'pp', zero: true, datasets: [{ label: 'Difference', data: mis.map((mi, i) => (va[i] != null && vb[i] != null ? va[i] - vb[i] : null)), color: '#6b7c93', unit: 'pp' }] });
    const rows = mis.slice().reverse().map((mi) => {
      const prev = M.prevAvail(pid, mi);
      return { mi, a: sa.state[mi] === 2 ? sa.w[mi] : null, b: sb.state[mi] === 2 ? sb.w[mi] : null, ra: M.rank(pid, mi, sid), rb: M.rank(pid, mi, b), sta: prev >= 0 ? M.statusOf(pid, sid, prev, mi, S.movBasis) : null, stb: prev >= 0 ? M.statusOf(pid, b, prev, mi, S.movBasis) : null };
    });
    UI.table(document.getElementById('cmp-t'), {
      id: 'cmp-t',
      caption: 'Stock comparison',
      rows,
      unit: 'month',
      pageSize: 50,
      sort: { key: 'mi', dir: 'desc' },
      exportName: K.exp(M, pid, 'stock_comparison', U.shortName(M.secName(sid), 20), U.shortName(M.secName(b), 20)),
      columns: [
        { key: 'mi', label: 'Month', value: (r) => r.mi, html: (r) => esc(M.months[r.mi].label), csv: (r) => M.months[r.mi].key },
        { key: 'a', label: U.shortName(M.secName(sid), 26), num: true, value: (r) => r.a, html: (r) => UI.pctCell(r.a) },
        { key: 'b', label: U.shortName(M.secName(b), 26), num: true, value: (r) => r.b, html: (r) => UI.pctCell(r.b) },
        { key: 'd', label: 'Difference', num: true, value: (r) => (r.a != null && r.b != null ? r.a - r.b : null), html: (r) => (r.a != null && r.b != null ? UI.ppCell(r.a - r.b) : '<span class="faint">—</span>') },
        { key: 'ra', label: 'Rank A', num: true, value: (r) => r.ra, html: (r) => (r.ra ? '#' + r.ra : '—') },

  }

  /* ------------------------------------------------------------------ */
  function funds(body, S, M, sid) {
    const sec = M.sec(sid);

        { key: 'rank', label: 'Rank', num: true, value: (r) => r.rank, html: (r) => (r.rank ? '#' + r.rank : '—') },
        { key: 'qty', label: 'Quantity', num: true, value: (r) => (r.ps ? r.ps.qty : null), html: (r) => (r.ps ? U.qty(r.ps.qty) : '—') },
        { key: 'mv', label: 'Market value', num: true, value: (r) => (r.ps ? r.ps.mv : null), html: (r) => (r.ps ? U.cr(r.ps.mv) : '—') },
        { key: 'first', label: 'First observed', value: (r) => r.first, html: (r) => esc(M.months[r.first].label), csv: (r) => M.months[r.first].key },
        { key: 'last', label: 'Last observed', value: (r) => r.last, html: (r) => esc(M.months[r.last].label), csv: (r) => M.months[r.last].key },

  }
})();

  /* ------------------------------------------------------------------ */
  function all(body, S, M, scope, rebase) {

    const prevGroups = prev >= 0 ? M.groupBy(S.pid, prev, 'sector', scope) : [];
    const rows = cur.map((e, i) => ({ key: e.key, label: e.label, w: wOf(mi, e.key), wp: prev >= 0 ? wOf(prev, e.key) : null, n: e.n, rank: i + 1, prevRank: prev >= 0 ? prevGroups.findIndex((g) => g.key === e.key) + 1 || null : null }));
    for (const g of prevGroups) if (!keysNow.has(g.key)) rows.push({ key: g.key, label: g.label, w: null, wp: wOf(prev, g.key), n: 0, rank: null, prevRank: prevGroups.indexOf(g) + 1, gone: true });
    const comp = K.compose(M, S.pid, mis, 'sector', scope, rebase);
    const labels = K.labels(M, mis), titles = K.titles(M, mis);
    const ds = K.topDatasets(M, comp, 10, 'sector', 'Other sectors');
    if (S.sector && comp.keys.includes(S.sector)) {
      for (const d of ds) d.dim = d.key !== S.sector;
      if (!ds.find((d) => d.key === S.sector)) ds.unshift({ key: S.sector, label: M.dimLabel('sector', S.sector), data: comp.series.get(S.sector), color: '#16242c' });

    body.innerHTML = `<div class="grid">

          cols: mis,

          rows: comp.keys.map((k) => ({ key: k, label: `<button type="button" class="linkish" style="color:var(--ink)" data-sector-open="${esc(k)}">${esc(M.dimLabel('sector', k))}</button>`, cells: comp.series.get(k).map((v, j) => (comp.counts.get(k)[j] ? { kind: 'v', v, text: U.fmt(v, 2) } : { kind: 'nh' })) })),
        }),

    UI.table(document.getElementById('sc-snap'), {
      id: 'sc-snap',
      caption: 'Sector allocation',

      pageSize: 50,
      search: (r) => r.label,
      searchPlaceholder: 'Filter sectors…',
      exportName: K.exp(M, S.pid, 'sectors', scope, rebase, K.key(M, mi)),
      rowClass: (r) => (r.key === S.sector ? 'sel' : ''),
      onRowClick: (r) => HPI.setState({ sector: r.key, tabs: Object.assign({}, S.tabs, { sector: 'detail' }) }),
      columns: [
        { key: 'rank', label: 'Rank', num: true, value: (r) => r.rank, html: (r) => (r.rank ? '#' + r.rank : '—') },

        { key: 'w', label: 'Allocation', num: true, value: (r) => r.w, html: (r) => (r.w == null ? '<span class="nodata">No holdings</span>' : U.pct(r.w)), csv: (r) => r.w },

        { key: 'dw', label: 'Allocation change', num: true, value: (r) => (prev < 0 ? null : (r.w || 0) - (r.wp || 0)), html: (r) => (prev < 0 ? '—' : UI.ppCell((r.w || 0) - (r.wp || 0))) },
        { key: 'rel', label: 'Relative change', num: true, value: (r) => (r.w != null && r.wp != null ? U.relChange(r.wp, r.w) : null), html: (r) => (r.w != null && r.wp != null ? UI.chgCell(U.relChange(r.wp, r.w)) : '<span class="faint">—</span>') },
        { key: 'prevRank', label: 'Previous rank', num: true, value: (r) => r.prevRank, html: (r) => (r.prevRank ? '#' + r.prevRank : '—') },

    C.stack(document.getElementById('sc-stack'), { labels, titles, unit: 'pct', markerIndex: K.marker(mis, S.mi), datasets: ds, onClick: (i, di) => { const k = ds[di] && ds[di].key; if (k && k !== '__other__') HPI.setState({ sector: k, tabs: Object.assign({}, S.tabs, { sector: 'detail' }) }); } });
    body.querySelectorAll('[data-sector-open]').forEach((b) => b.addEventListener('click', () => HPI.setState({ sector: b.getAttribute('data-sector-open'), tabs: Object.assign({}, S.tabs, { sector: 'detail' }) })));
  }

  /* ------------------------------------------------------------------ */
  function detail(body, S, M, scope, rebase) {
    const mi = S.mi;
    const mis = K.months(M, S);
    const keysAll = M.dimKeys(S.pid, M.avail(S.pid), 'sector', scope);
    const cur = M.groupBy(S.pid, mi, 'sector', scope);
    const key = S.sector && keysAll.includes(S.sector) ? S.sector : cur.length ? cur[0].key : keysAll[0];
    const pv = SH.prevLabel(S.pid, mi);
    const prev = pv ? pv.prev : -1;
    const wOf = (m, k) => K.weightOf(M, S.pid, m, 'sector', scope, k, rebase);
    const series = mis.map((m) => wOf(m, key));
    let hi = null, lo = null;
    mis.forEach((m, i) => { const v = series[i]; if (v != null) { if (!hi || v > hi.v) hi = { v, m }; if (!lo || v < lo.v) lo = { v, m }; } });
    const g = M.groupMap(S.pid, mi, 'sector', scope).get(key);
    const gp = prev >= 0 ? M.groupMap(S.pid, prev, 'sector', scope).get(key) : null;
    const w = wOf(mi, key), wp = prev >= 0 ? wOf(prev, key) : null;
    const secTotal = g ? g.w : 0;
    const ranks = M.ranks(S.pid, mi);
    // constituents: current positions + those exited since previous month
    const cons = [];
    if (g) for (const ps of g.positions) cons.push({ sec: ps.sec, ps, pp: prev >= 0 ? M.pos(S.pid, prev, ps.sec) : undefined });
    if (gp) for (const ps of gp.positions) if (!g || !g.positions.find((x) => x.sec === ps.sec)) cons.push({ sec: ps.sec, ps: undefined, pp: ps });
    for (const c of cons) c.st = prev >= 0 ? M.statusOf(S.pid, c.sec, prev, mi, S.movBasis) : null;
    // constituent history (stacked) over the range
    const inRange = new Map();
    for (const m of mis) { const e = M.groupMap(S.pid, m, 'sector', scope).get(key); if (e) for (const ps of e.positions) inRange.set(ps.sec, (inRange.get(ps.sec) || 0) + ps.w); }
    const order = Array.from(inRange.entries()).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    const tops = order.slice(0, 8);
    const rest = order.slice(8);
    const csum = (m) => { const e = M.groupMap(S.pid, m, 'sector', scope); let t = 0; for (const x of e.values()) t += x.w; return t; };
    const scale = (m, v) => (rebase === 'scope' ? (csum(m) ? (v / csum(m)) * 100 : 0) : v);
    const cds = tops.map((sid, i) => ({ label: M.secName(sid), data: mis.map((m) => { const ps = M.pos(S.pid, m, sid); return ps && ps.sector === key ? scale(m, ps.w) : 0; }), color: C.color(i) }));
    if (rest.length) cds.push({ label: `Other stocks (${rest.length})`, data: mis.map((m) => rest.reduce((s, sid) => { const ps = M.pos(S.pid, m, sid); return s + (ps && ps.sector === key ? scale(m, ps.w) : 0); }, 0)), color: C.OTHER });
